<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-qb · 辅种管理</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 图标 sprite: use 引用, 无外部图标库依赖(继承 .ico 的 stroke/fill) -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
    <symbol id="i-caret" viewBox="0 0 16 16"><path d="M6.5 3.8 11 8l-4.5 4.2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.8 3.6v8.8M10.2 3.6v8.8"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5.2 3.3 12.4 8l-7.2 4.7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.55-3.6"/><path d="M13.3 2.8v2.7h-2.7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3.4 5h9.2M6.4 5V3.5h3.2V5M5 5l.6 8h4.8L11 5"/></symbol>
    <symbol id="i-trash-x" viewBox="0 0 16 16"><path d="M3.4 5h9.2M6.4 5V3.5h3.2V5M5 5l.6 8h4.8L11 5M11.6 10.6l3 3M14.6 10.6l-3 3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 16 16"><path d="M2.8 9.6 5 4.2h6l2.2 5.4v2.2H2.8z"/><path d="M2.8 9.6h3l.7 1.4h3l.7-1.4h3"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 3.1 14.2 13.2H1.8z"/><path d="M8 6.6v3.1M8 11.4v.7"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.6 8.4 6.6 11.4 12.6 4.8"/></symbol>
    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4"/><path d="M8 7.4v3.4M8 5.3v.7"/></symbol>
    <!-- 品牌: orbit 轨道(330° 轨道弧 + 绿色种子点 + 中心圆), 与 favicon / assets/icons 设计一致 -->
    <symbol id="i-orbit" viewBox="0 0 16 16"><path d="M4.9 3.6A5.4 5.4 0 1 0 11.1 3.6" fill="none"/><circle cx="11.1" cy="3.6" r="1.7" fill="var(--green)" stroke="none"/><circle cx="8" cy="8" r="2.1"/></symbol>
    <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.4v7.8M4.9 7.1 8 10.2l3.1-3.1M3.2 12.9h9.6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 16 16"><path d="M8 10.8V3M4.9 6.1 8 3l3.1 3.1M3.2 12.9h9.6"/></symbol>
    <symbol id="i-tag" viewBox="0 0 16 16"><path d="M3 7.8V3.2h4.6L13 8.6 8.6 13z"/><path d="M5.6 5.7v.01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2.4 12.7V4.1h3.9l1.3 1.7h6v6.9z"/><path d="M2.4 7.6h11.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M3 5.4h10M3 10.6h10"/><circle cx="6.2" cy="5.4" r="1.6"/><circle cx="10.2" cy="10.6" r="1.6"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 16 16"><path d="M2.8 12.1a5.6 5.6 0 1 1 10.4 0"/><path d="M8 8.7 11.4 6"/><circle cx="8" cy="9.4" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-width="1.9"/><circle cx="12" cy="12" r="3.1" stroke-width="1.9"/></symbol>
    <symbol id="i-list" viewBox="0 0 16 16"><path d="M3 4.4h10M3 8h10M3 11.6h6.2"/></symbol>
    <symbol id="i-cards" viewBox="0 0 16 16"><path d="M8 2.6 13.6 5.6 8 8.6 2.4 5.6z"/><path d="M2.4 8.6 8 11.6l5.6-3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 16 16"><path d="M6.2 12.8h3.6"/><path d="M8 3a3.1 3.1 0 0 0-3.1 3.1v2.7L3.9 11h8.2l-1-2.2V6.1A3.1 3.1 0 0 0 8 3z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 2.4 12.8 4.3v3.9c0 3-2.1 5.2-4.8 6.1-2.7-.9-4.8-3.1-4.8-6.1V4.3z"/><path d="M8 6.1v2.7M8 10.6v.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.7V8l2.3 1.6"/></symbol>
    <symbol id="i-hdd" viewBox="0 0 16 16"><path d="M2.8 9.3h10.4v3.2H2.8z"/><path d="M5 9.3 5.6 4h4.8l.6 5.3"/><path d="M11.1 11.1v.01M9 11.1v.01"/></symbol>
    <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5 9.5 6.5"/><path d="M6.9 4.7l.8-.8a2.3 2.3 0 0 1 3.3 3.3l-.8.8M9.1 11.3l-.8.8a2.3 2.3 0 0 1-3.3-3.3l.8-.8"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M8.9 2.3 4.3 9.1h3L6.1 13.7 11.6 7h-3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 16 16"><path d="M2.6 4h10.8v6.9H2.6z"/><path d="M6.4 13.2h3.2M8 10.9v2.3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M2.6 8h10.8"/><path d="M8 2.4c1.5 1.6 2.3 3.5 2.3 5.6S9.5 12 8 13.6C6.5 12 5.7 10.1 5.7 8S6.5 4 8 2.4z"/></symbol>
    <!-- 操作/编辑类图标(阶段 1 新增: 筛选/列选择/显隐/重命名/复制/折叠/排序等) -->
    <symbol id="i-filter" viewBox="0 0 16 16"><path d="M2.3 3.4h11.4L9.4 8.5v4.3l-2.8-1.4V8.5z"/></symbol>
    <symbol id="i-columns" viewBox="0 0 16 16"><rect x="2.2" y="3" width="3.4" height="10" rx="1"/><rect x="6.3" y="3" width="3.4" height="10" rx="1"/><rect x="10.4" y="3" width="3.4" height="10" rx="1"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.7 8S4.3 4.2 8 4.2 14.3 8 14.3 8 11.7 11.8 8 11.8 1.7 8 1.7 8z"/><circle cx="8" cy="8" r="1.9"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 16 16"><path d="M6.3 4.4A6.9 6.9 0 0 1 8 4.2c3.7 0 6.3 3.8 6.3 3.8a12.6 12.6 0 0 1-2.1 2.5"/><path d="M4.3 5.6A12.8 12.8 0 0 0 1.7 8s2.6 3.8 6.3 3.8a6.6 6.6 0 0 0 2.3-.4"/><path d="M3.3 3.3 12.7 12.7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M11.1 3.1l1.8 1.8-7 7-2.4.7.6-2.4z"/><path d="M9.9 4.3l1.8 1.8"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.7" y="5.7" width="7.9" height="7.9" rx="1.4"/><path d="M10.3 5.7V4a1.4 1.4 0 0 0-1.4-1.4H4A1.4 1.4 0 0 0 2.6 4v4.9A1.4 1.4 0 0 0 4 10.3h1.7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M4.3 6.3 8 10l3.7-3.7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M2.9 8a5.1 5.1 0 1 0 1.6-3.7"/><path d="M2.6 2.7V5.4h2.7"/></symbol>
    <symbol id="i-sort" viewBox="0 0 16 16"><path d="M5 6.3 8 3.2l3 3.1"/><path d="M5 9.7 8 12.8l3-3.1"/></symbol>
    <symbol id="i-hash" viewBox="0 0 16 16"><path d="M6.5 2.6 5.1 13.4M10.9 2.6 9.5 13.4M2.8 5.9h10.4M2.6 10.1h10.4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 16 16"><path d="M2.7 2.6v10.8h10.7"/><path d="M5.3 10.9 8 7.5l2 1.8 2.9-4.2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 16 16"><path d="M8 2.4l5.8 3L8 8.4 2.2 5.4z"/><path d="M2.2 8.7 8 11.7l5.8-3"/><path d="M2.2 11.4 8 14.4l5.8-3"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.7"/><path d="M6.1 6.1l3.8 3.8M9.9 6.1l-3.8 3.8"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.7"/><path d="M5.5 8.2 7.2 10l3.4-3.9"/></symbol>
    <symbol id="i-external" viewBox="0 0 16 16"><path d="M9 3.3h3.7v3.7"/><path d="M12.7 3.3 7.5 8.5"/><path d="M12 9.7v2.5a1.6 1.6 0 0 1-1.6 1.6H4.3a1.6 1.6 0 0 1-1.6-1.6V6.1a1.6 1.6 0 0 1 1.6-1.6h2.5"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 16 16"><path d="M1.8 8.3h2.6l1.7-4.3 2.5 8.1 1.7-3.8h2.9"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 16 16"><path d="M2.5 12.4V4.3h3.6l1.2 1.6h4.2v1.4"/><path d="M2.5 12.4l1.9-5.1h9.1l-1.9 5.1z"/></symbol>
    <symbol id="i-drag" viewBox="0 0 16 16"><circle cx="6.1" cy="4.6" r=".95" fill="currentColor" stroke="none"/><circle cx="9.9" cy="4.6" r=".95" fill="currentColor" stroke="none"/><circle cx="6.1" cy="8" r=".95" fill="currentColor" stroke="none"/><circle cx="9.9" cy="8" r=".95" fill="currentColor" stroke="none"/><circle cx="6.1" cy="11.4" r=".95" fill="currentColor" stroke="none"/><circle cx="9.9" cy="11.4" r=".95" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 16 16"><path d="M8 12.6V3.6M4.4 7.2 8 3.6l3.6 3.6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 16 16"><path d="M8 3.4v9M4.4 8.8 8 12.4l3.6-3.6"/></symbol>
    <!-- HR/限速/流量类图标(2026-09-14 打磨新增): 沿用 16×16 + stroke 1.7 约定,
         颜色一律由 CSS 令牌提供(不在此写死), 见 style.css 的 .ico-* 语义色映射 -->
    <symbol id="i-hr" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.6V8l2.4 1.5"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3"/></symbol>
    <symbol id="i-percent" viewBox="0 0 16 16"><path d="M12.4 3.6 3.6 12.4"/><circle cx="4.7" cy="4.7" r="1.6"/><circle cx="11.3" cy="11.3" r="1.6"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 16 16"><path d="M4.3 2.5h7.4M4.3 13.5h7.4"/><path d="M5.2 2.5v2.3L8 8l-2.8 3.2v2.3M10.8 2.5v2.3L8 8l2.8 3.2v2.3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 16 16"><rect x="2.6" y="3.7" width="10.8" height="9.5" rx="1.6"/><path d="M2.6 6.7h10.8M5.7 2.4v2.5M10.3 2.4v2.5"/></symbol>
    <symbol id="i-timer" viewBox="0 0 16 16"><circle cx="8" cy="9" r="4.9"/><path d="M8 6.3V9l1.9 1.3M6.3 1.7h3.4M8 1.7v2.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.7" y="7.2" width="8.6" height="6.1" rx="1.6"/><path d="M5.7 7.2V5.5a2.3 2.3 0 0 1 4.6 0v1.7"/></symbol>
    <symbol id="i-ellipsis" viewBox="0 0 16 16"><circle cx="3.7" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="12.3" cy="8" r="1.15" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 16 16"><path d="M4.3 9.7 8 6l3.7 3.7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 2.2 9.3 6.4 13.5 7.7 9.3 9 8 13.2 6.7 9 2.5 7.7 6.7 6.4z"/></symbol>
  </svg>

  <div id="app" v-cloak>
    <!-- 密钥输入(未授权时): 遮罩仅由 authRequired 把守, 验证通过前主界面 DOM 不渲染(防错误密钥闪现) -->
    <div v-if="authRequired" class="login-mask">
      <form class="login-card" @submit.prevent="saveToken">
        <div class="brand">
          <span class="brand-mark"><img class="brand-img" src="/icon.png" alt=""></span>
          <span>auto-qb</span>
        </div>
        <p class="muted">请输入 WEB 访问密钥(见启动日志或 data_dir/web.token)</p>
        <input v-model="tokenInput" type="password" placeholder="访问密钥" autocomplete="current-password" required>
        <button type="submit" :disabled="!tokenInput.trim() || authPending">{{ authPending ? '验证中…' : '进入' }}</button>
        <button v-if="authErrorKind === 'unavailable'" type="button" class="secondary"
                @click="retryAuth" :disabled="authPending">重试连接</button>
        <p v-if="authError" class="error">{{ authError }}</p>
      </form>
    </div>

    <template v-else>
      <div class="sticky-head">
        <!-- 服务不可达横幅(程序退出/网络失败) -->
        <div v-if="serviceDown" class="service-banner">
          ⚠ 无法连接 auto-qb 服务 —— 程序可能已退出或正在重启, 请确认程序运行后页面将自动恢复
        </div>
        <!-- 顶栏 -->
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark"><img class="brand-img" src="/icon.png" alt=""></span>
            <span>auto-qb</span>
            <span class="ver">v{{ status.version || '—' }}</span>
          </div>
          <nav class="tabs">
            <button :class="{ active: page === 'groups' }" @click="page = 'groups'">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-cards"></use></svg>辅种管理
            </button>
            <button :class="{ active: page === 'settings' }" @click="openSettings">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-settings"></use></svg>设置
            </button>
          </nav>
          <div v-if="page === 'groups'" class="top-search">
            <div class="search-box">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-search"></use></svg>
              <input v-model="searchQuery" @input="onSearchInput" @keyup.enter="doSearch"
                     placeholder="搜索种子名或文件名…" autocomplete="off" />
              <button v-if="searchQuery" class="search-clear" title="清除搜索" @click="clearSearch">
                <svg class="ico" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
              </button>
            </div>
            <span v-if="searchBuilding" class="muted"><svg class="ico ico-sm spin" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg> 构建索引…</span>
            <span v-if="searchError" class="error">{{ searchError }}</span>
          </div>
          <!-- 列选择器(紧邻搜索框, 见想法.md): 显示/隐藏列 + 列宽重置/适应窗口;
               选项**不显示勾选框**, 点击整行切换(与筛选器下拉统一风格) -->
          <div v-if="page === 'groups'" class="col-picker">
            <button class="table-tool" :class="{ active: colMenuOpen }" title="显示/隐藏列 · 列宽"
                    @click.stop="colMenuOpen = !colMenuOpen">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-columns"></use></svg>
              列
              <span v-if="hiddenCount" class="tool-badge">{{ hiddenCount }}</span>
            </button>
            <div v-if="colMenuOpen" class="col-menu" @click.stop>
              <div class="col-menu-title">分组表</div>
              <div v-for="c in groupColumns" :key="c.key" class="col-menu-item"
                   :class="{ locked: c.locked, on: colVisible('group', c.key) }"
                   role="button" :tabindex="c.locked ? -1 : 0" :aria-pressed="colVisible('group', c.key)"
                   @click="!c.locked && toggleColumn('group', c.key)"
                   @keyup.enter="!c.locked && toggleColumn('group', c.key)">
                <span class="col-mark"><svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-check"></use></svg></span>
                <span>{{ c.label }}</span>
              </div>
              <div class="col-menu-title">明细表</div>
              <div v-for="c in detailColumns" :key="c.key" class="col-menu-item"
                   :class="{ locked: c.locked, on: colVisible('detail', c.key) }"
                   role="button" :tabindex="c.locked ? -1 : 0" :aria-pressed="colVisible('detail', c.key)"
                   @click="!c.locked && toggleColumn('detail', c.key)"
                   @keyup.enter="!c.locked && toggleColumn('detail', c.key)">
                <span class="col-mark"><svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-check"></use></svg></span>
                <span>{{ c.label }}</span>
              </div>
              <div class="col-menu-actions">
                <button class="ce-btn ghost small" @click="resetAllColumnWidths('group'); resetAllColumnWidths('detail')">
                  恢复默认列宽
                </button>
                <button class="ce-btn ghost small" @click="fitColumnsToWindow('group'); fitColumnsToWindow('detail')">
                  适应窗口宽度
                </button>
              </div>
            </div>
          </div>
          <div class="spacer"></div>
          <!-- 统计槽: 图标与名称紧跟数值(定宽槽会把标题与数值拉远); 速度类给温和最小宽防抖动 -->
          <div class="stat-pills">
            <span class="stat-pill" title="辅种组总数">
              <svg class="ico ico-sm ico-group" viewBox="0 0 16 16"><use href="#i-cards"></use></svg>分组 <b>{{ groups.length }}</b>
            </span>
            <span class="stat-pill" title="种子总数">
              <svg class="ico ico-sm ico-store" viewBox="0 0 16 16"><use href="#i-hdd"></use></svg>种子 <b>{{ totalTorrents }}</b>
            </span>
            <span class="stat-pill wide pill-speed" title="全部组下载速度合计">
              <svg class="ico ico-sm ico-down" viewBox="0 0 16 16"><use href="#i-download"></use></svg>下载 <b>{{ fmtSpeed(totalDl) }}</b>
            </span>
            <span class="stat-pill wide pill-speed" title="全部组上传速度合计">
              <svg class="ico ico-sm ico-up" viewBox="0 0 16 16"><use href="#i-upload"></use></svg>上传 <b>{{ fmtSpeed(totalUl) }}</b>
            </span>
            <!-- 今日累计上传/下载(数据源: Traffic Monitor; 未启用限速曲线时不渲染) -->
            <span v-if="trafficOn && todayTraffic" class="stat-pill wide pill-today"
                  :title="'今日累计上传/下载(数据源 Traffic Monitor' + (traffic.date ? ', ' + traffic.date : '') + ')'">
              <svg class="ico ico-sm ico-up" viewBox="0 0 16 16"><use href="#i-upload"></use></svg>
              <b>{{ fmtSize(todayTraffic.up) }}</b>
              <span class="sep">/</span>
              <svg class="ico ico-sm ico-down" viewBox="0 0 16 16"><use href="#i-download"></use></svg>
              <b>{{ fmtSize(todayTraffic.down) }}</b>
            </span>
            <!-- 限速对照: 一致只显示命中值; 不一致显示"命中 / 实际"并把原因放进悬停提示 -->
            <span v-for="r in limitRows" :key="r.dir" class="stat-pill wide pill-limit"
                  :class="{ mismatch: r.mismatch, manual: r.reason && r.reason.code === 'manual' }"
                  :title="r.tip">
              <svg v-if="r.reason && r.reason.code === 'manual'" class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-lock"></use></svg>
              <svg v-else class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-gauge"></use></svg>
              {{ r.label }}
              <b>{{ fmtLimit(r.target) }}</b>
              <template v-if="r.mismatch"> / {{ fmtLimit(r.actual) }}</template>
            </span>
            <span class="stat-pill pill-refresh" title="当前刷新间隔(无变化/服务不可达时自动放慢)">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-clock"></use></svg>刷新 <b>{{ pollLabel }}s</b>
            </span>
          </div>
          <span class="badge" :class="[statusBadge.kind, { pending: statusBadge.kind === 'warn' }]">
            <i class="dot"></i>{{ statusBadge.text }}
          </span>
        </header>
        <!-- 状态分布条 + 筛选器(仅辅种页): 分布由已加载的 groups 前端聚合, 点击 chip 按状态筛选 -->
        <div v-if="page === 'groups' && distTotal" class="status-strip">
          <div class="dist-bar" :title="distTitle">
            <span v-for="s in distSegments" :key="s.kind" :class="'k-' + s.kind" :style="{ width: s.pct + '%' }"></span>
          </div>
          <div class="dist-legend">
            <button v-for="s in distSegments" :key="s.kind" class="dist-chip"
                    :class="['k-' + s.kind, { active: kindFilter === s.kind }]"
                    :title="'仅显示' + s.text + '的辅种组'" @click="toggleKindFilter(s.kind)">
              <span class="swatch"></span>{{ s.text }} <b>{{ s.count }}</b>
            </button>
          </div>
          <!-- 当前筛选/搜索说明: 紧跟状态图例之后(无筛选时不占据任何空间) -->
          <span v-if="filtersActive" class="strip-note">
            <template v-if="searchQuery.trim()">搜索“{{ searchQuery.trim() }}” </template>
            <template v-if="kindFilter">状态“{{ kindText(kindFilter) }}” </template>
            <template v-if="tagFilter.length">标签“{{ tagFilter.join('/') }}” </template>
            <template v-if="categoryFilter.length">分类“{{ categoryFilter.join('/') }}” </template>
            <template v-if="siteFilter.length">站点“{{ siteFilter.join('/') }}” </template>
            <template v-if="pathFilter.length">路径“{{ pathFilter.join(' / ') }}” </template>
            → <b>{{ filteredGroups.length }}</b> 个辅种组<template v-if="searchQuery.trim()">(仅命中成员高亮)</template>
            <template v-if="searchBuilding"> · 索引构建中…</template>
          </span>
          <div class="strip-tools">
            <!-- 筛选器下拉(标签/分类/站点/路径): 定义见 app.js filterDefs, 四个共用一份模板;
                 点击整行即选中/取消(不显示勾选框), 计数徽标绝对定位 -> 选中数不改变按钮宽度 -->
            <div v-for="f in filterDefs" :key="f.kind" class="filter-pop">
              <button class="filter-btn" :class="{ active: f.selected.length }"
                      :title="'按' + f.label + '筛选辅种组(可多选)'"
                      @click.stop="toggleFilterMenu(f.kind)">
                <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="'#' + f.icon"></use></svg>
                {{ f.label }}
                <span v-if="f.selected.length" class="filter-count">{{ f.selected.length }}</span>
                <svg class="ico ico-sm filter-caret" viewBox="0 0 16 16"><use href="#i-chevron"></use></svg>
              </button>
              <div v-if="filterMenu === f.kind" class="pop-menu" @click.stop>
                <div class="pop-head">
                  <span>{{ f.label }}</span>
                  <button v-if="f.selected.length" class="pop-clear" @click="clearFilter(f.field)">清除</button>
                </div>
                <div v-for="o in f.options" :key="o.value" class="pop-item"
                     :class="{ on: isFilterOn(f.field, o.value) }"
                     role="button" tabindex="0" :aria-pressed="isFilterOn(f.field, o.value)"
                     @click="toggleFilterValue(f.field, o.value)"
                     @keyup.enter="toggleFilterValue(f.field, o.value)"
                     @keyup.space.prevent="toggleFilterValue(f.field, o.value)">
                  <span class="pop-value">{{ o.value || '(空)' }}</span>
                  <span class="pop-count">{{ o.count }}</span>
                </div>
                <p v-if="!f.options.length" class="pop-empty">暂无数据</p>
              </div>
            </div>
            <!-- 清除筛选: **常驻占位**(无筛选时 visibility:hidden) —— 若用 v-if 会出现/消失,
                 会把同一行的筛选器整组左右推动, 与用户"需要固定位置"的诉求相違 -->
            <button class="dist-chip clear" :class="{ 'is-off': !filtersActive }"
                    :disabled="!filtersActive" @click="clearFilters()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>清除筛选
            </button>
          </div>
        </div>
      </div>

      <!-- 辅种分组页 -->
      <main v-if="page==='groups'" class="content">

        <div class="group-table" ref="groupTable">
          <!-- 列头(点击排序, 右缘拖拽调宽, 双击按内容自适应) -->
          <div class="group-head" ref="groupHead" :style="gridStyle('group')">
            <div v-for="col in visibleGroupCols" :key="col.key" class="h-cell"
                 :class="{sortable: col.sortable}" @click="col.sortable && setSort(col.key)">
              <span>{{ col.label }}</span>
              <span v-if="col.sortable" class="arrow">{{ sortArrow(col.key) }}</span>
              <span class="resizer" title="拖拽调宽(Shift 拖 = 与相邻列互挤) · 双击按内容自适应"
                    @mousedown.stop.prevent="startResize($event, 'group', col.key)"
                    @dblclick.stop.prevent="autoFitColumn($event, 'group', col.key)"></span>
            </div>
          </div>

          <template v-for="g in filteredGroups" :key="g.key">
            <!-- 单元格按「可见列」渲染: 顺序与 grid 模板同源(见 app.js 列模型), 不会再错位 -->
            <div class="group-row" :class="['s-' + g.status.primary, { expanded: expandedKey===g.key, 'search-hit': g.hit }]"
                 :style="gridStyle('group')"
                 @click="toggleExpand(g.key, $event)"
                 @contextmenu.prevent="openMenu($event, g)">
              <template v-for="col in visibleGroupCols" :key="col.key">
                <div v-if="col.key === 'name'" class="g-name" :title="g.name">
                  <svg class="ico ico-sm caret" viewBox="0 0 16 16"><use href="#i-caret"></use></svg>
                  <span class="g-status" :class="'k-' + g.status.primary" :title="'组内状态: ' + g.status.text">
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="kindIcon(g.status.primary)"></use></svg>
                  </span>
                  <span class="g-name-text">{{ g.name }}</span>
                </div>
                <div v-else-if="col.key === 'dlspeed'" class="g-stat" :class="{ zero: !g.dlspeed }">{{ fmtSpeedOrDash(g.dlspeed) }}</div>
                <div v-else-if="col.key === 'upspeed'" class="g-stat" :class="{ zero: !g.upspeed }">{{ fmtSpeedOrDash(g.upspeed) }}</div>
                <div v-else-if="col.key === 'uploaded'" class="g-stat" :class="{ zero: !g.uploaded }">{{ fmtSizeOrDash(g.uploaded) }}</div>
                <div v-else-if="col.key === 'size'" class="g-stat" :class="{ zero: !g.size }">
                  {{ fmtSizeOrDash(g.size) }}
                  <span v-if="g.sizeMismatch" class="risk-mark"
                        title="组内成员种子大小不一致 —— 辅种可能指向不同文件, 需人工确认">⚠</span>
                </div>
                <div v-else-if="col.key === 'total_size'" class="g-stat" :class="{ zero: !g.total_size }">{{ fmtSizeOrDash(g.total_size) }}</div>
                <div v-else-if="col.key === 'tags'" class="g-tags" :title="g.commonTags.list.join(', ')">
                  <span v-for="t in g.commonTags.list.slice(0, 3)" :key="t" class="tag-chip"
                        :class="tagClass(t, g.members[0])">{{ t }}</span>
                  <span v-if="g.commonTags.list.length > 3" class="tag-more">+{{ g.commonTags.list.length - 3 }}</span>
                  <span v-if="!g.commonTags.list.length" class="zero">—</span>
                  <span v-if="g.commonTags.diff" class="diff-mark" title="组内标签不一致(此处仅显示共同标签)">±</span>
                </div>
                <div v-else-if="col.key === 'category'" class="g-cat">
                  <span v-if="g.commonCategory.value" class="cat-chip">{{ g.commonCategory.value }}</span>
                  <span v-else-if="g.commonCategory.diff" class="diff-mark" title="组内分类不一致">多分类</span>
                  <span v-else class="zero">—</span>
                </div>
                <div v-else-if="col.key === 'sites'" class="g-sites">
                  <span v-for="m in g.members" :key="m.hash"
                        class="site-chip" :class="[m.kind, { 'search-hit': m.hit }]" :title="m.site + ' · ' + kindText(m.kind)">
                    {{ m.site }}
                  </span>
                </div>
                <!-- H&R: 未满足做种时长/分享率的成员数 / 已触发 HR 的成员数(全部达标显示绿色对勾) -->
                <div v-else-if="col.key === 'hr'" class="g-hr" :class="hrGroupClass(g)" :title="hrGroupTitle(g)">
                  <span v-if="!g.hr_triggered" class="zero">—</span>
                  <template v-else-if="!g.hr_pending">
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-check-circle"></use></svg>
                    <span>已达标</span>
                  </template>
                  <template v-else>
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-hourglass"></use></svg>
                    <span class="hr-num">{{ g.hr_pending }}/{{ g.hr_triggered }}</span>
                  </template>
                </div>
                <div v-else-if="col.key === 'count'" class="g-count">{{ g.count }}</div>
              </template>
            </div>

            <!-- 展开明细: 紧跟本组行显示(列头 + 各分站点行) -->
            <div v-if="expandedKey===g.key" class="detail">
              <div class="detail-head" ref="detailHead" :style="gridStyle('detail')">
                <div v-for="col in visibleDetailCols" :key="col.key" class="h-cell">
                  <span>{{ col.label }}</span>
                  <span class="resizer" title="拖拽调宽(Shift 拖 = 与相邻列互挤) · 双击按内容自适应"
                        @mousedown.stop.prevent="startResize($event, 'detail', col.key)"
                        @dblclick.stop.prevent="autoFitColumn($event, 'detail', col.key)"></span>
                </div>
              </div>
              <div v-for="m in g.members" :key="m.hash"
                   class="member-row" :class="[m.kind, { 'search-hit': m.hit }]"
                   :style="gridStyle('detail')"
                   @contextmenu.prevent="openMemberMenu($event, m)">
                <template v-for="col in visibleDetailCols" :key="col.key">
                  <span v-if="col.key === 'site'" class="m-site"><i class="dot"></i>{{ m.site }}</span>
                  <span v-else-if="col.key === 'state'" class="m-state"><i class="dot"></i>{{ kindText(m.kind) }}</span>
                  <span v-else-if="col.key === 'dlspeed'" :class="{ zero: !m.dlspeed }">{{ fmtSpeedOrDash(m.dlspeed) }}</span>
                  <span v-else-if="col.key === 'upspeed'" :class="{ zero: !m.upspeed }">{{ fmtSpeedOrDash(m.upspeed) }}</span>
                  <span v-else-if="col.key === 'uploaded'" :class="{ zero: !m.uploaded }">{{ fmtSizeOrDash(m.uploaded) }}</span>
                  <span v-else-if="col.key === 'size'" :class="{ zero: !m.size }">{{ fmtSizeOrDash(m.size) }}</span>
                  <span v-else-if="col.key === 'tags'" class="m-tags" :title="(m.tags || []).join(', ')">
                    <span v-for="t in tagSlice(m.tags, 2)" :key="t" class="tag-chip" :class="tagClass(t, m)">{{ t }}</span>
                    <span v-if="(m.tags || []).length > 2" class="tag-more">+{{ m.tags.length - 2 }}</span>
                    <span v-if="!(m.tags || []).length" class="zero">—</span>
                  </span>
                  <span v-else-if="col.key === 'category'" class="m-cat" :title="m.category">
                    <span v-if="m.category" class="cat-chip">{{ m.category }}</span>
                    <span v-else class="zero">—</span>
                  </span>
                  <span v-else-if="col.key === 'progress'" class="m-progress">
                    <span class="bar"><i :style="{ width: Math.min(100, m.progress * 100) + '%' }"></i></span>
                    <span class="val">{{ (m.progress * 100).toFixed(1) }}%</span>
                  </span>
                  <span v-else-if="col.key === 'seeding_time'" class="m-pair" :class="hrTimeClass(m)">
                    {{ fmtDuration(m.seeding_time) }}
                    <span v-if="m.hr_triggered && m.hr_req_time" class="req">/ {{ fmtDuration(m.hr_req_time) }}</span>
                  </span>
                  <span v-else-if="col.key === 'ratio'" class="m-pair" :class="hrRatioClass(m)">
                    {{ (m.ratio || 0).toFixed(2) }}
                    <span v-if="m.hr_triggered && m.hr_req_ratio > 0" class="req">/ {{ m.hr_req_ratio.toFixed(2) }}</span>
                  </span>
                  <span v-else-if="col.key === 'hash'" class="m-hash" :title="m.hash">{{ m.hash.slice(0, 8) }}</span>
                </template>
              </div>
            </div>
          </template>

          <div v-if="!filteredGroups.length" class="empty">
            <svg class="ico" viewBox="0 0 16 16"><use href="#i-inbox"></use></svg>
            <span>
              {{ searchQuery.trim() ? (searchBuilding ? '正在构建文件索引…' : '无匹配种子')
                 : (filtersActive ? '当前筛选下没有辅种组' : '暂无辅种分组') }}
            </span>
          </div>
          <p v-if="searchQuery.trim() && searchBuilding && filteredGroups.length" class="muted center">
            正在构建文件索引, 文件匹配结果稍后自动补齐…
          </p>
        </div>

        <!-- 右键菜单(组/单种子共用; 坐标已做视口边界吸附, 由 JS 计算)
             · 开始 在 暂停 之前(正向操作在上, 破坏性操作在下)
             · 图标按语义着色(.ico-play/.ico-pause/.ico-sync/.ico-danger)
             · 删除只有一项: 是否连带磁盘文件在确认框里勾选(默认不删) -->
        <div v-if="menu.visible" class="ctx-menu" :style="{left: menu.x+'px', top: menu.y+'px'}" @contextmenu.prevent @click.stop>
          <template v-if="menu.hash">
            <div class="ctx-item" @click="actTorrent('resume')">
              <svg class="ico ico-sm ico-play" viewBox="0 0 16 16"><use href="#i-play"></use></svg>开始该种子
            </div>
            <div class="ctx-item" @click="actTorrent('pause')">
              <svg class="ico ico-sm ico-pause" viewBox="0 0 16 16"><use href="#i-pause"></use></svg>暂停该种子
            </div>
            <div class="ctx-item" @click="actTorrent('reannounce')">
              <svg class="ico ico-sm ico-sync" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg>强制汇报
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item danger" @click="delTorrent()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>删除该种子…
            </div>
          </template>
          <template v-else>
            <div class="ctx-item" @click="act('resume')">
              <svg class="ico ico-sm ico-play" viewBox="0 0 16 16"><use href="#i-play"></use></svg>开始整组
            </div>
            <div class="ctx-item" @click="act('pause')">
              <svg class="ico ico-sm ico-pause" viewBox="0 0 16 16"><use href="#i-pause"></use></svg>暂停整组
            </div>
            <div class="ctx-item" @click="act('reannounce')">
              <svg class="ico ico-sm ico-sync" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg>强制汇报
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item danger" @click="delGroup()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>删除整组…
            </div>
          </template>
        </div>
      </main>

      <!-- 设置页: 图形化配置(每项均可增删改, 无直接编辑 YAML 模式) -->
      <main v-if="page==='settings'" class="ce-page">
        <div v-if="cfg.loading" class="ce-placeholder">正在加载配置…</div>
        <div v-else-if="!cfg.schema" class="ce-placeholder">
          <p class="error">{{ cfg.error || '配置加载失败' }}</p>
          <button class="ce-btn" @click="cfgLoad()">重试</button>
        </div>
        <template v-else>
          <div class="ce-grid">
            <aside class="ce-side">
              <div class="ce-side-title">配置分组</div>
              <button v-for="g in cfgGroups" :key="g.key" class="ce-side-item"
                      :class="{ active: cfg.activeGroup === g.key }" @click="cfg.activeGroup = g.key">
                <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="'#' + g.icon"></use></svg>
                <span class="ce-side-label">{{ g.label }}</span>
                <span v-if="g.badge" class="ce-side-badge">{{ g.badge }}</span>
              </button>
            </aside>

            <section class="ce-main">
              <header class="ce-head">
                <div class="ce-head-text">
                  <h2>
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="'#' + (cfgActive.icon || 'i-settings')"></use></svg>
                    {{ cfgActive.label }}
                  </h2>
                  <p v-if="cfgActive.help" class="ce-sub">{{ cfgActive.help }}</p>
                </div>
                <div class="ce-head-actions">
                  <!-- 同步状态与 YAML 预览都属"全局上下文", 放在页头(页脚留给保存/放弃两个动作) -->
                  <span class="ce-sync" :class="{ on: cfgDirty }">
                    <svg class="ico ico-sm" viewBox="0 0 16 16">
                      <use :href="cfgDirty ? '#i-warn' : '#i-check-circle'"></use>
                    </svg>
                    {{ cfgDirty ? '有未保存的修改' : '已与磁盘同步' }}
                  </span>
                  <button class="ce-btn ghost small" :disabled="cfg.previewBusy" @click="cfgTogglePreview()">
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-external"></use></svg>
                    {{ cfg.previewOpen ? '收起 YAML' : (cfg.previewBusy ? '生成中…' : 'YAML 预览') }}
                  </button>
                </div>
              </header>

              <div v-if="cfg.notice" class="ce-banner" :class="cfg.noticeKind">{{ cfg.notice }}</div>

              <!-- 站点专段: 左列表 + 右详情 -->
              <div v-if="cfg.activeGroup === 'trackers'" class="ce-master-detail">
                <div class="ce-master">
                  <div class="ce-master-title">
                    站点配置
                    <button class="ce-icon flat" title="新增站点配置"
                            :class="{ open: cfg.addOpen === 'tracker' }" @click="cfgAddStart('tracker')">
                      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>
                    </button>
                  </div>
                  <button v-for="name in cfgTrackerNames()" :key="name" class="ce-master-item"
                          :class="{ active: cfg.trackerKey === name }" @click="cfg.trackerKey = name">{{ name }}</button>
                  <div v-if="cfg.addOpen === 'tracker'" class="ce-add-form">
                    <input ref="addInput" v-model="cfg.newTrackerName" class="ce-input" placeholder="站点配置名(如 HHan)"
                           @keyup.enter="cfgTrackerAdd()" @keyup.esc="cfgAddCancel()">
                    <div class="ce-add-form-actions">
                      <button class="ce-btn small" @click="cfgAddCancel()">取消</button>
                      <button class="ce-btn small primary" @click="cfgTrackerAdd()">添加</button>
                    </div>
                  </div>
                </div>
                <div v-if="cfg.trackerKey" class="ce-detail">
                  <div class="ce-card">
                    <div class="ce-detail-bar">
                      <strong class="ce-detail-title">{{ cfg.trackerKey }}</strong>
                      <span class="ce-spacer"></span>
                      <button class="ce-icon" title="重命名该站点配置" @click="cfgTrackerRename(cfg.trackerKey)">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-pencil"></use></svg>
                      </button>
                      <button class="ce-icon danger" title="删除该站点配置" @click="cfgTrackerRemove(cfg.trackerKey)">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                      </button>
                    </div>
                    <div class="ce-fields">
                      <ce-field v-for="item in cfgTrackerItems()" :key="item.path.join('.')" :item="item"></ce-field>
                    </div>
                  </div>
                </div>
                <div v-else class="ce-placeholder">暂无站点配置, 请在左侧新增</div>
              </div>

              <!-- 规则集专段: 规则集列表 + 规则卡(条件/动作) -->
              <div v-else-if="cfg.activeGroup === 'rules'" class="ce-master-detail">
                <div class="ce-master">
                  <div class="ce-master-title">
                    规则集
                    <button class="ce-icon flat" title="新增规则集"
                            :class="{ open: cfg.addOpen === 'ruleGroup' }" @click="cfgAddStart('ruleGroup')">
                      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>
                    </button>
                  </div>
                  <button v-for="name in cfgRuleGroupNames()" :key="name" class="ce-master-item"
                          :class="{ active: cfg.ruleGroupKey === name }" @click="cfg.ruleGroupKey = name">{{ name }}</button>
                  <div v-if="cfg.addOpen === 'ruleGroup'" class="ce-add-form">
                    <input ref="addInput" v-model="cfg.newRuleGroupName" class="ce-input" placeholder="规则集名(自动补 _rules)"
                           @keyup.enter="cfgRuleAddGroup()" @keyup.esc="cfgAddCancel()">
                    <div class="ce-add-form-actions">
                      <button class="ce-btn small" @click="cfgAddCancel()">取消</button>
                      <button class="ce-btn small primary" @click="cfgRuleAddGroup()">添加</button>
                    </div>
                  </div>
                </div>
                <div v-if="cfg.ruleGroupKey" class="ce-detail">
                  <div class="ce-card">
                    <div class="ce-detail-bar">
                      <strong class="ce-detail-title">{{ cfg.ruleGroupKey }}</strong>
                      <span class="ce-spacer"></span>
                      <button class="ce-icon danger" title="删除该规则集(含其中全部规则)" @click="cfgRuleRemoveGroup(cfg.ruleGroupKey)">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                      </button>
                    </div>
                    <p class="ce-help">规则按列表顺序执行; 每条规则内「条件全部满足」才执行「动作」(按顺序)。</p>
                  </div>

                  <div v-for="rn in cfgRuleNames(cfg.ruleGroupKey)" :key="rn" class="ce-rule-card"
                       :class="{ collapsed: cfgRuleCollapsed(cfg.ruleGroupKey, rn) }">
                    <div class="ce-rule-head">
                      <button class="ce-icon flat" :title="cfgRuleCollapsed(cfg.ruleGroupKey, rn) ? '展开' : '收起'"

                        <input type="checkbox" :checked="cfgRuleEnabled(cfg.ruleGroupKey, rn)"

                      </label>
                      <button class="ce-icon" title="重命名该规则" @click="cfgRuleRename(cfg.ruleGroupKey, rn)">

                      </button>
                      <button class="ce-icon danger" title="删除规则" @click="cfgRuleRemove(cfg.ruleGroupKey, rn)">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                      </button>
                    </div>
                    <p v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="ce-risk-line">
                      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>
                      <span>{{ cfgRuleRisk(cfg.ruleGroupKey, rn) }}</span>
                    </p>

                    <div v-show="!cfgRuleCollapsed(cfg.ruleGroupKey, rn)" class="ce-rule-body">
                      <div class="ce-fields">
                        <ce-field v-for="item in cfgRuleItems(cfg.ruleGroupKey, rn)" :key="item.path.join('.')" :item="item"></ce-field>
                      </div>

                    <div class="ce-plugins">
                      <div class="ce-plugins-head">
                        <span class="ce-plugins-title">条件<em class="ce-hint">全部满足才执行动作</em></span>
                        <button class="ce-add-btn inline" :class="{ open: cfgPickerIsOpen(cfg.ruleGroupKey, rn, 'conditions') }"
                                @click="cfgPickerOpen(cfg.ruleGroupKey, rn, 'conditions')">
                          <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>添加条件
                        </button>
                      </div>
                      <!-- 选项面板: 列出全部可用条件及其说明(替代不透明的下拉框) -->
                      <div v-if="cfgPickerIsOpen(cfg.ruleGroupKey, rn, 'conditions')" class="ce-picker">
                        <button v-for="p in cfgConditionOptions()" :key="p.name" class="ce-picker-item"
                                @click="cfgPluginAdd(cfg.ruleGroupKey, rn, 'conditions', p.name); cfgPickerClose()">
                          <span class="ce-picker-name">{{ p.label }}</span>
                          <span v-if="p.help" class="ce-picker-help">{{ p.help }}</span>
                        </button>
                      </div>
                      <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'conditions')" :key="i" class="ce-plugin-card">
                        <div class="ce-plugin-bar">
                          <span class="ce-ord">{{ i + 1 }}</span>
                          <select class="ce-input ce-inline-select" :value="cfgPluginName(entry)"
                                  @change="cfgPluginReplace(cfg.ruleGroupKey, rn, 'conditions', i, $event.target.value)">
                            <option v-for="p in cfgConditionOptions()" :key="p.name" :value="p.name">{{ p.label }}</option>
                          </select>
                          <span class="ce-spacer"></span>
                          <button class="ce-icon" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, -1)">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-up"></use></svg>
                          </button>
                          <button class="ce-icon" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, 1)">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-down"></use></svg>
                          </button>
                          <button class="ce-icon danger" title="删除该条件" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'conditions', i)">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                          </button>
                        </div>
                        <p v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).help" class="ce-help">{{ cfgPluginMeta(entry).help }}</p>
                        <div class="ce-fields">
                          <ce-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'conditions', i)"
                                    :key="item.path.join('.')" :item="item"></ce-field>
                        </div>
                      </div>
                      <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'conditions').length" class="ce-empty-hint">
                        未配置条件 = 对所有匹配该规则的种子执行动作
                      </p>
                    </div>

                    <div class="ce-plugins">
                      <div class="ce-plugins-head">
                        <span class="ce-plugins-title">动作<em class="ce-hint">按序号顺序执行</em></span>
                        <button class="ce-btn ghost small" @click="cfgIgnoreNextAdd(cfg.ruleGroupKey, rn)">+ 忽略下个动作错误</button>
                        <button class="ce-add-btn inline" :class="{ open: cfgPickerIsOpen(cfg.ruleGroupKey, rn, 'actions') }"
                                @click="cfgPickerOpen(cfg.ruleGroupKey, rn, 'actions')">
                          <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>添加动作
                        </button>
                      </div>
                      <div v-if="cfgPickerIsOpen(cfg.ruleGroupKey, rn, 'actions')" class="ce-picker">
                        <button v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" class="ce-picker-item"
                                :class="{ danger: !!p.risk }"
                                @click="cfgPluginAdd(cfg.ruleGroupKey, rn, 'actions', p.name); cfgPickerClose()">
                          <span class="ce-picker-name">
                            {{ p.label }}
                            <span v-if="p.risk" class="ce-risk" title="该动作存在风险">
                              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>风险
                            </span>
                          </span>
                          <span v-if="p.help" class="ce-picker-help">{{ p.help }}</span>
                        </button>
                      </div>
                      <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'actions')" :key="i" class="ce-plugin-card">
                        <div v-if="isIgnoreNext(entry)" class="ce-plugin-bar">
                          <span class="ce-pseudo">忽略下一个动作的错误</span>
                          <span class="ce-spacer"></span>
                          <select class="ce-input ce-inline-select" :value="cfgScalar(entry.ignore_next_action_error)"
                                  @change="cfgSetPath(cfgRulePath(cfg.ruleGroupKey, rn).concat(['actions', i, 'ignore_next_action_error']), $event.target.value)">
                            <option value="true">启用</option>
                            <option value="false">停用</option>
                          </select>
                          <button class="ce-icon danger" title="删除" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                          </button>
                        </div>
                        <template v-else>
                          <div class="ce-plugin-bar">
                            <span class="ce-ord">{{ i + 1 }}</span>
                            <select class="ce-input ce-inline-select" :value="cfgPluginName(entry)"
                                    @change="cfgPluginReplace(cfg.ruleGroupKey, rn, 'actions', i, $event.target.value)">
                              <option v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" :value="p.name">{{ p.label }}</option>
                            </select>
                            <span v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).risk" class="ce-risk" title="该动作存在风险">
                              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>风险
                            </span>
                            <span class="ce-spacer"></span>
                            <button class="ce-icon" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, -1)">
                              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-up"></use></svg>
                            </button>
                            <button class="ce-icon" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, 1)">
                              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-down"></use></svg>
                            </button>
                            <button class="ce-icon danger" title="删除该动作" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">
                              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                            </button>
                          </div>
                          <p v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).help" class="ce-help">{{ cfgPluginMeta(entry).help }}</p>
                          <p v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).risk" class="ce-risk-line">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>
                            <span>{{ cfgPluginMeta(entry).risk }}</span>
                          </p>
                          <div class="ce-fields">
                            <ce-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'actions', i)"
                                      :key="item.path.join('.')" :item="item"></ce-field>
                          </div>
                        </template>
                      </div>
                      <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'actions').length" class="ce-empty-hint">
                        未配置动作 = 规则只做条件判断, 不会执行任何操作
                      </p>
                    </div>
                    </div>
                  </div>

                  <div class="ce-sub-head">
                    <span class="ce-sub-title">规则</span>
                    <span class="ce-hint">{{ cfgRuleNames(cfg.ruleGroupKey).length }} 条</span>
                    <span class="ce-spacer"></span>
                    <button class="ce-btn ghost small" :class="{ open: cfg.addOpen === 'rule' }" @click="cfgAddStart('rule')">
                      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>新增规则
                    </button>
                  </div>
                  <div v-if="cfg.addOpen === 'rule'" class="ce-add-form">
                    <input ref="addInput" v-model="cfg.newRuleName" class="ce-input" placeholder="规则名(如 auto-skip-checking)"
                           @keyup.enter="cfgRuleAdd(cfg.ruleGroupKey)" @keyup.esc="cfgAddCancel()">
                    <div class="ce-add-form-actions">
                      <button class="ce-btn small" @click="cfgAddCancel()">取消</button>
                      <button class="ce-btn small primary" @click="cfgRuleAdd(cfg.ruleGroupKey)">添加</button>
                    </div>
                  </div>
                </div>
                <div v-else class="ce-placeholder">暂无规则集, 请在左侧新增</div>
              </div>

              <!-- 限速曲线专段: 每条曲线一张卡(周期 + 阶梯折线预览 + 档位表) -->
              <div v-else-if="cfg.activeGroup === 'speed'" class="ce-curve">
                <div v-if="!cfgCurveEnabled()" class="ce-card ce-curve-off">
                  <p class="ce-help">
                    未启用。启用后读取 Traffic Monitor 数据, 按累计流量自动分档设置 qB 全局限速(0 = 该档不限速)。
                  </p>
                  <button class="ce-btn primary" @click="cfgCurveEnable()">
                    <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>启用限速曲线
                  </button>
                </div>
                <template v-else>
                  <div class="ce-card">
                    <div class="ce-detail-bar">
                      <strong class="ce-detail-title">曲线设置</strong>
                      <span class="ce-spacer"></span>
                      <span class="ce-hint">多条曲线同时命中时取最严限速</span>
                      <button class="ce-btn ghost small" @click="cfgCurveAddPeriod()">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>添加曲线
                      </button>
                    </div>
                    <div class="ce-fields">
                      <ce-field v-for="item in cfgCurveItems()" :key="item.path.join('.')" :item="item"></ce-field>
                    </div>
                  </div>

                  <div v-for="(c, i) in cfgCurveList()" :key="i" class="ce-card ce-curve-card">
                    <div class="ce-detail-bar">
                      <span class="ce-curve-badge">{{ i + 1 }}</span>
                      <input class="ce-input ce-inline-input" :value="cfgCurvePeriod(i).period || ''"
                             placeholder="DAY / MONTH / 7D"
                             @input="cfgSetPath(cfgCurvePeriodPath(i).concat(['period']), $event.target.value)">
                      <span class="ce-hint">{{ cfgCurvePeriodHint(i) }}</span>
                      <span class="ce-spacer"></span>
                      <button class="ce-icon danger" title="删除该曲线" @click="cfgCurveRemovePeriod(i)">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                      </button>
                    </div>

                    <div v-for="dir in ['upload_curve', 'download_curve']" :key="dir" class="ce-curve-dir"
                         :class="dir === 'upload_curve' ? 'd-up' : 'd-down'">
                      <div class="ce-curve-dir-head">
                        <svg class="ico ico-sm" viewBox="0 0 16 16">
                          <use :href="dir === 'upload_curve' ? '#i-upload' : '#i-download'"></use>
                        </svg>
                        <span>{{ dir === 'upload_curve' ? '上传档位' : '下载档位' }}</span>
                        <span class="ce-hint">
                          {{ cfgCurvePoints(i, dir).length ? cfgCurvePoints(i, dir).length + ' 档' : '未配置 = 不管理该方向' }}
                        </span>
                        <span class="ce-spacer"></span>
                        <button class="ce-btn ghost small" @click="cfgCurvePointAdd(i, dir)">+ 添加档位</button>
                      </div>

                      <!-- 阶梯折线预览: 横轴累计流量, 纵轴限速(阈值为区间上限, 末档持续到无穷)
                           带 XY 刻度/网格线, 鼠标移入显示该位置所属档位的 (累计流量, 限速) -->
                      <div v-if="cfgCurveChartOf(i, dir)" class="ce-chart"
                           @mousemove="cfgChartHover($event, i, dir)" @mouseleave="cfgChartLeave()">
                        <!-- [ch] 别名技巧: 无构建链下避免把 chOf(i,dir) 重复写十几次 -->
                        <template v-for="ch in [cfgCurveChartOf(i, dir)]" :key="'ch' + i + dir">
                          <!-- viewBox 必须用**动态绑定**(v-bind 对象): 静态写法会被模板编译器小写成
                               `viewbox`(SVG 属性大小写敏感, 浏览器直接忽略) -> 坐标系不缩放, 内容溢出容器 -->
                          <svg class="ce-chart-svg" v-bind="{ viewBox: ch.viewBox }">
                            <g class="ce-grid-lines">
                              <line v-for="(tk, k) in ch.yTicks" :key="'gy' + k"
                                    :x1="ch.padL" :x2="ch.w - ch.padR" :y1="tk.pos" :y2="tk.pos"></line>
                            </g>
                            <path class="ce-chart-area" :d="ch.area"></path>
                            <line v-for="(p, j) in ch.points" :key="'tk' + j" class="ce-chart-tick"
                                  :x1="ch.padL + (ch.w - ch.padL - ch.padR) * (p.t / ch.spanT)"
                                  :x2="ch.padL + (ch.w - ch.padL - ch.padR) * (p.t / ch.spanT)"
                                  :y1="ch.padT" :y2="ch.baseY"></line>
                            <path class="ce-chart-line" :d="ch.line"></path>
                            <g v-if="cfgChartHovered(i, dir)">
                              <line class="ce-chart-cross" :x1="cfg.chartHover.x" :x2="cfg.chartHover.x"
                                    :y1="ch.padT" :y2="ch.baseY"></line>
                              <line class="ce-chart-cross" :x1="ch.padL" :x2="ch.w - ch.padR"
                                    :y1="cfg.chartHover.y" :y2="cfg.chartHover.y"></line>
                              <circle class="ce-chart-dot" :cx="cfg.chartHover.x" :cy="cfg.chartHover.y" r="4"></circle>
                            </g>
                            <g class="ce-axis-labels">
                              <text v-for="(tk, k) in ch.yTicks" :key="'ly' + k"
                                    :x="ch.padL - 7" :y="tk.pos + 3.5" text-anchor="end">{{ tk.label }}</text>
                              <text v-for="(tk, k) in ch.xTicks" :key="'lx' + k"
                                    :x="tk.pos" :y="ch.h - 10" text-anchor="middle">{{ tk.label }}</text>
                            </g>
                          </svg>
                          <div v-if="cfgChartHovered(i, dir)" class="ce-chart-tip"
                               :class="{ flip: cfg.chartHover.leftPct > 62 }"
                               :style="{ left: cfg.chartHover.leftPct + '%', top: cfg.chartHover.topPct + '%' }">
                            <b>第 {{ cfg.chartHover.index }} 档</b>
                            <span>累计流量 {{ cfg.chartHover.tLabel }}</span>
                            <span>限速 {{ cfg.chartHover.sLabel }}</span>
                          </div>
                          <div class="ce-chart-legend">
                            <span class="ce-lg-x">横轴: 累计流量</span>
                            <span class="ce-lg-y">纵轴: 限速</span>
                            <span class="ce-lg-note">{{ ch.note }}</span>
                          </div>
                        </template>
                      </div>
                      <p v-if="cfgCurveInvalid(i, dir)" class="ce-risk-line">
                        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>
                        <span>{{ cfgCurveInvalid(i, dir) }} 个档位无法解析(需形如 10GiB / 6MiB/s), 保存时后端会拒绝</span>
                      </p>

                      <div v-if="cfgCurvePoints(i, dir).length" class="ce-curve-points">
                        <div class="ce-curve-point-head">
                          <span>累计流量低于</span><span>限速</span><span></span>
                        </div>
                        <div v-for="(p, j) in cfgCurvePoints(i, dir)" :key="j" class="ce-curve-point">
                          <input class="ce-input" :value="cfgCurveThreshold(i, dir, j)" placeholder="10GiB"
                                 @input="cfgCurvePointSet(i, dir, j, $event.target.value)">
                          <input class="ce-input" :value="cfgCurveSpeed(i, dir, j)" placeholder="6MiB/s"
                                 @input="cfgCurvePointSet(i, dir, j, undefined, $event.target.value)">
                          <button class="ce-icon danger" title="删除该档位" @click="cfgCurvePointRemove(i, dir, j)">
                            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="ce-card">
                    <button class="ce-btn danger" @click="cfgCurveDisable()">关闭并移除曲线配置</button>
                  </div>
                </template>
              </div>

              <!-- 普通字段分组(卡片化) -->
              <div v-else class="ce-card">
                <div class="ce-fields">
                  <ce-field v-for="item in cfgActive.items" :key="item.path.join('.')" :item="item"></ce-field>
                </div>
              </div>

              <!-- 只读 YAML 预览(与即将写入磁盘的内容同源; 开关按钮在页头) -->
              <div v-if="cfg.previewOpen || cfg.previewError" class="ce-preview">
                <p v-if="cfg.previewError" class="error">{{ cfg.previewError }}</p>
                <pre v-if="cfg.previewOpen" class="ce-preview-body">{{ cfg.previewText }}</pre>
              </div>
            </section>
          </div>

          <footer class="ce-actions">
            <button class="ce-btn ghost" @click="cfgDiscard()">放弃修改</button>
            <button class="ce-btn primary" :disabled="cfg.saving || !cfgDirty" @click="cfgSave()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-check"></use></svg>
              {{ cfg.saving ? '保存中…' : '保存并热重载' }}
            </button>
          </footer>
        </template>
      </main>
    </template>

    <!-- 提示条与站内确认框: 全局单例(替代 alert/confirm/prompt, 视觉与主题一致) -->
    <div class="toast-wrap">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.kind">
        <svg class="ico ico-sm" viewBox="0 0 16 16">
          <use :href="t.kind === 'ok' ? '#i-check' : (t.kind === 'error' ? '#i-warn' : '#i-info')"></use>
        </svg>
        <span>{{ t.text }}</span>
      </div>
    </div>

    <div v-if="modal.visible" class="modal-mask" @click.self="resolveModal(false)">
      <div class="modal" :class="{ danger: modal.danger }" role="dialog" aria-modal="true">
        <div class="modal-title">
          <svg class="ico ico-sm" viewBox="0 0 16 16">
            <use :href="modal.danger ? '#i-warn' : '#i-info'"></use>
          </svg>
          <span>{{ modal.title }}</span>
        </div>
        <p class="modal-body">{{ modal.body }}</p>
        <input v-if="modal.input" ref="modalInput" v-model="modal.value" class="modal-input"
               :placeholder="modal.placeholder" @keyup.enter="resolveModal(true)">
        <label v-if="modal.checkbox" class="modal-check">
          <input type="checkbox" v-model="modal.checked">
          <span>{{ modal.checkbox }}</span>
        </label>
        <div class="modal-actions">
          <button class="ce-btn ghost" @click="resolveModal(false)">{{ modal.cancelText }}</button>
          <button class="ce-btn" :class="modal.danger ? 'danger' : 'primary'" @click="resolveModal(true)">
            {{ modal.okText }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 字段渲染组件模板(单一模板适配全部字段类型; 组件定义见 config_editor.js) -->
  <script type="text/x-template" id="tpl-ce-field">
    <div v-if="visible" class="ce-item">
      <!-- object 段标题 -->
      <div v-if="item.type === 'group'" class="ce-group-head" :style="indent">
        <span>{{ item.label }}</span>
        <span v-if="item.help" class="ce-inline-help">{{ item.help }}</span>
      </div>

      <!-- 相关设置子卡(schema group_of 归入父字段之下): 只放与父字段强相关的少量选项 -->
      <div v-else-if="item.type === 'subcard'" class="ce-subcard" :style="indent">
        <div class="ce-subcard-head">
          <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-caret"></use></svg>
          <span>{{ item.label }}</span>
        </div>
        <div class="ce-subcard-body">
          <ce-field v-for="sub in item.items" :key="sub.path.join('.')" :item="sub"></ce-field>
        </div>
      </div>

      <!-- 可选段(如站点 HR 规则 / checking 分支): **默认折叠**, 标题行仍可见开关与摘要 -->
      <div v-else-if="item.type === 'section'" class="ce-section" :class="{ 'ce-inactive': !sectionExists() }" :style="indent">
        <div class="ce-section-head">
          <button class="ce-icon flat" :title="sectionOpen ? '收起' : '展开'" @click="ce.cfgSectionToggle(path)">
            <svg class="ico ico-sm caret" viewBox="0 0 16 16"><use href="#i-caret"></use></svg>
          </button>
          <label class="ce-switch" title="控制该配置段是否写入配置文件">
            <input type="checkbox" :checked="sectionExists()" @change="toggleSection($event.target.checked)">
            <span class="ce-slider"></span>
          </label>
          <span class="ce-section-title">{{ f.label }}</span>
          <span class="ce-section-sum">{{ sectionSummary }}</span>
          <span v-if="f.risk" class="ce-risk" title="该段存在风险, 详见段内说明">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>风险
          </span>
        </div>
        <div v-show="sectionOpen && sectionExists()" class="ce-section-body">
          <ce-field v-for="sub in item.items" :key="sub.path.join('.')" :item="sub"></ce-field>
        </div>
      </div>

      <!-- 叶子字段: 未启用(grey_if 不满足)时灰显但仍可编辑
           仅 bare(插件 spec, 无标签)用单列满宽; 其余(含列表)保持"标签 | 控件"两列,
           这样所有输入框的左缘在整页任何位置都对齐 -->
      <div v-else class="ce-field" :class="{ 'ce-field-block': isBare, 'ce-inactive': greyed }" :style="indent">
        <label v-if="!isBare" class="ce-label">
          {{ f.label }}<span v-if="f.required" class="ce-req" title="必填">*</span>
          <span v-if="isDefault()" class="ce-tag" title="当前未显式配置, 此处显示默认值">默认</span>
          <span v-if="f.risk" class="ce-risk" title="该项存在风险, 详见下方说明">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg>风险
          </span>
          <!-- 布尔型从属项: 作为父字段的**内联额外开关**(比单独占一张子卡更符合从属语义) -->
          <label v-for="inl in item.inline" :key="inl.field.key" class="ce-switch ce-inline-switch"
                 :title="inl.field.risk || inl.field.help || ''">
            <input type="checkbox" :checked="inlineValue(inl)" @change="setInline(inl, $event.target.checked)">
            <span class="ce-slider"></span>
            <span class="ce-switch-text">{{ inl.field.label }}</span>
          </label>
        </label>
        <div class="ce-ctl">
          <label v-if="f.kind === 'bool'" class="ce-switch">
            <input type="checkbox" :checked="boolValue()" @change="setBool($event.target.checked)">
            <span class="ce-slider"></span>
            <span class="ce-switch-text">{{ boolValue() ? '启用' : '关闭' }}</span>
          </label>

          <select v-else-if="f.kind === 'enum'" class="ce-input ce-select" :value="textValue()" @change="set($event.target.value)">
            <option v-if="!f.required" value="">(未配置)</option>
            <option v-for="o in f.options" :key="o" :value="o">{{ o }}</option>
          </select>

              <div v-else-if="isList" class="ce-list">
            <div v-for="(it, i) in list()" :key="i" class="ce-list-row">
              <input class="ce-input" :value="it" :placeholder="f.placeholder || ''" @input="listSet(i, $event.target.value)">
              <button class="ce-icon danger" title="删除该项" @click="listRemove(i)">
                <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
              </button>
            </div>
            <button class="ce-btn ghost small" @click="listAdd()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>添加
            </button>
          </div>
          <!-- 规则引用: 输入框(可直接粘贴修改) + 下拉快捷追加(避免手写错规则集名) -->
          <div v-else-if="f.kind === 'rules_ref'" class="ce-list">
            <div v-for="(it, i) in list()" :key="i" class="ce-list-row">
              <input class="ce-input" :value="it" :placeholder="f.placeholder || '@规则集 或 @规则集.规则名'"
                     @input="listSet(i, $event.target.value)">
              <button class="ce-icon danger" title="删除该引用" @click="listRemove(i)">
                <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
              </button>
            </div>
            <div class="ce-list-row">
              <select class="ce-input ce-select" value="" @change="refPick($event)">
                <option value="">从已有规则集/规则中选择…</option>
                <optgroup v-for="g in ce.ceRefOptions()" :key="g.group" :label="g.group">
                  <option v-for="o in g.items" :key="o.value" :value="o.value">{{ o.label }}</option>
                </optgroup>
              </select>
              <button class="ce-btn ghost small" @click="listAdd()">
                <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-plus"></use></svg>手动添加
              </button>
            </div>
            <p v-if="!list().length" class="ce-help">留空 = 该站点不执行任何规则</p>
          </div>

          <div v-else-if="f.kind === 'keyed_list'" class="ce-checks">
            <label v-for="o in f.options" :key="o" class="ce-check">
              <input type="checkbox" :checked="checkedKey(o)" @change="toggleKey(o)">
              <span>{{ o }}</span>
            </label>
          </div>

          <!-- 数值 + 单位下拉: 时间/大小/速度统一拆为两半, 免去手写 30M / 10MiB / 6MiB/s -->
          <div v-else-if="hasUnit" class="ce-unit-group">
            <input class="ce-input ce-num" type="text" :value="unitParts.num" :placeholder="f.placeholder || ''"
                   @input="setUnitNum($event.target.value)">
            <select class="ce-input ce-select ce-unit-select" :value="unitParts.unit"
                    @change="setUnitName($event.target.value)">
              <option v-for="u in unitOptions" :key="u" :value="u">{{ u }}</option>
            </select>
          </div>

          <template v-else>
            <input class="ce-input" :type="f.kind === 'password' ? 'password' : 'text'" :value="textValue()"
                   :placeholder="f.placeholder || ''" :min="f.min" :max="f.max" @input="set($event.target.value)">
            <span v-if="f.unit" class="ce-unit">{{ f.unit }}</span>
          </template>

          <p v-if="f.help" class="ce-help">{{ f.help }}</p>
          <!-- 风险提示: 醒目标识(盾牌 + 橙红文字), 需明显区别于普通说明 -->
          <p v-if="f.risk" class="ce-risk-line">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-shield"></use></svg><span>{{ f.risk }}</span>
          </p>
        </div>
      </div>
    </div>
  </script>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/config_editor.js"></script>
  <script src="/config_rules.js"></script>
  <script src="/app.js"></script>
</body>
</html>
