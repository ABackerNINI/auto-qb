<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-qb · 辅种管理</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 图标 sprite: use 引用, 无外部图标库依赖(继承 .ico 的 stroke/fill) -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
    <symbol id="i-caret" viewBox="0 0 16 16"><path d="M6.5 3.8 11 8l-4.5 4.2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.8 3.6v8.8M10.2 3.6v8.8"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5.2 3.3 12.4 8l-7.2 4.7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.55-3.6"/><path d="M13.3 2.8v2.7h-2.7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3.4 5h9.2M6.4 5V3.5h3.2V5M5 5l.6 8h4.8L11 5"/></symbol>
    <symbol id="i-trash-x" viewBox="0 0 16 16"><path d="M3.4 5h9.2M6.4 5V3.5h3.2V5M5 5l.6 8h4.8L11 5M11.6 10.6l3 3M14.6 10.6l-3 3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 16 16"><path d="M2.8 9.6 5 4.2h6l2.2 5.4v2.2H2.8z"/><path d="M2.8 9.6h3l.7 1.4h3l.7-1.4h3"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 3.1 14.2 13.2H1.8z"/><path d="M8 6.6v3.1M8 11.4v.7"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.6 8.4 6.6 11.4 12.6 4.8"/></symbol>
    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4"/><path d="M8 7.4v3.4M8 5.3v.7"/></symbol>
  </svg>

  <div id="app" v-cloak>
    <!-- 密钥输入(未授权时): 遮罩仅由 authRequired 把守, 验证通过前主界面 DOM 不渲染(防错误密钥闪现) -->
    <div v-if="authRequired" class="login-mask">
      <form class="login-card" @submit.prevent="saveToken">
        <div class="brand">
          <span class="brand-mark"><svg class="ico" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg></span>
          <span>auto-qb</span>
        </div>
        <p class="muted">请输入 WEB 访问密钥(见启动日志或 data_dir/web.token)</p>
        <input v-model="tokenInput" type="password" placeholder="访问密钥" autocomplete="current-password" required>
        <button type="submit" :disabled="!tokenInput.trim() || authPending">{{ authPending ? '验证中…' : '进入' }}</button>
        <button v-if="authErrorKind === 'unavailable'" type="button" class="secondary"
                @click="retryAuth" :disabled="authPending">重试连接</button>
        <p v-if="authError" class="error">{{ authError }}</p>
      </form>
    </div>

    <template v-else>
      <div class="sticky-head">
        <!-- 服务不可达横幅(程序退出/网络失败) -->
        <div v-if="serviceDown" class="service-banner">
          ⚠ 无法连接 auto-qb 服务 —— 程序可能已退出或正在重启, 请确认程序运行后页面将自动恢复
        </div>
        <!-- 顶栏 -->
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark"><svg class="ico" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg></span>
            <span>auto-qb</span>
            <span class="ver">v{{ status.version || '—' }}</span>
          </div>
          <nav class="tabs">
            <button :class="{ active: page === 'groups' }" @click="page = 'groups'">辅种管理</button>
            <button :class="{ active: page === 'settings' }" @click="openSettings">设置</button>
          </nav>
          <div class="top-search">
            <div class="search-box">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-search"></use></svg>
              <input v-model="searchQuery" @input="onSearchInput" @keyup.enter="doSearch"
                     placeholder="搜索种子名或文件名…" autocomplete="off" />
              <button v-if="searchQuery" class="search-clear" title="清除搜索" @click="clearSearch">
                <svg class="ico" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
              </button>
            </div>
            <span v-if="searchBuilding" class="muted">构建索引…</span>
            <span v-if="searchError" class="error">{{ searchError }}</span>
          </div>
          <div class="spacer"></div>
          <div class="stat-pills">
            <span class="stat-pill">分组 <b>{{ groups.length }}</b></span>
            <span class="stat-pill">种子 <b>{{ totalTorrents }}</b></span>
            <span class="stat-pill">下载 <b>{{ fmtSpeed(totalDl) }}</b></span>
            <span class="stat-pill">上传 <b>{{ fmtSpeed(totalUl) }}</b></span>
            <span class="stat-pill">每 {{ pollLabel }}s</span>
          </div>
          <span class="badge" :class="[statusBadge.kind, { pending: statusBadge.kind === 'warn' }]">
            <i class="dot"></i>{{ statusBadge.text }}
          </span>
        </header>
        <!-- 状态分布条: 由已加载的 groups 前端聚合(点击 chip 按状态筛选, 仅辅种页) -->
        <div v-if="page === 'groups' && distTotal" class="status-strip">
          <div class="dist-bar" :title="distTitle">
            <span v-for="s in distSegments" :key="s.kind" :class="'k-' + s.kind" :style="{ width: s.pct + '%' }"></span>
          </div>
          <div class="dist-legend">
            <button v-for="s in distSegments" :key="s.kind" class="dist-chip"
                    :class="['k-' + s.kind, { active: kindFilter === s.kind }]"
                    :title="'仅显示' + s.text + '的辅种组'" @click="toggleKindFilter(s.kind)">
              <span class="swatch"></span>{{ s.text }} <b>{{ s.count }}</b>
            </button>
            <button v-if="kindFilter" class="dist-chip" @click="clearKindFilter()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>清除筛选
            </button>
          </div>
        </div>
      </div>

      <!-- 辅种分组页 -->
      <main v-if="page==='groups'" class="content">
        <p v-if="searchQuery.trim()" class="muted" style="text-align:center">
          搜索"{{ searchQuery.trim() }}": 命中 {{ filteredGroups.length }} 个辅种组(仅命中成员高亮)
        </p>
        <p v-else-if="kindFilter" class="muted" style="text-align:center">
          已按状态筛选"{{ kindText(kindFilter) }}": {{ filteredGroups.length }} 个辅种组
        </p>
        <div class="group-table" ref="groupTable">
          <!-- 列头(点击排序, 右缘拖拽调宽) -->
          <div class="group-head" :style="gridStyle('group')">
            <div v-for="(col, i) in groupColumns" :key="col.key" class="h-cell"
                 :class="{sortable: col.sortable}" @click="col.sortable && setSort(col.key)">
              <span v-if="col.key==='name'">名称</span>
              <span v-else-if="col.key==='dlspeed'">下载</span>
              <span v-else-if="col.key==='upspeed'">上传</span>
              <span v-else-if="col.key==='uploaded'">总上传</span>
              <span v-else-if="col.key==='size'">总大小</span>
              <span v-else-if="col.key==='count'">站数</span>
              <span v-else-if="col.key==='sites'">站点</span>
              <span v-if="col.sortable" class="arrow">{{ sortArrow(col.key) }}</span>
              <span class="resizer" @mousedown.stop.prevent="startResize($event, 'group', i)"></span>
            </div>
          </div>

          <template v-for="g in filteredGroups" :key="g.key">
            <div class="group-row" :class="{expanded: expandedKey===g.key}"
                 :style="gridStyle('group')"
                 @click="toggleExpand(g.key)"
                 @contextmenu.prevent="openMenu($event, g)">
              <div class="g-name" :title="g.name">
              <svg class="ico ico-sm caret" viewBox="0 0 16 16"><use href="#i-caret"></use></svg>
              <span>{{ g.name }}</span>
            </div>
              <div class="g-stat">↓ {{ fmtSpeed(g.dlspeed) }}</div>
              <div class="g-stat">↑ {{ fmtSpeed(g.upspeed) }}</div>
              <div class="g-stat">{{ fmtSize(g.uploaded) }}</div>
              <div class="g-stat">{{ fmtSize(g.size) }}</div>
              <div class="g-sites">
                <span v-for="m in g.members" :key="m.hash"
                      class="site-chip" :class="[m.kind, { 'search-hit': m.hit }]" :title="m.site + ' · ' + kindText(m.kind)">
                  {{ m.site }}
                </span>
              </div>
              <div class="g-count">{{ g.count }} 站</div>
            </div>

            <!-- 展开明细: 紧跟本组行显示(列头 + 合计行 + 各分站点行) -->
            <div v-if="expandedKey===g.key" class="detail">
              <div class="detail-head" :style="gridStyle('detail')">
                <div v-for="(col, i) in detailColumns" :key="col" class="h-cell">
                  <span>{{ col }}</span>
                  <span class="resizer" @mousedown.stop.prevent="startResize($event, 'detail', i)"></span>
                </div>
              </div>
              <div class="detail-summary" :style="gridStyle('detail')">
                <div>合计</div>
                <div></div>
                <div>{{ fmtSpeed(sumDl(g)) }}</div>
                <div>{{ fmtSpeed(sumUl(g)) }}</div>
                <div>{{ fmtSize(sumField(g.members, "uploaded")) }}</div>
                <div>{{ fmtSize(sumField(g.members, "size")) }}</div>
                <div></div>
                <div></div>
                <div></div>
              </div>
              <div v-for="m in g.members" :key="m.hash"
                   class="member-row" :class="[m.kind, { 'search-hit': m.hit }]"
                   :style="gridStyle('detail')"
                   @contextmenu.prevent="openMemberMenu($event, m)">
                <span class="m-site"><i class="dot"></i>{{ m.site }}</span>
                <span class="m-state"><i class="dot"></i>{{ kindText(m.kind) }}</span>
                <span>{{ fmtSpeed(m.dlspeed) }}</span>
                <span>{{ fmtSpeed(m.upspeed) }}</span>
                <span>{{ fmtSize(m.uploaded) }}</span>
                <span>{{ fmtSize(m.size) }}</span>
                <span class="m-progress">
                  <span class="bar"><i :style="{ width: Math.min(100, m.progress * 100) + '%' }"></i></span>
                  <span class="val">{{ (m.progress * 100).toFixed(1) }}%</span>
                </span>
                <span>{{ fmtDuration(m.seeding_time) }}</span>
                <span class="m-hash">{{ m.hash.slice(0, 8) }}</span>
              </div>
            </div>
          </template>

          <div v-if="!filteredGroups.length" class="empty">
            <svg class="ico" viewBox="0 0 16 16"><use href="#i-inbox"></use></svg>
            <span>
              {{ searchQuery.trim() ? (searchBuilding ? '正在构建文件索引…' : '无匹配种子')
                 : (kindFilter ? '当前筛选下没有辅种组' : '暂无辅种分组') }}
            </span>
          </div>
          <p v-if="searchQuery.trim() && searchBuilding && filteredGroups.length"
             class="muted" style="text-align:center">
            正在构建文件索引, 文件匹配结果稍后自动补齐…
          </p>
        </div>

        <!-- 右键菜单(组/单种子共用; 坐标已做视口边界吸附, 由 JS 计算) -->
        <div v-if="menu.visible" class="ctx-menu" :style="{left: menu.x+'px', top: menu.y+'px'}" @contextmenu.prevent @click.stop>
          <template v-if="menu.hash">
            <div class="ctx-item" @click="actTorrent('pause')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-pause"></use></svg>暂停该种子
            </div>
            <div class="ctx-item" @click="actTorrent('resume')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-play"></use></svg>开始该种子
            </div>
            <div class="ctx-item" @click="actTorrent('reannounce')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg>强制汇报
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item danger" @click="delTorrent(false)">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>删除(保留文件)
            </div>
            <div class="ctx-item danger" @click="delTorrent(true)">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash-x"></use></svg>删除(含文件)
            </div>
          </template>
          <template v-else>
            <div class="ctx-item" @click="act('pause')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-pause"></use></svg>暂停整组
            </div>
            <div class="ctx-item" @click="act('resume')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-play"></use></svg>开始整组
            </div>
            <div class="ctx-item" @click="act('reannounce')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg>强制汇报
            </div>
            <div class="ctx-sep"></div>
            <div class="ctx-item danger" @click="delWithFiles(false)">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash"></use></svg>删除整组(保留文件)
            </div>
            <div class="ctx-item danger" @click="delWithFiles(true)">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-trash-x"></use></svg>删除整组(含文件)
            </div>
          </template>
        </div>
      </main>

      <!-- 设置页: 图形化配置(每项均可增删改, 无直接编辑 YAML 模式) -->
      <main v-if="page==='settings'" class="ce-page">
        <div v-if="cfg.loading" class="ce-placeholder">正在加载配置…</div>
        <div v-else-if="!cfg.schema" class="ce-placeholder">
          <p class="error">{{ cfg.error || '配置加载失败' }}</p>
          <button class="ce-btn" @click="cfgLoad()">重试</button>
        </div>
        <template v-else>
          <div class="ce-grid">
            <aside class="ce-side">
              <button v-for="g in cfgGroups" :key="g.key" class="ce-side-item"
                      :class="{ active: cfg.activeGroup === g.key }" @click="cfg.activeGroup = g.key">
                <span>{{ g.label }}</span>
                <span v-if="g.badge" class="ce-side-badge">{{ g.badge }}</span>
              </button>
            </aside>

            <section class="ce-main">
              <header class="ce-head">
                <div>
                  <h2>{{ cfgActive.label }}</h2>
                  <p v-if="cfgActive.help" class="ce-sub">{{ cfgActive.help }}</p>
                </div>
                <span v-if="cfgDirty" class="ce-dirty">未保存</span>
              </header>

              <div v-if="cfg.notice" class="ce-banner" :class="cfg.noticeKind">{{ cfg.notice }}</div>

              <!-- 站点专段: 左列表 + 右详情 -->
              <div v-if="cfg.activeGroup === 'trackers'" class="ce-master-detail">
                <div class="ce-master">
                  <button v-for="name in cfgTrackerNames()" :key="name" class="ce-master-item"
                          :class="{ active: cfg.trackerKey === name }" @click="cfg.trackerKey = name">{{ name }}</button>
                  <div class="ce-add-row">
                    <input v-model="cfg.newTrackerName" class="ce-input" placeholder="新站点配置名"
                           @keyup.enter="cfgTrackerAdd()">
                    <button class="ce-btn" @click="cfgTrackerAdd()">添加</button>
                  </div>
                </div>
                <div v-if="cfg.trackerKey" class="ce-detail">
                  <div class="ce-detail-bar">
                    <strong>{{ cfg.trackerKey }}</strong>
                    <span class="ce-spacer"></span>
                    <button class="ce-btn ghost" @click="cfgTrackerRename(cfg.trackerKey)">重命名</button>
                    <button class="ce-btn danger" @click="cfgTrackerRemove(cfg.trackerKey)">删除</button>
                  </div>
                  <div class="ce-fields">
                    <ce-field v-for="item in cfgTrackerItems()" :key="item.path.join('.')" :item="item"></ce-field>
                  </div>
                </div>
                <div v-else class="ce-placeholder">暂无站点配置, 请在左侧新增</div>
              </div>

              <!-- 规则集专段: 规则集 + 规则 + 条件/动作 -->
              <div v-else-if="cfg.activeGroup === 'rules'" class="ce-master-detail">
                <div class="ce-master">
                  <button v-for="name in cfgRuleGroupNames()" :key="name" class="ce-master-item"
                          :class="{ active: cfg.ruleGroupKey === name }" @click="cfg.ruleGroupKey = name">{{ name }}</button>
                  <div class="ce-add-row">
                    <input v-model="cfg.newRuleGroupName" class="ce-input" placeholder="规则集名(自动补 _rules)"
                           @keyup.enter="cfgRuleAddGroup()">
                    <button class="ce-btn" @click="cfgRuleAddGroup()">添加</button>
                  </div>
                </div>
                <div v-if="cfg.ruleGroupKey" class="ce-detail">
                  <div class="ce-detail-bar">
                    <strong>{{ cfg.ruleGroupKey }}</strong>
                    <span class="ce-spacer"></span>
                    <button class="ce-btn danger" @click="cfgRuleRemoveGroup(cfg.ruleGroupKey)">删除规则集</button>
                  </div>

                  <div v-for="rn in cfgRuleNames(cfg.ruleGroupKey)" :key="rn" class="ce-rule-card">
                    <div class="ce-detail-bar">
                      <strong>{{ rn }}</strong>
                      <span class="ce-spacer"></span>
                      <button class="ce-btn ghost" @click="cfgRuleRename(cfg.ruleGroupKey, rn)">重命名</button>
                      <button class="ce-btn danger" @click="cfgRuleRemove(cfg.ruleGroupKey, rn)">删除</button>
                    </div>
                    <p v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="ce-warn">⚠️ {{ cfgRuleRisk(cfg.ruleGroupKey, rn) }}</p>

                    <div class="ce-fields">
                      <ce-field v-for="item in cfgRuleItems(cfg.ruleGroupKey, rn)" :key="item.path.join('.')" :item="item"></ce-field>
                    </div>

                    <div class="ce-plugins">
                      <div class="ce-plugins-head">
                        <span>条件(全部满足才执行动作)</span>
                        <select class="ce-input ce-inline-select" :value="''"
                                @change="cfgPluginAdd(cfg.ruleGroupKey, rn, 'conditions', $event.target.value); $event.target.value = ''">
                          <option value="">+ 添加条件…</option>
                          <option v-for="p in cfgConditionOptions()" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                      </div>
                      <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'conditions')" :key="i" class="ce-plugin-card">
                        <div class="ce-plugin-bar">
                          <select class="ce-input ce-inline-select" :value="cfgPluginName(entry)"
                                  @change="cfgPluginReplace(cfg.ruleGroupKey, rn, 'conditions', i, $event.target.value)">
                            <option v-for="p in cfgConditionOptions()" :key="p.name" :value="p.name">{{ p.label }}</option>
                          </select>
                          <span class="ce-spacer"></span>
                          <button class="ce-icon" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, -1)">↑</button>
                          <button class="ce-icon" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, 1)">↓</button>
                          <button class="ce-icon" title="删除" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'conditions', i)">✕</button>
                        </div>
                        <p v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).help" class="ce-help">{{ cfgPluginMeta(entry).help }}</p>
                        <div class="ce-fields">
                          <ce-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'conditions', i)"
                                    :key="item.path.join('.')" :item="item"></ce-field>
                        </div>
                      </div>
                      <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'conditions').length" class="ce-help">
                        未配置条件 = 对所有匹配该规则的种子执行动作
                      </p>
                    </div>

                    <div class="ce-plugins">
                      <div class="ce-plugins-head">
                        <span>动作(按顺序执行)</span>
                        <select class="ce-input ce-inline-select" :value="''"
                                @change="cfgPluginAdd(cfg.ruleGroupKey, rn, 'actions', $event.target.value); $event.target.value = ''">
                          <option value="">+ 添加动作…</option>
                          <option v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                        <button class="ce-btn ghost small" @click="cfgIgnoreNextAdd(cfg.ruleGroupKey, rn)">+ 忽略下个动作错误</button>
                      </div>
                      <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'actions')" :key="i" class="ce-plugin-card">
                        <div v-if="isIgnoreNext(entry)" class="ce-plugin-bar">
                          <span class="ce-pseudo">忽略下一个动作的错误</span>
                          <span class="ce-spacer"></span>
                          <select class="ce-input ce-inline-select" :value="cfgScalar(entry.ignore_next_action_error)"
                                  @change="cfgSetPath(cfgRulePath(cfg.ruleGroupKey, rn).concat(['actions', i, 'ignore_next_action_error']), $event.target.value)">
                            <option value="true">启用</option>
                            <option value="false">停用</option>
                          </select>
                          <button class="ce-icon" title="删除" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">✕</button>
                        </div>
                        <template v-else>
                          <div class="ce-plugin-bar">
                            <select class="ce-input ce-inline-select" :value="cfgPluginName(entry)"
                                    @change="cfgPluginReplace(cfg.ruleGroupKey, rn, 'actions', i, $event.target.value)">
                              <option v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" :value="p.name">{{ p.label }}</option>
                            </select>
                            <span class="ce-spacer"></span>
                            <button class="ce-icon" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, -1)">↑</button>
                            <button class="ce-icon" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, 1)">↓</button>
                            <button class="ce-icon" title="删除" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">✕</button>
                          </div>
                          <p v-if="cfgPluginMeta(entry) && cfgPluginMeta(entry).help" class="ce-help">{{ cfgPluginMeta(entry).help }}</p>
                          <div class="ce-fields">
                            <ce-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'actions', i)"
                                      :key="item.path.join('.')" :item="item"></ce-field>
                          </div>
                        </template>
                      </div>
                      <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'actions').length" class="ce-help">
                        未配置动作 = 规则只做条件判断, 不会执行任何操作
                      </p>
                    </div>
                  </div>

                  <div class="ce-add-row">
                    <input v-model="cfg.newRuleName" class="ce-input" placeholder="新规则名"
                           @keyup.enter="cfgRuleAdd(cfg.ruleGroupKey)">
                    <button class="ce-btn" @click="cfgRuleAdd(cfg.ruleGroupKey)">添加规则</button>
                  </div>
                </div>
                <div v-else class="ce-placeholder">暂无规则集, 请在左侧新增</div>
              </div>

              <!-- 限速曲线专段 -->
              <div v-else-if="cfg.activeGroup === 'speed'" class="ce-curve">
                <div v-if="!cfgCurveEnabled()" class="ce-curve-off">
                  <p class="ce-help">未启用。启用后按累计流量自动设置 qB 全局限速(0 = 该档不限速)。</p>
                  <button class="ce-btn" @click="cfgCurveEnable()">启用限速曲线</button>
                </div>
                <template v-else>
                  <div class="ce-fields">
                    <ce-field v-for="item in cfgCurveItems()" :key="item.path.join('.')" :item="item"></ce-field>
                  </div>
                  <div class="ce-plugins">
                    <div class="ce-plugins-head">
                      <span>曲线(多条同时命中时取最严限速)</span>
                      <button class="ce-btn ghost small" @click="cfgCurveAddPeriod()">+ 添加曲线</button>
                    </div>
                    <div v-for="(c, i) in cfgCurveList()" :key="i" class="ce-plugin-card">
                      <div class="ce-plugin-bar">
                        <input class="ce-input ce-inline-input" :value="cfgCurvePeriod(i).period || ''"
                               placeholder="DAY / MONTH / 7D"
                               @input="cfgSetPath(cfgCurvePeriodPath(i).concat(['period']), $event.target.value)">
                        <span class="ce-spacer"></span>
                        <button class="ce-icon" title="删除该曲线" @click="cfgCurveRemovePeriod(i)">✕</button>
                      </div>
                      <div v-for="dir in ['upload_curve', 'download_curve']" :key="dir" class="ce-curve-dir">
                        <div class="ce-curve-dir-head">
                          <span>{{ dir === 'upload_curve' ? '上传档位' : '下载档位' }}</span>
                          <button class="ce-btn ghost small" @click="cfgCurvePointAdd(i, dir)">+ 添加档位</button>
                        </div>
                        <p v-if="!cfgCurvePoints(i, dir).length" class="ce-help">未配置 = 不管理该方向</p>
                        <div v-for="(p, j) in cfgCurvePoints(i, dir)" :key="j" class="ce-curve-point">
                          <span class="ce-help">累计低于</span>
                          <input class="ce-input ce-inline-input" :value="cfgCurveThreshold(i, dir, j)" placeholder="10GiB"
                                 @input="cfgCurvePointSet(i, dir, j, $event.target.value)">
                          <span class="ce-help">时限速</span>
                          <input class="ce-input ce-inline-input" :value="cfgCurveSpeed(i, dir, j)" placeholder="6MiB/s"
                                 @input="cfgCurvePointSet(i, dir, j, undefined, $event.target.value)">
                          <button class="ce-icon" title="删除该档位" @click="cfgCurvePointRemove(i, dir, j)">✕</button>
                        </div>
                      </div>
                    </div>
                    <p v-if="!cfgCurveList().length" class="ce-help">未配置曲线 = 不进行任何限速</p>
                  </div>
                  <button class="ce-btn danger" @click="cfgCurveDisable()">关闭并移除曲线配置</button>
                </template>
              </div>

              <!-- 普通字段分组 -->
              <div v-else class="ce-fields">
                <ce-field v-for="item in cfgActive.items" :key="item.path.join('.')" :item="item"></ce-field>
              </div>

              <!-- 只读 YAML 预览(与即将写入磁盘的内容同源) -->
              <div class="ce-preview">
                <button class="ce-btn ghost" @click="cfgTogglePreview()" :disabled="cfg.previewBusy">
                  {{ cfg.previewOpen ? '收起 YAML 预览' : (cfg.previewBusy ? '生成中…' : '查看 YAML 预览') }}
                </button>
                <p v-if="cfg.previewError" class="error">{{ cfg.previewError }}</p>
                <pre v-if="cfg.previewOpen" class="ce-preview-body">{{ cfg.previewText }}</pre>
              </div>
            </section>
          </div>

          <footer class="ce-actions">
            <span class="ce-dirty-hint" :class="{ on: cfgDirty }">{{ cfgDirty ? '有未保存的修改' : '已与磁盘同步' }}</span>
            <button class="ce-btn ghost" @click="cfgDiscard()">放弃修改</button>
            <button class="ce-btn primary" :disabled="cfg.saving || !cfgDirty" @click="cfgSave()">
              {{ cfg.saving ? '保存中…' : '保存并热重载' }}
            </button>
          </footer>
        </template>
      </main>
    </template>

    <!-- 提示条与站内确认框: 全局单例(替代 alert/confirm/prompt, 视觉与主题一致) -->
    <div class="toast-wrap">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.kind">
        <svg class="ico ico-sm" viewBox="0 0 16 16">
          <use :href="t.kind === 'ok' ? '#i-check' : (t.kind === 'error' ? '#i-warn' : '#i-info')"></use>
        </svg>
        <span>{{ t.text }}</span>
      </div>
    </div>

    <div v-if="modal.visible" class="modal-mask" @click.self="resolveModal(false)">
      <div class="modal" :class="{ danger: modal.danger }" role="dialog" aria-modal="true">
        <div class="modal-title">
          <svg class="ico ico-sm" viewBox="0 0 16 16">
            <use :href="modal.danger ? '#i-warn' : '#i-info'"></use>
          </svg>
          <span>{{ modal.title }}</span>
        </div>
        <p class="modal-body">{{ modal.body }}</p>
        <input v-if="modal.input" ref="modalInput" v-model="modal.value" class="modal-input"
               :placeholder="modal.placeholder" @keyup.enter="resolveModal(true)">
        <div class="modal-actions">
          <button class="ce-btn ghost" @click="resolveModal(false)">{{ modal.cancelText }}</button>
          <button class="ce-btn" :class="modal.danger ? 'danger' : 'primary'" @click="resolveModal(true)">
            {{ modal.okText }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 字段渲染组件模板(单一模板适配全部字段类型; 组件定义见 config_editor.js) -->
  <script type="text/x-template" id="tpl-ce-field">
    <div v-if="visible" class="ce-item">
      <!-- object 段标题 -->
      <div v-if="item.type === 'group'" class="ce-group-head" :style="indent">
        <span>{{ item.label }}</span>
        <span v-if="item.help" class="ce-inline-help">{{ item.help }}</span>
      </div>

      <!-- 可选段开关(如站点 HR 规则): 控制该键是否写入配置 -->
      <div v-else-if="item.type === 'toggle'" class="ce-field ce-field-block" :style="indent">
        <label class="ce-label">{{ f.label }}</label>
        <div class="ce-ctl">
          <label class="ce-switch">
            <input type="checkbox" :checked="sectionExists()" @change="toggleSection($event.target.checked)">
            <span class="ce-slider"></span>
            <span class="ce-switch-text">{{ sectionExists() ? '已配置' : '未配置' }}</span>
          </label>
          <p v-if="f.help" class="ce-help">{{ f.help }}</p>
        </div>
      </div>

      <!-- 叶子字段 -->
      <div v-else class="ce-field" :class="{ 'ce-field-block': isList || isBare }" :style="indent">
        <label v-if="!isBare" class="ce-label">
          {{ f.label }}<span v-if="f.required" class="ce-req" title="必填">*</span>
          <span v-if="isDefault()" class="ce-tag" title="当前未显式配置, 此处显示默认值">默认</span>
        </label>
        <div class="ce-ctl">
          <label v-if="f.kind === 'bool'" class="ce-switch">
            <input type="checkbox" :checked="boolValue()" @change="setBool($event.target.checked)">
            <span class="ce-slider"></span>
            <span class="ce-switch-text">{{ boolValue() ? '启用' : '关闭' }}</span>
          </label>

          <select v-else-if="f.kind === 'enum'" class="ce-input" :value="textValue()" @change="set($event.target.value)">
            <option v-if="!f.required" value="">(未配置)</option>
            <option v-for="o in f.options" :key="o" :value="o">{{ o }}</option>
          </select>

          <div v-else-if="isList" class="ce-list">
            <div v-for="(it, i) in list()" :key="i" class="ce-list-row">
              <input class="ce-input" :value="it" :placeholder="f.placeholder || ''" @input="listSet(i, $event.target.value)">
              <button class="ce-icon" title="删除该项" @click="listRemove(i)">✕</button>
            </div>
            <button class="ce-btn ghost small" @click="listAdd()">+ 添加</button>
          </div>

          <div v-else-if="f.kind === 'keyed_list'" class="ce-checks">
            <label v-for="o in f.options" :key="o" class="ce-check">
              <input type="checkbox" :checked="checkedKey(o)" @change="toggleKey(o)">
              <span>{{ o }}</span>
            </label>
          </div>

          <template v-else>
            <input class="ce-input" :type="f.kind === 'password' ? 'password' : 'text'" :value="textValue()"
                   :placeholder="f.placeholder || ''" :min="f.min" :max="f.max" @input="set($event.target.value)">
            <span v-if="f.unit" class="ce-unit">{{ f.unit }}</span>
          </template>

          <p v-if="f.help" class="ce-help">{{ f.help }}</p>
        </div>
      </div>
    </div>
  </script>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/config_editor.js"></script>
  <script src="/config_rules.js"></script>
  <script src="/app.js"></script>
</body>
</html>
