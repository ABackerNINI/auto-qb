    <!-- 提示条与站内确认框: 全局单例(替代 alert/confirm/prompt, 视觉与主题一致) -->
    <div class="toast-wrap">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.kind">
        <svg class="ico ico-sm" :class="{ spin: t.kind === 'busy' }" viewBox="0 0 16 16">
          <use :href="{ ok: '#i-check', error: '#i-warn', busy: '#i-refresh', timeout: '#i-clock' }[t.kind] || '#i-info'"></use>
        </svg>
        <span>{{ t.text }}</span>
      </div>
    </div>

    <!-- 列头拖动虚影(FX-25): 跟随光标的列名胶囊。必须挂在 #app 根层 ——
         放进 .group-head 会因它的 will-change/transform 另建包含块, fixed 定位变成相对表头。 -->
    <div v-if="colGhost" class="col-ghost" :style="{ left: colGhost.x + 'px', top: colGhost.y + 'px' }">
      {{ colGhost.label }}
    </div>
