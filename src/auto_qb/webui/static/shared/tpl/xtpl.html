  <script type="text/x-template" id="tpl-hub-field">
    <div v-if="visible">
      <!-- 非叶子项三段: section(可选段) / group(普通 object 段) / subcard(父字段的相关设置子卡)
           WARN: 这三个分支**不能省** —— cfgFlatten 会把嵌套 object 展开成这三类项; 少了它们, 段项会
           落进下面叶子字段的 <input v-else> 分支, 值被 String(对象) 成 "[object Object]"
           (2026-09-25 实测: 站点页「HR 规则」「HR 在线核实」与规则页 checking 的两个分支都成了
           `[object Object]` —— 经典页 tpl-ce-field 有这三支, 清理死代码时随模板一起被删掉了)。
           子项递归回本组件(全局注册的 hub-field 可自引用), 与叶子字段共用同一套 cfg* 读写;
           ce 由 CE_FIELD_BASE 的 provide 层层透传, 任意深度拿到的都是根实例。 -->
      <div v-if="item.type === 'section'" class="hb-blk hb-sub" :class="{ 'hb-inactive': !sectionExists() }"
           :data-hb-key="ce.hubKey(path)">
        <div class="hb-blk-hd">
          <span class="bh-t">{{ f.label }}</span>
          <span class="bh-n">{{ sectionSummary }}</span>
          <span class="bh-r">
            <!-- readonly(程序托管)段: 启用/关闭开关无意义(段的存在性由 config.yml 管理), 换成徽标 -->
            <span v-if="readonly" class="hb-badge">程序维护</span>
            <label v-else class="hb-switch" title="控制该配置段是否写入配置文件">
              <input type="checkbox" :checked="sectionExists()" @change="toggleSection($event.target.checked)">
              <span class="hb-sw-track"></span>
              <span class="hb-sw-text">{{ sectionExists() ? '启用' : '关闭' }}</span>
            </label>
            <button class="hb-btn ghost sm" :aria-expanded="sectionOpen"
                    @click="ce.cfgSectionToggle(path)">{{ sectionOpen ? '收起' : '展开' }}</button>
            <button class="hb-ask" :class="{ on: ce.hub.helpKey === ce.hubKey(path) }"
                    :aria-label="f.label + ' 说明'" @click.stop="ce.hubAsk(item, $event)">?</button>
          </span>
        </div>
        <template v-if="sectionExists() && sectionOpen">
          <hub-field v-for="sub in item.items" :key="ce.hubKey(sub.path)" :item="sub"></hub-field>
        </template>
      </div>

      <!-- 普通 object 段: 默认折叠(用户点过以本地图为准, 未点过跟随 schema 的 open);
           折叠态仍给「已配置 n/m 项」摘要, 让用户不展开也看得出这段有没有配过 -->
      <div v-else-if="item.type === 'group'" class="hb-blk hb-sub" :data-hb-key="ce.hubKey(path)">
        <div class="hb-blk-hd hb-sub-toggle" role="button" tabindex="0"
             :title="groupOpen ? '点击收起' : '点击展开'" @click="toggleGroup()" @keyup.enter="toggleGroup()">
          <span class="bh-t">{{ item.label }}</span>
          <span class="bh-n">{{ groupSummary }}</span>
          <span class="bh-r">
            <button class="hb-btn ghost sm" :aria-expanded="groupOpen"
                    @click.stop="toggleGroup()">{{ groupOpen ? '收起' : '展开' }}</button>
            <button class="hb-ask" :class="{ on: ce.hub.helpKey === ce.hubKey(path) }"
                    :aria-label="item.label + ' 说明'" @click.stop="ce.hubAsk(item, $event)">?</button>
          </span>
        </div>
        <template v-if="groupOpen">
          <hub-field v-for="sub in item.items" :key="ce.hubKey(sub.path)" :item="sub"></hub-field>
        </template>
      </div>

      <!-- 相关设置子卡: 随父字段一起显隐(见 visible); 子项少, 常显不折叠 -->
      <div v-else-if="item.type === 'subcard'" class="hb-blk hb-sub" :data-hb-key="ce.hubKey(path)">
        <div class="hb-blk-hd"><span class="bh-t">{{ item.label }}</span></div>
        <hub-field v-for="sub in item.items" :key="ce.hubKey(sub.path)" :item="sub"></hub-field>
      </div>

      <!-- 叶子字段: 标签 | 控件 | 「?」; readonly(程序托管, issue 26-09-28-2135)行渲染禁用控件 +
           「程序维护」徽标, 列表/对象值(如 fs.path_map)改只读摘要 —— 控件形态会把列表 String 化成
           "[object Object]", 且编辑产出必然被后端回退 -->
      <div v-else class="hb-row" :class="[ce.hubRowClass(item), { bare: isBare, 'hb-inactive': greyed, 'hb-readonly': readonly }]"
           :data-hb-key="ce.hubKey(path)">
        <div v-if="!isBare" class="hb-lb">
          {{ f.label }}<span v-if="f.required" class="lb-req">*</span>
          <!-- 来源徽标(方案 B 阶段2): 站点页回退链 7 键标「站点(高亮)/全局」, 表示该行生效值出自哪一层;
               cfgIsDefault 对链上键返回 false —— 同一行不会同时出现「站点/全局」与「默认」矛盾徽标 -->
          <span v-if="siteBadge()" class="hb-badge" :class="{ on: siteBadge() === '站点' }">{{ siteBadge() }}</span>
          <span v-if="isDefault()" class="hb-badge">默认</span>
          <span v-if="readonly" class="hb-badge">程序维护</span>
        </div>
        <div class="hb-ct">
          <!-- readonly 的列表/对象值: 不渲染可编辑控件, 改只读摘要(fs.path_map 的映射对等) -->
          <div v-if="readonlyComplex" class="hb-ro">
            <span v-for="(line, i) in readonlySummary" :key="i" class="hb-ro-line">{{ line }}</span>
          </div>

          <label v-else-if="f.kind === 'bool'" class="hb-switch" :class="ce.hubToneOf(item)">
            <input type="checkbox" :checked="boolValue()" :disabled="readonly" @change="setBool($event.target.checked)">
            <span class="hb-sw-track"></span>
            <span class="hb-sw-text">{{ boolValue() ? '启用' : '关闭' }}</span>
          </label>

          <!-- 「跟随全局」按钮(方案 B 阶段3): 站点页回退链键且站点键已存在时出现, 点击删站点键 =
               恢复继承(git --unset 同构, cfgSetBool 恒写 true/false 行为不变); 全局页/非链上键
               canFollowGlobal 恒 false, 本钮不渲染 -->
          <button v-if="f.kind === 'bool' && canFollowGlobal()" class="hb-btn ghost sm"
                  title="移除本站点的覆盖设置, 恢复跟随全局(保存后生效)"
                  @click="followGlobal()">跟随全局</button>

          <select v-else-if="f.kind === 'enum'" class="hb-select" :class="ce.hubToneOf(item)"
                  :value="textValue()" :disabled="readonly" @change="set($event.target.value)">
            <option v-if="!f.required" value="">(未配置)</option>
            <option v-for="o in f.options" :key="o" :value="o">{{ o }}</option>
          </select>

          <div v-else-if="isList" class="hb-list">
            <div v-for="(it, i) in list()" :key="i" class="hb-list-row">
              <input class="hb-input" :class="{ 'hb-mono': ce.hubMonoOf(item) }" :value="it"
                     :placeholder="f.placeholder || ''" :disabled="readonly" @input="listSet(i, $event.target.value)">
              <button v-if="!readonly" class="hb-btn ghost sm" title="删除该项" @click="listRemove(i)">✕</button>
            </div>
            <button v-if="!readonly" class="hb-btn ghost sm" style="align-self:flex-start" @click="listAdd()">＋ 添加</button>
          </div>

          <div v-else-if="f.kind === 'rules_ref'" class="hb-list hb-list-ref">
            <div v-for="(it, i) in list()" :key="i" class="hb-list-row">
              <input class="hb-input hb-mono" :value="it" :disabled="readonly" :placeholder="f.placeholder || '@规则集 或 @规则集.规则名'"
                     @input="listSet(i, $event.target.value)">
              <button v-if="!readonly" class="hb-btn ghost sm" title="删除该引用" @click="listRemove(i)">✕</button>
            </div>
            <select v-if="!readonly" class="hb-select" :value="''" @change="refPick($event)">
              <option value="">从已有规则集/规则中选择…</option>
              <!-- refOptions(行级 computed): 已引用的规则不再出现在下拉里, 误选入口消失 -->
              <optgroup v-for="g in refOptions" :key="g.group" :label="g.group">
                <option v-for="o in g.items" :key="o.value" :value="o.value">{{ o.label }}</option>
              </optgroup>
            </select>
          </div>

          <div v-else-if="f.kind === 'keyed_list'" class="hb-checks">
            <label v-for="o in f.options" :key="o" class="hb-check">
              <input type="checkbox" :checked="checkedKey(o)" :disabled="readonly" @change="toggleKey(o)">
              <span>{{ o }}</span>
            </label>
          </div>

          <!-- 数值 + 单位: 写回仍是单个字符串(30M / 10MiB), 与磁盘同构; 合法性由后端夹紧 -->
          <div v-else-if="hasUnit" class="hb-unit">
            <input class="hb-input hb-mono hb-w-sm" type="text" :value="unitParts.num"
                   :placeholder="f.placeholder || ''" :disabled="readonly"
                   @input="ce.cfgSetUnit(path, $event.target.value, unitParts.unit)">
            <select class="hb-select" :value="unitParts.unit" :disabled="readonly"
                    @change="ce.cfgSetUnit(path, unitParts.num, $event.target.value)">
              <option v-for="u in unitOptions" :key="u" :value="u">{{ unitLabel(u) }}</option>
            </select>
          </div>

          <template v-else>
            <input class="hb-input" :class="[ce.hubToneOf(item), ce.hubWidthOf(item), { 'hb-mono': ce.hubMonoOf(item) }]"
                   :type="f.kind === 'password' ? 'password' : 'text'" :value="textValue()"
                   :placeholder="sitePlaceholder()" :min="f.min" :max="f.max" :disabled="readonly"
                   @input="set($event.target.value)">
            <span v-if="f.unit" class="hb-dim">{{ f.unit }}</span>
            <!-- 「跟随全局」按钮(方案 B 阶段3, tri_state str 键): 清空输入框保存 = 覆盖为空(写 ''),
                 本钮才是删键跟随全局 —— 两个动作语义不同, 互不替代 -->
            <button v-if="canFollowGlobal()" class="hb-btn ghost sm"
                    title="移除本站点的覆盖设置, 恢复跟随全局(保存后生效)"
                    @click="followGlobal()">跟随全局</button>
          </template>

          <button v-if="f.kind === 'expr'" class="hb-btn ghost sm" @click="ce.cfgExprTry(path)">试算</button>

          <!-- 布尔型从属项: 父字段的内联额外开关(比单独占一张子卡更符合从属语义);
               来源徽标同常规行(siteBadge(inl.path)), 站点页 hr 段的 overwrite 族在此显示。
               tooltip 把 risk 与 help 并接(原 risk || help 会让 help 永不可见 —— 阶段3 给
               overwrite 族的 help 写了三态措辞, 得让它露出来); 规则页插件 spec 的 inline
               无 help, 并接后文本不变。「跟随全局」小钮放 label 外(放进 label 会连点开关) -->
          <template v-for="inl in item.inline" :key="inl.field.key">
            <label class="hb-switch" :title="[inl.field.risk, inl.field.help].filter(Boolean).join(' ')">
              <input type="checkbox" :checked="inlineValue(inl)" @change="setInline(inl, $event.target.checked)">
              <span class="hb-sw-track"></span>
              <span class="hb-sw-text">{{ inl.field.label }}</span>
              <span v-if="siteBadge(inl.path)" class="hb-badge" :class="{ on: siteBadge(inl.path) === '站点' }">{{ siteBadge(inl.path) }}</span>
            </label>
            <button v-if="canFollowGlobal(inl.path)" class="hb-btn ghost sm"
                    title="移除本站点的覆盖设置, 恢复跟随全局(保存后生效)"
                    @click="followGlobal(inl.path, inl.field.label)">跟随全局</button>
          </template>
        </div>

        <button class="hb-ask" :class="[ce.hubToneOf(item), { on: ce.hub.helpKey === ce.hubKey(path) }]"
                :aria-label="f.label + ' 说明'" @click.stop="ce.hubAsk(item, $event)">?</button>
      </div>
    </div>
  </script>
