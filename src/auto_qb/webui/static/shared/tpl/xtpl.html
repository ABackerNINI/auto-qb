      <span v-else-if="col.key === 'size'" class="m-stat" :class="{ zero: !m.size }">{{ $root.fmtSizeOrDash(m.size) }}</span>
      <!-- 限速: 每站点独立(0 = 不限速显示空白, fmtLimitBytes) -->
      <span v-else-if="col.key === 'up_limit'" class="m-stat">{{ $root.fmtLimitBytes(m.up_limit) }}</span>
      <span v-else-if="col.key === 'dl_limit'" class="m-stat">{{ $root.fmtLimitBytes(m.dl_limit) }}</span>
      <span v-else-if="col.key === 'tags'" class="m-tags">
        <span v-for="t in $root.mTags(m)" :key="t" class="tag-chip"
              :class="[$root.tagClass(t, m), { 'f-on': $root.isFilterOn('tagFilter', t) }]"
              @click.stop="$root.filterFromChip('tag', t)">{{ t }}</span>
        <span v-if="!$root.mTags(m).length" class="zero"></span>
      </span>
      <span v-else-if="col.key === 'category'" class="m-cat">
        <span v-if="m.category" class="cat-chip"
              :class="{ 'f-on': $root.isFilterOn('categoryFilter', m.category) }"
              @click.stop="$root.filterFromChip('category', m.category)">{{ m.category }}</span>
        <span v-else class="zero"></span>
      </span>
      <span v-else-if="col.key === 'progress'" class="m-progress">
        <span class="bar"><i :style="{ width: Math.min(100, m.progress * 100) + '%' }"></i></span>
        <span class="val">{{ (m.progress * 100).toFixed(1) }}%</span>
      </span>
      <!-- 做种时间/分享率: 口径单点化(FX-02/04) —— 0 分钟且无 HR 要求 与 进度为 0 的种子不显示 -->
      <span v-else-if="col.key === 'seeding_time'" class="m-pair m-dur" :class="[$root.hrDurClass(m), $root.hrSrcClass(m)]" @mouseenter="$root.hrPopEnter($event, m)" @mouseleave="$root.hrPopLeave">
        <!-- .dur-body = **文字**包裹层: 整格线(在线)挂它上面才随文字宽; 挂 .m-dur 上会随列宽
             (行是 grid, 单元格被拉满列宽, width:100% 的空 <i> 就画成整列一条) -->
        <span class="dur-body">
          <span class="dur-val">{{ $root.cellSeedingTime(m) }}<i v-if="$root.hrSrcHalf(m)" class="hr-line"></i></span>
          <span v-if="$root.cellSeedingTime(m) && m.hr_req_time" class="req">/ {{ $root.fmtDuration(m.hr_req_time) }}</span>
          <i v-if="$root.hrSrcFull(m)" class="hr-line"></i>
        </span>
      </span>
      <span v-else-if="col.key === 'ratio'" class="m-pair m-ratio" :class="$root.hrRatioClass(m)">
        {{ $root.cellRatio(m) }}
        <span v-if="$root.cellRatio(m) && m.hr_triggered && m.hr_req_ratio > 0" class="req">/ {{ m.hr_req_ratio.toFixed(2) }}</span>
      </span>
      <!-- 可用性: 负数(qB 未知)/暂停不显示(cellAvailability), 口径与种子页一致 -->
      <span v-else-if="col.key === 'availability'" class="m-stat" :class="[{ zero: !$root.cellAvailability(m) }, $root.numTone(m.availability, 1)]">{{ $root.cellAvailability(m) }}</span>
      <!-- 最后完整可见: swarm 侧最近一次出现完整拷贝(不在 TIME_FMT_KEYS, 无口径开关, 直接 fmtTs) -->
      <span v-else-if="col.key === 'seen_complete'" class="m-stat" :title="$root.fmtRelTime(m.seen_complete)">{{ $root.fmtTs(m.seen_complete) }}</span>
      <!-- TBL-06: 添加于(_member_view 已透出); 保存路径列已移出明细表(见 GROUP_COLUMNS) -->
      <span v-else-if="col.key === 'added_on'" class="m-stat" :title="$root.cellTimeHint(m.added_on, 'added_on')">{{ $root.cellTime(m.added_on, 'added_on') }}</span>
      <!-- 完成于/最近活动/活动时间: 成员差异时间列(口径与种子页同名列一致) -->
      <span v-else-if="col.key === 'completion_on'" class="m-stat" :title="$root.cellTimeHint(m.completion_on, 'completion_on')">{{ $root.cellTime(m.completion_on, 'completion_on') }}</span>
      <span v-else-if="col.key === 'last_activity'" class="m-stat" :title="$root.cellTimeHint(m.last_activity, 'last_activity')">{{ $root.cellTime(m.last_activity, 'last_activity') }}</span>
      <span v-else-if="col.key === 'time_active'" class="m-stat">{{ $root.fmtDuration(m.time_active) }}</span>
      <!-- Tracker: 每站点各自 announce; 信息哈希值 v1/v2: qB WebUI 列名(Info Hash v1/v2)对齐, 均成员各异, 截断+悬停全文;
           v1 老快照可能缺字段, 显示回落 hash(与 drawer.js 的 hash 取值口径同源) -->
      <span v-else-if="col.key === 'tracker'" class="g-save-path" :title="m.tracker">{{ m.tracker || '' }}</span>
      <span v-else-if="col.key === 'infohash_v1'" class="m-hash" :title="m.infohash_v1">{{ (m.infohash_v1 || m.hash || '').slice(0, 8) }}</span>
      <span v-else-if="col.key === 'infohash_v2'" class="m-hash" :title="m.infohash_v2">{{ (m.infohash_v2 || '').slice(0, 8) }}</span>
    </template>
  </script>

  <script type="text/x-template" id="tpl-aq-dt-bridge">
  <!-- 变体表格体桥(计划 26-10-12-0527 U1/U2): 表壳 + 行渲染器经 Teleport 传送进变体外壳锚。
       全部引擎行为走 $root 既有单点; 描述符(app.js DRAWER_TABLE_DEFS 变体行)声明
       rows/rowKey/rowModel/rowProp(+可选 rowCls/segs)即接入 —— 外壳/引擎/本组件三方零特判。
       U2 分段化: dtBridgeSegs 归一返回 [{key, rows}](描述符 segs=true 时 rows 方法自带分段,
       如 08 五分组 —— 每组一个锚, 分组头留在外壳; 单锚段 key=""), 逐段 teleport + 逐段
       sortedDrawer(同 tableId 同一座排序键)。行修饰类(rowCls)绑 .group-row —— 变体行级
       个性(红行/内网标/握手半透明)经引擎行容器保留(D5 口径)。
       U4 行级键盘面(issue 26-10-07-0846, content 树表 10/11 消费): 行容器输出
       data-dt-key="<rowKey 值>"(变体键盘委托/roving 的行身份锚, 属性名固定不随表变) +
       描述符 rowTab 声明的行容器 tabindex=-1(不进 Tab 序, 行内原生控件自然参与 Tab);
       .group-table 挂 @vue:mounted → 描述符 rowAfter 声明的变体 rowAfterFn(锚每次换代重挂
       恰好一次) —— roving 锚点/回焦在行进 DOM 后跑, 与原「replaceChildren 后 roving」
       同语义(原子换帧时机的桥版等价物)。 -->
  <template v-for="seg in $root.dtBridgeSegs(tab)" :key="$root.dtBridgeKey(tab) + '#' + seg.key">
    <!-- !目标缺失不挂 teleport(dtBridgeTargetOn, 2026-10-14 合并态切换报障): 布局换代的
         patch 顺序是「先拆旧分支(旧锚离场) → 再挂新分支」, 而父级 v-if(dtBridgeOn) 在拆之前
         求值 —— 那一窗里 teleport 会挂到已消失的目标上; Vue 生产版对此**静默不挂子节点**,
         之后卸载该 teleport 时对 null component 解构抛 TypeError, 整次 patch 中断, 抽屉停在
         半渲染态(用户所见「内容消失」)。判据与 teleport 的 mount 同拍, 故为真值。 -->
    <teleport v-if="$root.dtBridgeTargetOn(tab, seg.key)" :to="$root.dtBridgeTo(tab, seg.key)">
      <aq-table :table-id="$root.dtBridgeTbl(tab)" :cols="$root.visibleColsOf($root.dtBridgeTbl(tab))"
                :sort-key="$root.dtSortCell($root.dtBridgeTbl(tab)).key"
                :sort-dir="$root.dtSortCell($root.dtBridgeTbl(tab)).dir" :drag="$root.colDrag"></aq-table>
      <!-- v-if 判空走 seg.rows.length 而非再排一次(sort 不减长度, 语义等价) ——
           桥模板每拍对每段排序两次(v-if + v-for), 80 行量级下白排一遍约几 ms, 砍掉 -->
      <div v-if="seg.rows.length" class="group-table"
           @scroll="$root.syncHeadScroll($event, $root.dtBridgeTbl(tab))"
           @vue:mounted="$root.dtRowAfter($root.dtBridgeTbl(tab), $event)">
        <div v-for="r in $root.sortedDrawer($root.dtBridgeTbl(tab), seg.rows)"
             :key="r[$root.dtBridgeRowKey(tab)]" class="group-row"
             :class="$root.dtBridgeRowCls(tab) ? r[$root.dtBridgeRowCls(tab)] : null"
             :data-table="$root.dtBridgeTbl(tab)" :data-dt-key="r[$root.dtBridgeRowKey(tab)]"
             :tabindex="$root.dtBridgeRowTab(tab) ? -1 : null"
             :style="$root.gridStyle($root.dtBridgeTbl(tab))">
          <component :is="'aq-' + $root.dtBridgeRowModel(tab) + '-cells'"
                     :cols="$root.visibleColsOf($root.dtBridgeTbl(tab))"
                     v-bind="{ [$root.dtBridgeRowProp(tab)]: r }"></component>
        </div>
      </div>
      <div v-else class="empty"><span>暂无数据</span></div>
    </teleport>
  </template>
</script>
