          <!-- 单一语义模板的「UI 差异口」(plans/26-09-26-2233 W3 收敛定案):

               且块前必须带 `ui-diff:` 注释说明原因 —— 守阵收集全部条件块作为「活差异清单」,

          <div class="ui-tools">

                <button type="button" class="theme-item" data-theme="galaxy" style="--td-a:#b79fe0;--td-b:#221a38"><i class="td"></i>暗夜星云<span class="t-kind">暗</span></button>

                <button type="button" class="theme-item" data-theme="orbit" style="--td-a:#3fa87e;--td-b:#122019"><i class="td"></i>品牌轨道<span class="t-kind">暗</span></button>
              </div>
            </div>
            </template>
            <!-- 界面切换下拉(2026-09-27 替代环形互切链接): 按钮显示当前 UI, 菜单三套直选。

                 flip-x 静态右对齐 —— 锚点恒在顶栏右缘, 不需要测量翻转; 选项表单点在 state.js UI_HOME;

            <button type="button" class="ui-link" :class="{ open: uiMenuOpen }" title="切换界面"

            </button>
            <transition name="pop">

              <div v-if="uiMenuOpen" class="pop-menu flip-x">
