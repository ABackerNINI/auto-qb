    <!-- 详情抽屉(方案A 底部停靠, 计划 26-10-03-0917 W1; 重设计自 R1B 右缘抽屉):
         注入落点 = app 级 .drawer-dock(shared/tpl/dock.html, boot.js 按选择器注入)。
         停靠面板无遮罩无模糊 —— 列表整幅可见(用户硬约束), PERF-01 全站零 backdrop-filter 在此收尾;
         Esc 关闭(退栈链, dialogs.js escBusy); trackers/peers 在对应 tab 激活期间 5s 轮询,
         关闭即停(见 drawer.js _startDrawerPoll); R2 S1(计划 26-10-09-2219)起四页签经典链
         移植为页插件(drawer_pages/), 经 dt-host 挂载, FX-22/截断族等 CSS 钩子随类名原样命中;
         正文与页签栏右键 = 合并开关菜单(R2 S2/S3, openDrawerMenu)。
         W3: 顶缘 .drawer-grip 拖拽调高(夹取 [240px, 70vh]) + 高度/开合持久化
         (localStorage, 见 drawer.js W3 块); 首屏默认关闭(D1, drawer.open 初值 false)。
         FX-29: 换目标走"软切换"(drawer.switching 遮罩沿用旧数据撑住面板几何), 见 drawer.js FX-29 块。
         2026-10-04 双形态: kind === "seed" = 种子详情(五页签, 原样); kind === "traffic" = qB 口径
         流量图(全局/分组, 由 statusbar 入口 / 组右键菜单打开)。三挂点(全局/分组/单种)共用同一段
         流量正文块(qbTrafficActive -> qbCur*), 与种子详情共用同一抽屉壳、同一拖拽高度
         (drawerHeightPx) —— 原 qb-traffic.html 的两个模态弹层已删除。 -->
    <transition name="drawer" :duration="220"
                @enter="drawerEnterHook" @after-enter="drawerAfterEnterHook"
                @leave="drawerLeaveHook" @after-leave="drawerAfterLeaveHook">
      <aside v-if="drawerVisible" class="drawer" :class="{ 'drawer-traffic': drawer.kind === 'traffic' }" :style="drawerPanelStyle()"
             role="region" :aria-label="drawer.kind === 'traffic' ? 'qB 口径流量图' : '种子详情'">
        <!-- W3 顶缘拖拽调高(夹取 [240px, 70vh], 见 drawer.js _drawerClampHeight) -->
        <div class="drawer-grip" title="拖拽调高" @pointerdown="drawerGripDown($event)"
             @pointermove="drawerGripMove($event)" @pointerup="drawerGripUp($event)"
             @pointercancel="drawerGripUp($event)"></div>
        <!-- 流量形态头部(**全局/分组**): 图标 + 标题 + **时间档位 + 纵轴设置** + 关闭。
             2026-10-08 版式改(用户动议): 窗口档位与纵轴控件自正文上提到本栏 —— 正文工具条
             占的是图的高度, 图被压扁; 两者本就是「图怎么看」的设置, 归设置栏才合理。
             注意本头部**只**由 kind === "traffic"(全局/分组)渲染; 单种流量图走的是种子详情头部
             (v-else), 其同款控件组 2026-10-09 第 2 轮改落**图下统计栏**(见 .hist-summary 段注释)
             —— 两者不共用头部, 内层标记由守阵钉逐字同源。 -->
        <header v-if="drawer.kind === 'traffic'" class="drawer-head">
          <div class="drawer-title">
            <span class="g-status k-other">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-chart"></use></svg>
            </span>
            <strong>{{ qbTrafficTitle }}</strong>
          </div>
          <!-- 窗口档位(13 档) + 纵轴控件: 与种子详情「流量」页签共用正文/头部, 三挂点一致。
               窗口清单单点在 qb_traffic_chart.js QB_WINDOW_NAMES(展示/切换/持久化同源) -->
          <div class="qb-tabs">
            <button v-for="w in qbWindowNames" :key="w"
                    :class="{ active: qbCurWindow === w }"
                    @click="qbSetWindow(w)">{{ qbWindowLabel(w) }}</button>
          </div>
          <div class="qb-tools">
            <span class="qb-tools-label">纵轴</span>
            <div class="qb-seg">
              <button :class="{ active: qbYAxisMode === 'auto' }"
                      @click="qbSetYAxisMode('auto')">自动</button>
              <button :class="{ active: qbYAxisMode === 'limit' }"
                      @click="qbSetYAxisMode('limit')">限速+20%</button>
              <button :class="{ active: qbYAxisMode === 'manual' }"
                      @click="qbSetYAxisMode('manual')">手动</button>
            </div>
            <input v-if="qbYAxisMode === 'manual'" class="qb-yaxis-input" type="number"
                   min="0" step="any" :value="qbYAxisManual || ''" placeholder="MiB/s"
                   @change="qbSetYAxisManual($event.target.value)" title="纵轴最大值(MiB/s)">
            <span class="qb-tools-hint">{{ qbYAxisCapText }}</span>
          </div>
          <!-- S1(计划 26-10-06-0838): 模板切换器 -->
          <select class="dt-select" title="流量模板" aria-label="流量模板"
                  :value="dtTplCurrent" @change="dtPick($event)">
            <option v-for="o in dtTplOptions" :key="o.id" :value="o.id">{{ o.label }}</option>
          </select>
          <button class="drawer-close" aria-label="关闭详情面板" @click="closeDrawer()">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
          </button>
        </header>
        <header v-else class="drawer-head">
          <div class="drawer-title">
            <span class="g-status" :class="'k-' + ((memberByHash.get(drawer.hash) || {}).kind || 'other')"
                  :title="stateText(memberByHash.get(drawer.hash) || { kind: 'other' })">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="kindIcon((memberByHash.get(drawer.hash) || {}).kind || 'other')"></use></svg>
            </span>
            <!-- FX-29: 标题取主表成员名优先(memberByHash 本地已有, 切换瞬间即正确) —— 等详情会让
                 中间一帧显示成 40 字符 hash 再跳回种子名, 那是"切换闪烁"里最刺眼的一跳 -->
            <strong :title="drawerTitle()">{{ drawerTitle() }}</strong>
          </div>
          <nav class="drawer-tabs" role="tablist" @contextmenu.prevent="openDrawerMenu($event)">
            <button :class="{ active: drawer.tab === 'general' }" @click="drawerTab('general')">常规</button>
            <button :class="{ active: drawer.tab === 'trackers' }" @click="drawerTab('trackers')">Tracker</button>
            <button :class="{ active: drawer.tab === 'peers' }" @click="drawerTab('peers')">用户</button>
            <button :class="{ active: drawer.tab === 'content' }" @click="drawerTab('content')">内容</button>
            <!-- qB 口径流量图 · 单种挂点(S5b, plan 26-10-03-0946 §07 表②): enabled=false 时
                 页签不渲染(v-if=qbTrafficOn, fail-closed 门) = 无进入路径即无请求(P5 验收) -->
            <button v-if="qbTrafficOn" :class="{ active: drawer.tab === 'traffic' }" @click="drawerTab('traffic')">流量</button>
          </nav>
          <!-- S1(计划 26-10-06-0838): 详情模板切换器(经典恒在首位; 选择按页签记忆
               autoqb.ui.drawerTpl, 见 drawer_templates.js) -->
          <select class="dt-select" title="详情模板" aria-label="详情模板"
                  :value="dtTplCurrent" @change="dtPick($event)">
            <option v-for="o in dtTplOptions" :key="o.id" :value="o.id">{{ o.label }}</option>
          </select>
          <button class="drawer-close" aria-label="关闭详情面板" @click="closeDrawer()">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
          </button>
        </header>
        <!-- FX-29 软切换: switching = 旧目标数据仍在撑着面板几何, 但已不代表当前种子 ——
             用遮罩(读数降到不可读 + 屏蔽交互)代替清空: 防串显的效果一样, 面板高度与列表不塌不跳。
             R2 S3: 右键 = 合并开关菜单(openDrawerMenu 内守种子详情形态, 流量形态不弹) -->
        <div class="drawer-body" :class="{ switching: drawer.switching, 'is-traffic': qbTrafficActive }"
             @contextmenu.prevent="openDrawerMenu($event)">
          <span v-if="drawer.switching" class="drawer-busy">正在加载…</span>
          <!-- ==================== 流量形态正文(三挂点共用) ====================
               全局(/api/traffic/qb/global) / 分组(/api/traffic/qb/group/{key}) / 单种
               (/api/traffic/qb/torrent/{hash}) 三挂点同形: 窗口切换 + 建图 + 图例 + 汇总。
               scope 由 qbCurScope 派生, 数据/加载态/悬停/汇总全走 qbCur*(单一渲染源);
               建图落点 ref="qbChartHost" 三挂点共用(同一时刻只渲染一个流量形态), 图高跟随
               抽屉高度(qb_traffic_chart.js _qbChartBuild 量 clientHeight + ResizeObserver 宽高双观察) -->
          <template v-if="qbTrafficActive">
            <!-- 2026-10-08 版式改: 窗口档位(.qb-tabs)与纵轴控件(.qb-tools)已上提到头部标题栏,
                 正文不再有工具条行 —— 图直接吃满抽屉可用高。 -->
            <!-- 静默续拉(2026-10-04 修「每隔几秒闪一次」+ 2026-10-05 修「空态也闪」): 已有结果时
                 loading 不接管正文 —— 整块 v-if 换成加载空态 = 每个轮询周期正文 DOM 被拆装一次
                 (闪的根源, 同 drawer-switch-flicker 的「快中间态本身就是闪」)。判据 qbCurPending
                 三合一(loading + 无数据 + 无错误): 空态响应/错误态落袋后续拉一律不接管 —— 2026-10-04
                 只门了「有图」一态(`!qbCurPoints.length`), 空数据集的空态文案仍在每个轮询周期被
                 「正在加载流量数据…」顶掉一帧。在途互斥语义仍在 qbCurLoading 本体上(轮询 tick 跳过
                 判据不变) -->
            <div v-if="qbCurPending" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-hourglass"></use></svg>
              <span>正在加载流量数据…</span>
            </div>
            <div v-else-if="qbCurError" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-warn"></use></svg>
              <span>{{ qbCurError }}</span>
            </div>
            <div v-else-if="!qbCurPoints.length" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-inbox"></use></svg>
              <span>{{ qbCurEmptyText }}</span>
            </div>
            <!-- S1(计划 26-10-06-0838): template v-else 转 div(唯一非加挂改动)带布局类
                 dt-traffic-main —— 核心注入的规则使其与原 fragment 直挂 .drawer-body.is-traffic
                 的 flex 纵列几何等价(FX-29 遮罩对 wrapper 生效, display:contents 会废掉 opacity);
                 图前/图后各加一个变体宿主(uPlot 图与其宿主 ref 保持 Vue 所有, qb_traffic_chart.js 零改动) -->
            <div v-else class="dt-traffic-main">
              <!-- S1: 图前宿主(变体 13 的 KPI 头行落点) -->
              <div v-show="dtHostOn('traffic')" class="dt-host" data-dt-host="traffic-pre"></div>
              <p v-if="qbCurData.meta && qbCurData.meta.stale" class="qb-stale">数据读取瞬时失败, 展示上一次成功快照</p>
              <!-- uPlot 建图落点: 容器 ref 由 _qbChartBuild 量宽高, tooltip 为其兄弟绝对定位;
                   悬停 idx/px 由 uPlot setCursor 钩子写回(scope 化 hoverIdx/hoverLeft) -->
              <div class="qb-chart">
                <div ref="qbChartHost" class="qb-chart-host"></div>
                <div v-if="qbCurHover" class="hist-tip" :class="{ flip: qbCurHover.flip }"
                     :style="{ left: qbCurHover.left + 'px', top: '0' }">
                  <b>{{ qbCurHover.tip }}</b>
                  <template v-if="!qbCurHover.gap">
                    <span class="h-up">上行 {{ fmtSpeed(qbCurHover.up) }}</span>
                    <span class="h-down">下行 {{ fmtSpeed(qbCurHover.dl) }}</span>
                    <span>合计 {{ fmtSpeed(qbCurHover.up + qbCurHover.dl) }}</span>
                    <!-- 0 桶状态行(plan 26-10-04-0721 §05): z 派生空闲段是 (0,0) 真实观测点,
                         与 null 缺口可辨 —— 速率行照旧, 仅补一行状态语 -->
                    <span v-if="qbCurHover.up + qbCurHover.dl === 0">0 B/s · 空闲/做种中</span>
                  </template>
                  <span v-else>无采样 · 程序未运行或 qB 断连</span>
                </div>
              </div>
              <!-- 2026-10-08 版式改: 上行/下行图例自图下独立一行并入统计栏(省一行高度 = 图更高);
                   原图下那行的说明文字(口径 + 悬停提示)已按用户要求移除, 信息在悬停 tooltip 里给。
                   2026-10-09 第 2 轮(用户动议): 种子「流量」页签的档位/纵轴控件组**也落进本统计栏**
                   (排在「下载累计」之后) —— 种子头部已承载五页签导航 + 模板切换器, 13 档再并进去
                   太挤、窄视口下会变形; 落到图下统计栏既有行里, 不新占图高。控件组内层与流量形态
                   头部同源(守阵钉逐字一致), 门 = qbCurScope === 'torrent'(种子形态 + 流量页签 +
                   功能开启的单点派生, fail-closed)。
                   统计栏本体的门因此放宽一档(有汇总 **或** 本门): 首载/错误态没有汇总时控件仍要在
                   —— 否则「数据取不到 ⇒ 连换档位都点不到」(与 2026-10-08 之前正文工具条恒可见同义)。 -->
              <div v-if="qbCurSummary || qbCurScope === 'torrent'" class="hist-summary">
                <template v-if="qbCurSummary">
                  <span class="hs-leg"><i class="sw up"></i>上行</span>
                  <span class="hs-leg"><i class="sw down"></i>下行</span>
                  <span>窗口 <b>{{ qbCurSummary.buckets }} 桶</b></span>
                  <!-- 口径注解(「累计为窗口内增量(断线期不计)」, 分组再加组口径尾注)自 2026-10-09
                       起不再是常驻文案 —— 改为**两个累计读数的悬浮提示**(用户动议: 常驻占统计栏
                       一行, 而这句只在「读数怎么算的」被问到时才有用)。title 走全局断供管道
                       (ui_feedback.js 落 DOM 即迁成 data-aq-tip, 原生 title 断供), 两处同源
                       取自 qbCurSummaryHint 单点。 -->
                  <span :title="qbCurSummaryHint">上传累计 <b class="h-up">{{ fmtSize(qbCurSummary.up) }}</b></span>
                  <span :title="qbCurSummaryHint">下载累计 <b class="h-down">{{ fmtSize(qbCurSummary.down) }}</b></span>
                </template>
                <!-- 种子「流量」页签的档位(13)+纵轴控件组(门见上注); 排在「下载累计」之后 -->
                <div v-if="qbCurScope === 'torrent'" class="qb-statctl">
                  <div class="qb-tabs">
                    <button v-for="w in qbWindowNames" :key="w"
                            :class="{ active: qbCurWindow === w }"
                            @click="qbSetWindow(w)">{{ qbWindowLabel(w) }}</button>
                  </div>
                  <div class="qb-tools">
                    <span class="qb-tools-label">纵轴</span>
                    <div class="qb-seg">
                      <button :class="{ active: qbYAxisMode === 'auto' }"
                              @click="qbSetYAxisMode('auto')">自动</button>
                      <button :class="{ active: qbYAxisMode === 'limit' }"
                              @click="qbSetYAxisMode('limit')">限速+20%</button>
                      <button :class="{ active: qbYAxisMode === 'manual' }"
                              @click="qbSetYAxisMode('manual')">手动</button>
                    </div>
                    <input v-if="qbYAxisMode === 'manual'" class="qb-yaxis-input" type="number"
                           min="0" step="any" :value="qbYAxisManual || ''" placeholder="MiB/s"
                           @change="qbSetYAxisManual($event.target.value)" title="纵轴最大值(MiB/s)">
                    <span class="qb-tools-hint">{{ qbYAxisCapText }}</span>
                  </div>
                </div>
              </div>
              <!-- S1: 图后宿主(变体 14 解读栏 / 15 自适应条落点) -->
              <div v-show="dtHostOn('traffic')" class="dt-host" data-dt-host="traffic-post"></div>
            </div>
          </template>
          <!-- ==================== 种子详情形态正文(五页签) ====================
               R2 S1(计划 26-10-09-2219): 四页签经典链已移植为页插件(drawer_pages/*-classic.js,
               经 dt-host 挂载, 与变体同机制) —— Vue 只保留两条共享空态(general 首载 loading 与
               error, 原链首两支)与宿主骨架; 显隐只走 host 自身(dtHostOn), 插件与 Vue 争 DOM
               红线不变。FX-22/截断族等 CSS 钩子随类名原样命中(插件 DOM 逐类名一致)。 -->
          <template v-else>
            <!-- 首次进入的空态只归常规页签: 其余页签各有自己的行内加载态(在 classic 插件内);
                 若让这条 general loading 空态压到 Tracker/用户/内容页签之前, 每次切换就是
                 「整幅表格 -> 一行正在加载详情…」 -->
            <div v-if="drawer.tab === 'general' && drawer.loading && !drawer.detail" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-hourglass"></use></svg>
              <span>正在加载详情…</span>
            </div>
            <div v-else-if="drawer.error" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-warn"></use></svg>
              <span>{{ drawer.error }}</span>
            </div>
            <!-- R2 S2: 合并双列(drawerMerge + 宽度门, dtSplitOn 单点判据) —— 两列各挂对应页签
                 当前所选页插件(classic 或变体, 模板选择与合并开关两个自由度解耦); 列序按对固定。
                 v-if/v-else 保证同一 data-dt-host 全 DOM 只存在一份(核心 querySelector 定位)。 -->
            <div v-if="dtSplitOn" class="drawer-split" :data-merge="drawerMerge">
              <template v-if="drawerMerge === 'gc'">
                <div class="dt-col">
                  <div class="dt-col-head">常规</div>
                  <div v-show="dtHostOn('general')" class="dt-host" data-dt-host="general"></div>
                </div>
                <div class="dt-col">
                  <div class="dt-col-head">内容</div>
                  <div v-show="dtHostOn('content')" class="dt-host" data-dt-host="content"></div>
                </div>
              </template>
              <template v-else>
                <div class="dt-col">
                  <div class="dt-col-head">Tracker</div>
                  <div v-show="dtHostOn('trackers')" class="dt-host" data-dt-host="trackers"></div>
                </div>
                <div class="dt-col">
                  <div class="dt-col-head">用户</div>
                  <div v-show="dtHostOn('peers')" class="dt-host" data-dt-host="peers"></div>
                </div>
              </template>
            </div>
            <!-- R2 S1: 单栏宿主 x4 —— Vue 只渲染空 host 元素, 子树归页插件自管
                 (插件与 Vue 争 DOM 红线); 显隐只走 host 自身 v-show(dtHostOn), classic 与变体
                 同宿主挂载(经典包裹层已退役)。宿主恒渲染(v-show 不卸载), 核心经 data-dt-host
                 定位挂载。 -->
            <template v-else>
              <div v-show="dtHostOn('general')" class="dt-host" data-dt-host="general"></div>
              <div v-show="dtHostOn('trackers')" class="dt-host" data-dt-host="trackers"></div>
              <div v-show="dtHostOn('peers')" class="dt-host" data-dt-host="peers"></div>
              <div v-show="dtHostOn('content')" class="dt-host" data-dt-host="content"></div>
            </template>
          </template>
        </div>
      </aside>
    </transition>
