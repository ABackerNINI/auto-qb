    <transition name="drawer" :duration="220"

            <template v-if="dtMergeTabsOn">

        <div class="drawer-body" :class="{ switching: drawer.switching, 'is-traffic': qbTrafficActive }"

                 根实例上跑 —— 全局 mixin 的 mounted 以 `this.drawer` 守卫剔除了 BaseTransition 假实例,

                 根 $refs ⇒ 搬进组件后 this.$refs.qbChartHost 恒 undefined, _qbChartBuild 第一行就

                 代价 = 五页签里第四个(流量)的正文不住组件层 —— 但它是**共用**的一段(三挂点同一块),
                 不存在「多形态各一份」的复写, 与问题 4 无关; 登记见计划 §05 W3「落地」与 §11。 -->
          <template v-if="qbTrafficActive">
            <!-- 2026-10-08 版式改(2026-10-16 再改): 窗口档位(.qb-tabs)与纵轴控件(.qb-tools)落
                 图下统计栏(.qb-statctl), 正文头部不再有工具条行 —— 图直接吃满抽屉可用高。 -->
            <!-- 静默续拉(2026-10-04 修「每隔几秒闪一次」+ 2026-10-05 修「空态也闪」): 已有结果时

            <div v-if="qbCurPending" class="empty">

              <span>{{ qbCurEmptyText }}</span>

            <!-- S1(计划 26-10-06-0838): template v-else 转 div(唯一非加挂改动)带布局类

            <div v-else class="dt-traffic-main">
              <p v-if="qbCurData.meta && qbCurData.meta.stale" class="qb-stale">数据读取瞬时失败, 展示上一次成功快照</p>

              <p v-if="qbCurSeamHint" class="qb-stale qb-seam">数据接缝中 · 服务于 {{ fmtTime(qbCurSeamHint.startedAt) }} 重启, 之后无采样</p>

              <div class="qb-chart">

                    <span v-if="qbCurHover.up + qbCurHover.dl === 0">0 B/s · 空闲/做种</span>

                    <span v-if="qbCurHover.lim" class="h-limit">当时限速 上{{ fmtSpeed(qbCurHover.lim[0]) }} / 下{{ fmtSpeed(qbCurHover.lim[1]) }}</span>

                  <template v-else>
                    <span>无采样 · 程序未运行或 qB 断连</span>
                    <!-- D7 缺口也读: 限速是时间真值, 独立于流量采样存在与否 -->
                    <span v-if="qbCurHover.lim" class="h-limit">当时限速 上{{ fmtSpeed(qbCurHover.lim[0]) }} / 下{{ fmtSpeed(qbCurHover.lim[1]) }}</span>

                <div class="qb-statctl">

               2026-10-14(用户令「移除种子详情面板除流量页外的 4 个经典 UI」): 四内容页签的经典

            <!-- R2 S2·R3: 合并双列(drawerMerge 开关 + 宽度门, dtSplitOn 单点判据) —— 列组由

                 经 v-for 驱动 —— 模板不再硬编码 gc/tp 两个 <template> 分支(删「渲染列组 vs 命中」
                 双份判据)。
                 !R3: 列组读 dtPair 而非 drawerMerge —— R2 按标志值渲染固定一对, 切到另一对页签
                 时列头在而两列宿主空(用户报障); 现与数据供给同源。
                 2026-10-14: 经典渲染链移除后两列同为变体宿主, 两列可各自选档互不牵连。 -->
            <div v-if="dtSplitOn" class="drawer-split" :data-merge="dtPair">
              <div v-for="col in dtPairCols" :key="col.tab" class="dt-col" :data-dt-tab="col.tab">
                <div class="dt-col-head">{{ col.label }}</div>
                <div class="dt-host" v-show="dtHostOn(col.tab)" :data-dt-host="col.tab"></div>
                <!-- 变体表格体桥(计划 26-10-12-0527 U1): 变体声明 tableId 时表格体经 Teleport
                     传送进外壳锚; :key 含锚代数 —— 宿主重建后强制重挂进当前锚(U1 四路径闸门)。 -->
                <aq-dt-bridge v-if="dtBridgeOn(col.tab)" :key="dtBridgeKey(col.tab)" :tab="col.tab"></aq-dt-bridge>
              </div>
            </div>
            <!-- 2026-10-14: 四内容页签的正文**恒由变体宿主承载**(经典 Vue 组件已整体移除) ——
                 每页签一个 data-dt-host 宿主, _dtSync 挂当前选中变体; 显隐走 dtHostOn(v-show)。 -->
            <template v-else>
              <div class="dt-host" v-show="dtHostOn('general')" data-dt-host="general"></div>
              <div class="dt-host" v-show="dtHostOn('trackers')" data-dt-host="trackers"></div>
              <div class="dt-host" v-show="dtHostOn('peers')" data-dt-host="peers"></div>
              <div class="dt-host" v-show="dtHostOn('content')" data-dt-host="content"></div>
              <!-- 变体表格体桥(计划 26-10-12-0527 U1): 逐页签自点亮(锚代数 > 0 才渲染),
                   无 tableId 声明 / 锚不在 DOM 恒不渲染 —— 生产零观感。 -->
              <template v-for="t in ['general', 'trackers', 'peers', 'content']" :key="'dtb-' + t">
                <aq-dt-bridge v-if="dtBridgeOn(t)" :key="dtBridgeKey(t)" :tab="t"></aq-dt-bridge>
              </template>
            </template>
          </template>
        </div>
      </aside>
    </transition>
