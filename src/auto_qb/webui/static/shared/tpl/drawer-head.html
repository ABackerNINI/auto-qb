<!-- 详情面板「头部外壳」与「流量档位/纵轴控件组」的组件模板(计划 26-10-11-2106 W3)
     x-template 注入 body(在 #app 之外, 不当根模板编译, 不多包 DOM 层), app.component 注册;
     两个组件都是**纯模板件** —— 数据与动作一律经 $root 回调根实例, 本文件不定义任何方法
     (见 pitfalls/web-ui/frontend-split「组件片段只贡献模板」条: 复制方法实现会触发
     _scan_mixin_wiring 的重名守阵, 被盖掉的那份永不执行)。

     !<aq-drawer-head> = 面板**唯一**头部(计划 §02 表 B 问题 4 的正解)。此前抽屉两形态各写一份
     `<header class="drawer-head">`(流量形态 v-if / 种子详情 v-else): 标题块与关闭按钮逐字复写,
     而 §03 又要求「两形态不共用头部、控件落点各自独立」—— 两形态**中部**确实不同(流量: 档位 +
     纵轴控件组; 种子: 五页签导航), 复写的只是**外壳**。现拆为: 外壳(标题块 + 默认插槽 + 关闭
     按钮)一份, 中部由调用点给。这不违「不共用头部」的语义(两形态中部仍是各自的), 却让
     「控件从正文上提到头部」这类版式改**只可能接一处** —— 那正是坑档
     pitfalls/web-ui/drawer-multi-form-hosts 的根因(版式改只接了一个形态宿主, 另一形态整组消失)。

     !<aq-qb-ctl> 必须是**多根片段**(.qb-tabs 与 .qb-tools 两个平级节点, 不留 wrapper): 三皮肤
     CSS 靠**直接子选择器**定位它们 —— `.hist-summary > .qb-statctl` /
     `.qb-statctl > .qb-tabs` / `.qb-statctl > .qb-tools`(图下统计栏内; 2026-10-16 起这是
     **唯一**挂点 —— 流量形态头部不再挂控件组, 全局/分组/单种三挂点对齐)。
     多包一层 div 会让这些规则**全部静默落空**(控件错位)—— pytest 扫源码看得见控件,
     只有真浏览器量布局才现形, 故由 e2e 按「直接子元素」钉住。

     !单点化是本组件的意义: 旧实现是两处**逐字复写**, 后经 Vue 组件收敛为**只有一处实现**
     (单点强于同源); 2026-10-16 版式改后头部挂点退役, 只剩统计栏一个挂点 —— 组件壳保留
     (多根片段的「不留 wrapper」结构约束与 $root 回调口径仍由它承载)。 -->
<script type="text/x-template" id="tpl-aq-drawer-head">
  <header class="drawer-head">
    <div class="drawer-title">
      <span class="g-status" :class="'k-' + tone" :title="statusTitle || null">
        <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="icon"></use></svg>
      </span>
      <strong :title="textTitle || null">{{ text }}</strong>
    </div>
    <!-- 形态中部: 流量形态 = 空(2026-10-16 起控件组统一落图下统计栏); 种子详情 = 五页签导航 -->
    <slot></slot>
    <button class="drawer-close" aria-label="关闭详情面板" @click="$root.closeDrawer()">
      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
    </button>
  </header>
</script>
<script type="text/x-template" id="tpl-aq-qb-ctl">
  <!-- 档位与纵轴两组分段钮改走 <aq-seg>(26-10-20-2231 / R23-B-17): 清单由各自的领域单点投影
       (qb_traffic_chart.js 的 qbWindowTabs = QB_WINDOW_NAMES + qbWindowLabel; qbYAxisTabs =
       QB_YAXIS_MODES + QB_YAXIS_LABELS), 模板不再手抄按钮 —— 收敛前这里 5 个 <button> 逐字写死,
       加一档要同时改 JS 清单与模板两处。容器(.qb-tabs/.qb-seg)仍留在原地: 三皮肤 CSS 的直接
       子选择器按这两个类名命中(见 tpl/ctl-bits.html 头注)。 -->
  <div class="qb-tabs">
    <aq-seg :items="$root.qbWindowTabs" :value="$root.qbCurWindow"
            :on-pick="$root.qbSetWindow"></aq-seg>
  </div>
  <div class="qb-tools">
    <span class="qb-tools-label">纵轴</span>
    <div class="qb-seg">
      <aq-seg :items="$root.qbYAxisTabs" :value="$root.qbYAxisMode"
              :on-pick="$root.qbSetYAxisMode"></aq-seg>
    </div>
    <input v-if="$root.qbYAxisMode === 'manual'" class="qb-yaxis-input" type="number"
           min="0" step="any" :value="$root.qbYAxisManual || ''" placeholder="MiB/s"
           @change="$root.qbSetYAxisManual($event.target.value)" title="纵轴最大值(MiB/s)">
  </div>
</script>
