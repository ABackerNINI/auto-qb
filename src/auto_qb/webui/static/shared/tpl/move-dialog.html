    <!-- 设定位置对话框(2026-10-13): 单种子/单组/多选批量三入口统一改, 保存路径下拉候选
         按「最近使用」排序(与添加种子保存路径同口径, 复用 add_torrent.js 的 _addRecencyMaps/
         _addOrderByRecent/_addNormPath 单点 —— 全局 mixin 合并, 跨模块互调与拆分前逐字等价)。
         下拉候选 = /api/paths 已知保存路径; 单种子预填当前 save_path, 批量/单组无预填(各值不同,
         预填误导)。目标集合打开时刻锁定(与 meta 同口径)。逻辑在 shared/drawer.js(AQB_DRAWER),
         复用 .modal/.add-dialog 视觉体系(.move-dialog)。combobox 收层/限高/悬停与添加种子三下拉
         + meta 分类同套口径(见 pitfalls/web-ui/combobox-focusout-close)。
         2026-10-19 几何修(用户报「弹窗太小, 下拉显示不全要滚动」): 组合框是本表单最后一项,
         向下的下拉必然伸出 .add-dialog-body 底沿 —— body 是 overflow-y:auto 滚动容器, 伸出部分
         被裁且把 body scrollHeight 撑大(弹窗体内多出滚动条), 净空算式 avail<0 恒不限高。治法 =
         ①对话框加宽到 --modal-w-add(与添加种子同宽, 路径项 nowrap+ellipsis 多显示); ②开层时
         根元素挂 .pop-open 类, body 加 padding-bottom 给下拉预留整高(预留量见三皮肤 CSS),
         下拉完整落在对话框内, 弹窗体本身零新增滚动。模板只加类名绑定, 几何数字全在 CSS 单点。 -->
    <aq-modal :open="moveOpen" :close="closeMove" icon="#i-folder-open" title="设定位置"
              label="设定位置" body-class="add-dialog-body"
              :width-class="['add-dialog move-dialog', { 'pop-open': movePathMenu }]">
          <p class="move-targets">作用于 <b>{{ moveCount }}</b> 个种子(打开时锁定)</p>
          <p class="move-note">将把种子文件移动到新路径。注意: 移动后该种子将离开当前辅种组。</p>
          <div class="add-dialog-field add-dialog-combo">
            <!-- label 必须 @mousedown.prevent + @click.stop(与添加种子三下拉 + meta 分类同因同修):
                 @click.stop 挡 window click 收层; @mousedown.prevent 挡 mousedown 默认动作的 blur ——
                 不挡则 movePathBlurClose 的 40ms 合帧定时器在按住期间先收层, 松手转发 refocus 再重开 = 闪烁。
                 缺一即回归, 走查须 delay>=120ms。 -->
            <label class="add-dialog-label" for="move-path" @mousedown.prevent @click.stop>新保存路径</label>
            <!-- 骨架收敛为 <aq-combo-input>(issue 26-10-20-2230): 收层/限高/悬停/键盘四绑
                 与添加种子三下拉 + meta 分类同点, 此处只留调用参数(menuRef/inputRef 锚名不变) -->
            <aq-combo-input input-id="move-path" input-ref="movePathInputEl" v-model="movePathInput"
                            placeholder="下拉选择或自由输入, 如 D:\downloads\target"
                            :menu="movePathMenu" :hi="movePathHi" :options="movePathOptions"
                            :on-pick="moveApplyPath" combo-key="move" icon="#i-folder-open"
                            empty-text="暂无历史位置, 可直接自由输入" head-text="选择保存位置"
                            menu-ref="movePathList" inner-list
                            @open="openMovePathMenu" @input="movePathHi = -1; movePathMenu = true"
                            @blur="movePathBlurClose" @keydown="onMovePathKeydown($event)"></aq-combo-input>
          </div>
      <template #actions>
          <button class="bt ghost" @click="closeMove">取消</button>
          <button class="bt primary" :disabled="moveBusy" @click="submitMoveDialog">设定位置</button>
      </template>
    </aq-modal>
