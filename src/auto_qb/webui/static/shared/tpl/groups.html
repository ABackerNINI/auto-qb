      <div v-if="page==='groups'" class="layout">
        <!-- torrents-dock(方案A W1; 2026-10-08 三视图共用): 主内容页父容器 flex column(列表区
             flex:1/min-height:0, 面板 auto) —— 三视图(种子/辅种/追剧)通用, 面板对三者一视同仁
             (计划 26-10-08-1217); W3 高度治理在此几何钩子上接拖拽调高。类名沿用 torrents-dock
             (三套 CSS 的 .torrents-dock > .group-table 选择器不必改, 三视图的列表容器同名) -->
        <main class="content" :class="{ 'torrents-dock': true }">

        <template v-if="viewMode === 'groups'">
        <!-- 表壳组件(计划 26-10-11-1722 P1): 表头块(列名/排序箭头/拖宽把手/重排指示线/表头右键)
             收敛为单点 <aq-table>(shared/table.js + tpl/xtpl.html#tpl-aq-table)。
             !吸顶仍需移出 .group-table(spec 规定 overflow-x:auto + overflow-y:visible -> overflow-y:auto,
               sticky 上下文会变成 .group-table 自身而失效; 故表头直接挂 .content 下 + JS 同步横向滚动)。
             !行容器与行仍在本页内联(v-for) —— 组件只包表壳, 窗口化热路径不引入逐行组件实例。 -->
        <aq-table ref="groupHead" table-id="group" :cols="visibleGroupCols"
                  :sort-key="sortKey" :sort-dir="sortDir" :drag="colDrag"></aq-table>
        <div class="group-table" ref="groupTable" @scroll="syncHeadScroll($event, 'group')">

          <!-- P1-2 行窗口: 上下占位撑住总高(滚动条长度与滚到底照旧), 中间只渲染视口附近的行。
               占位件本身已收敛为 <aq-row-pad>(issue 26-10-20-2231; 此前四处手写同一撑高 div) -->
          <aq-row-pad v-if="groupPadTop" :height="groupPadTop"></aq-row-pad>
          <template v-for="g in visibleGroups" :key="g.key">
            <!-- 单元格按「可见列」渲染: 顺序与 grid 模板同源(见 app.js 列模型), 不会再错位 -->
            <div class="group-row" data-table="group" :data-key="g.key" :class="['s-' + g.status.primary, { expanded: expandedKey===g.key, selected: groupSelState(g).selected, partial: groupSelState(g).partial, 'is-pending': isGroupPending(g), 'kb-cursor': isKbCursor('group', g.key) }]"
                 :style="gridStyle('group')"
                 @click="onGroupClick(g, $event)"
                 @contextmenu.prevent="openMenu($event, g)">
              <aq-group-cells :cols="visibleGroupCols" :g="g"></aq-group-cells>
            </div>

            <!-- 展开明细: 紧跟本组行显示(列头 + 各分站点行); 明细表头同样走表壳组件 -->
            <div v-if="expandedKey===g.key" class="detail">
              <aq-table ref="detailHead" table-id="detail" :cols="visibleDetailCols"
                        :sort-key="detailSortKey" :sort-dir="detailSortDir" :drag="colDrag"></aq-table>
              <aq-row-pad v-if="memberPadTop(g.members)" :height="memberPadTop(g.members)"></aq-row-pad>
              <div v-for="m in winMembers(g.members)" :key="m.hash"
                   class="member-row" data-table="detail" :data-hash="m.hash" :class="[m.kind, { 'search-hit': m.hit, selected: isMemberSelected(m), 'is-pending': isPending(m.hash), 'kb-cursor': isKbCursor('torrent', m.hash) }]"
                   :style="gridStyle('detail')"
                   @click="onMemberClick(m, $event)"
                   @dblclick="openTorrentDrawer(m.hash)"
                   @contextmenu.prevent="openMemberMenu($event, m)">
                <aq-member-cells :cols="visibleDetailCols" :m="m"></aq-member-cells>
              </div>
              <aq-row-pad v-if="memberPadBottom(g.members)" :height="memberPadBottom(g.members)"></aq-row-pad>
            </div>
          </template>
          <aq-row-pad v-if="groupPadBottom" :height="groupPadBottom"></aq-row-pad>

          <!-- 空态: 块 = <aq-empty> 单点(12 处手写三件套已收敛, issue 26-10-20-2231),
               文案 = groupsEmptyText —— 原先内联的四层嵌套三元已挪进 filters.js 的 listEmptyText -->
          <aq-empty v-if="!filteredGroups.length" :text="groupsEmptyText"></aq-empty>
          <p v-if="searchQuery.trim() && searchBuilding && filteredGroups.length" class="muted center">
            正在构建文件索引, 文件匹配结果稍后自动补齐…
          </p>
        </div>
        </template>

        <!-- 种子页(R1A, 原 R08 单种子视图升级): 数据源 = state.torrents 全量平铺(SEED_ITEM),
             逐种子过筛选 + 客户端文本过滤; 列模型 TORRENT_COLUMNS(默认核心列 + 选择器可选扩展列),
             排序/多选/右键(单种子菜单)/批量操作全部复用成员(hash)语义 -->
