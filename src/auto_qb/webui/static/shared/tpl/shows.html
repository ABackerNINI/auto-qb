        <template v-if="viewMode === 'shows'">
          <!-- 表壳组件(计划 26-10-11-1722 P2): 剧头接入 <aq-table>; 行容器与剧/季/集行仍在本页内联 -->
          <aq-table ref="showHead" table-id="show" :cols="visibleShowCols"
                    :sort-key="showSortKey" :sort-dir="showSortDir" :drag="colDrag"></aq-table>
          <div class="group-table" ref="showTable" @scroll="syncHeadScroll($event, 'show')">
            <template v-for="s in decoratedShows" :key="s.key">
              <!-- 剧行: 展开箭头 + 剧名; 聚合列仅展示统计(速度/大小等在集行粒度才有意义)
                   FX-13: 右键 = 整剧菜单(此前该层无 @contextmenu, "剧"这一级操作无处可做) -->
              <!-- data-key: 键盘光标定位锚点(计划 26-09-28-0354 W2; 剧/集单元与 _kbRows 链同 id) -->
              <div class="group-row show-row" data-table="show" :data-key="s.key" :class="{ expanded: isShowExpanded(s.key), 'search-hit': s.hit, selected: showSelState(s).selected, partial: showSelState(s).partial, 'is-pending': isShowPending(s), 'kb-cursor': isKbCursor('show', s.key) }"
                   :style="gridStyle('show')" @click="onShowClick(s, $event)"
                   @contextmenu.prevent="openShowMenu($event, s)">
                <aq-show-cells :cols="visibleShowCols" :s="s"></aq-show-cells>
              </div>
              <template v-if="isShowExpanded(s.key)">
                <template v-for="sn in s.seasons" :key="s.key + '~' + sn.season">
                  <!-- 季子标题: 名称 + 缺集提示(E1,E2,E4 -> 缺 E3) -->
                  <div class="season-head">
                    <span class="season-name">{{ seasonLabel(sn.season) }}</span>
                    <span v-if="sn.gaps.length" class="gap-badge"
                          :title="'缺集: ' + sn.gaps.map((n) => epLabel(['ep', n])).join(', ')">
                      <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-warn"></use></svg>
                      缺 {{ sn.gaps.length }} 集
                    </span>
                  </div>
                  <template v-for="e in sn.episodes" :key="s.key + '~' + sn.season + '~' + e.epKeyStr">
                    <div class="group-row ep-row" data-table="show" :data-key="showEpRowId(s.key, sn.season, e.epKeyStr)" :class="['s-' + epState(e), { expanded: expandedShowEp === showEpRowId(s.key, sn.season, e.epKeyStr), selected: epSelState(e).selected, partial: epSelState(e).partial, 'is-pending': isEpPending(e), 'kb-cursor': isKbCursor('ep', showEpRowId(s.key, sn.season, e.epKeyStr)) }]"
                         :style="gridStyle('show')"
                         @click="onShowEpClick(s, sn, e, $event)"
                         @contextmenu.prevent="openShowEpMenu($event, s, e)">
                      <aq-ep-cells :cols="visibleShowCols" :e="e"></aq-ep-cells>
                    </div>
                    <!-- 集明细: 该集全部版本(成员), 列与交互复用明细表; 明细表头同样走表壳组件 -->
                    <div v-if="expandedShowEp === showEpRowId(s.key, sn.season, e.epKeyStr)" class="detail">
                      <aq-table ref="detailHead" table-id="detail" :cols="visibleDetailCols"
                                :sort-key="detailSortKey" :sort-dir="detailSortDir" :drag="colDrag"></aq-table>
                      <!-- 集成员行同样走窗口(通常不到阈值; 超 200 个版本的集才真正生效) -->
                      <div v-if="memberPadTop(e.members)" class="row-pad" :style="{ height: memberPadTop(e.members) + 'px' }" aria-hidden="true"></div>
                      <div v-for="m in winMembers(e.members)" :key="m.hash" class="member-row" data-table="detail" :data-hash="m.hash"
                           :class="[m.kind, { 'search-hit': m.hit, selected: isMemberSelected(m), 'is-pending': isPending(m.hash), 'kb-cursor': isKbCursor('torrent', m.hash) }]"
                           :style="gridStyle('detail')"
                           @click="onMemberClick(m, $event)"
                           @dblclick="openTorrentDrawer(m.hash)"
                           @contextmenu.prevent="openMemberMenu($event, m)">
                        <aq-member-cells :cols="visibleDetailCols" :m="m"></aq-member-cells>
                      </div>
                      <div v-if="memberPadBottom(e.members)" class="row-pad" :style="{ height: memberPadBottom(e.members) + 'px' }" aria-hidden="true"></div>
                    </div>
                  </template>
                </template>
              </template>
            </template>
            <!-- 未识别折叠区: 无剧集标记的种子(电影/合集/命名过野), 参与搜索与筛选 -->
            <div v-if="unrecognizedTorrents.length" class="unrecognized">
              <button class="unrecognized-head" @click="unrecognizedOpen = !unrecognizedOpen">
                <svg class="ico ico-sm caret" :class="{ open: unrecognizedOpen }" viewBox="0 0 16 16"><use href="#i-caret"></use></svg>
                未识别 · {{ unrecognizedTorrents.length }}
                <span class="unrecognized-hint">无剧集标记的种子(电影 / 合集 / 命名过野)</span>
              </button>
              <div v-show="unrecognizedOpen" class="unrecognized-body">
                <div v-for="m in unrecognizedTorrents" :key="m.hash" class="member-row unrecognized-row"
                     :class="m.kind"
                     @contextmenu.prevent="openMemberMenu($event, m)">
                  <!-- 站点问题(计划 26-10-19-2206 D9): 与辅种明细同口径 —— 只染文字色 + 同款 tooltip -->
                  <span class="m-site" :class="siteAlertClass(m)"
                        :title="chipAlertTip(m)" :aria-label="siteAlertAria(m) || null">{{ m.site }}</span>
                  <span class="m-name" :title="m.name">{{ m.name }}</span>
                  <span class="m-state"><i class="dot"></i><span class="state-text">{{ stateText(m) }}</span></span>
                  <span class="m-stat" :class="{ zero: !m.size }">{{ fmtSizeOrDash(m.size) }}</span>
                  <span class="m-stat" :class="{ zero: !m.dlspeed }">{{ fmtSpeedOrDash(m.dlspeed) }}</span>
                </div>
              </div>
            </div>
            <div v-if="!decoratedShows.length" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-inbox"></use></svg>
              <span>
                {{ searchQuery.trim() ? (searchNegativeOnly ? '只有排除词 — 请补一个要包含的词' : (searchBuilding ? '正在构建文件索引…' : '无匹配剧集'))
                   : (filtersActive ? '当前筛选下没有剧集' : '暂无剧集可展示') }}
              </span>
            </div>
          </div>
        </template>

        <!-- 右键菜单(整集/整剧/组/单种子共用; 坐标已做视口边界吸附, 由 JS 计算)
             · 开始 在 暂停 之前(正向操作在上, 破坏性操作在下)
             · 图标按语义着色(.ico-play/.ico-pause/.ico-sync/.ico-danger)
             · 删除只有一项: 是否连带磁盘文件在确认框里勾选(默认不删)
             · FX-15 分层原则(已写入 memory-bank conventions.md): **一级只放 PT 日常高频动作**;
               qB 通用能力(队列 / TMM / 超级做种 / 强制启动 / 分享率限制 / 复制族)一律进次级菜单。
             · FX-14: "打开目标文件夹"走后端 /api/open-path(路径由服务端从自己的快照派生, 前端不传路径)。 -->
