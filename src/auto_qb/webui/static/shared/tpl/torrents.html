        <template v-if="viewMode === 'torrents'">
          <aq-table ref="torrentHead" table-id="torrent" :cols="visibleTorrentCols"
                    :sort-key="torrentSortKey" :sort-dir="torrentSortDir" :drag="colDrag"></aq-table>
          <div class="group-table" ref="torrentTable" @scroll="syncHeadScroll($event, 'torrent')">
            <!-- P1-2 行窗口: 3000 行里只渲染视口附近那几十行; 上下占位撑住总高 -->
            <div v-if="torrentPadTop" class="row-pad" :style="{ height: torrentPadTop + 'px' }" aria-hidden="true"></div>
            <div v-for="m in visibleTorrents" :key="m.hash" class="group-row torrent-row" data-table="torrent" :data-hash="m.hash"
                 :class="['s-' + m.kind, { selected: isMemberSelected(m), 'is-pending': isPending(m.hash), 'kb-cursor': isKbCursor('torrent', m.hash) }]"
                 :style="gridStyle('torrent')"
                 @click="onTorrentClick(m, $event)"
                 @dblclick="openTorrentDrawer(m.hash)"
                 @contextmenu.prevent="openMemberMenu($event, m)">
              <aq-torrent-cells :cols="visibleTorrentCols" :m="m"></aq-torrent-cells>
            </div>
            <div v-if="torrentPadBottom" class="row-pad" :style="{ height: torrentPadBottom + 'px' }" aria-hidden="true"></div>
            <div v-if="!filteredTorrents.length" class="empty">
              <svg class="ico" viewBox="0 0 16 16"><use href="#i-inbox"></use></svg>
              <span>
                {{ searchQuery.trim() ? (searchNegativeOnly ? '只有排除词 — 请补一个要包含的词' : '无匹配种子')
                   : (filtersActive ? '当前筛选下没有种子' : '暂无种子') }}
              </span>
            </div>
          </div>
        </template>

        <!-- 追剧视图(R10): 全量种子按 剧→季→集 聚合(聚合层后端算好, 多站点同集归并成一行);
             剧行展开后季子标题(含缺集提示) + 集行; 集行左键展开成员明细(复用明细列),
             右键 = 整集操作(作用于该集全部版本); 无剧集标记的种子进底部未识别折叠区 -->
