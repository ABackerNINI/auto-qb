
    <!-- 底部状态栏(TBL-08 修订; FX-07/08 重排, R10-02/03/05 再修):
         左 = 今日流量(**历史入口是其子元素**) + 连接/剩余摘要 + 完整统计入口,
         右 = 下载/上传速度 与各自"限制速度"(仅图标 + 数值);
         底色改专用令牌 --statusbar-bg(原先与页底同色不可辨); 高度仍锁 --statusbar-h(34px)。
         D2: 今日流量只来自 Traffic Monitor dat(period === "day"); 未启用限速曲线时整项不渲染。 -->
    <footer class="statusbar">
      <template v-if="todayTraffic">
        <!-- R10-05: 历史入口并入"今日流量"组(结构上成为子元素) —— 原先两者是兄弟节点,
             中间那道竖线来自 .sb-today 自身的右边框, 读起来像两个不相干的块。
            2026-09-20: 数值里的字面量 ↓/↑ 换成真箭头图标(i-arrow-down/up, 继承数值色), 组图标改双色。 -->
        <span class="sb-item sb-today">
          <svg class="ico ico-sm ico-today" viewBox="0 0 16 16"><use href="#i-traffic"></use></svg>
          <span class="lbl">今日</span>
          <span class="val v-down"><svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-down"></use></svg>{{ fmtSize(todayTraffic.down) }}</span>
          <span class="val v-up"><svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-up"></use></svg>{{ fmtSize(todayTraffic.up) }}</span>
          <button class="sb-hist" @click.stop="openHistory()">
            <svg class="ico ico-sm ico-history" viewBox="0 0 16 16"><use href="#i-history"></use></svg>
          </button>
          <!-- qB 口径流量图入口(plan 26-10-03-0946 §07 P5a, 与 TM 历史入口并列):
               enabled=false 时 qbHistEntryOn 为假 -> 入口不渲染、openQbHistory 无触发路径
               = 不发请求(P5 验收); 2026-10-04 起并入底部详情抽屉(openQbHistory ->
               openDrawerTraffic, 面板本体在 tpl/drawer.html 的流量形态) -->
          <button v-if="qbHistEntryOn" class="sb-qb" title="qB 口径流量图(24h/30d 时序)" @click.stop="openQbHistory()">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-chart"></use></svg>
          </button>
        </span>
      </template>
      <!-- GTM 当日总量虚高告警(计划 26-11-03-1102 S7c / D5): 主告知是**常驻横幅**, 不依赖
           todayTraffic 的 v-if 分支 —— 只要打开 WebUI 就能看见, 不需要进设置页。
           数据源 = traffic.gtm_anomaly(GTM /status.last_spike 经快照透传), 判空/24h/本机 ack
           全部收在 dialogs.js 的 gtmAlert 单点; 无异常或字段缺失 -> null -> 整组不渲染(降级)。
           × 只写本机 localStorage(gtm.spike.ack), 不写服务端; 新 ts 自动重显。
           位置纪律: 必须在 .sb-stats 之前(左侧告知优先), 且不挤压右侧速度/限速组。 -->
      <span v-if="gtmAlert" class="sb-item sb-gtm-alert">
        <button class="sb-gtm-main" :title="gtmAlert.full" @click.stop="showGtmAlert()">
          <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-bell"></use></svg>
          <span class="lbl">流量异常</span><span class="val">{{ gtmAlert.short }}</span>
        </button>
        <button class="sb-gtm-ack" title="已知晓(仅本机隐藏)" @click.stop="ackGtmAlert()">&times;</button>
      </span>
      <span class="sb-stats">
        <span v-for="it in sbStats" :key="it.key" class="sb-item" :title="it.title">
          <svg class="ico ico-sm" :class="it.cls" viewBox="0 0 16 16"><use :href="it.icon"></use></svg>
          <span class="lbl">{{ it.label }}</span><span class="val">{{ it.value }}</span>
        </span>
        <span v-if="!sbStats.length" class="sb-empty">统计未同步(等待 qB 连接)</span>
      </span>
      <button class="sb-btn" @click="openStats()">
        <svg class="ico ico-sm ico-chart" viewBox="0 0 16 16"><use href="#i-chart"></use></svg>完整统计
      </button>
      <span class="sb-spacer"></span>
      <!-- 键位帮助入口(计划 26-11-12-0344 S5): Shift+/ 帮助浮层的常驻鼠标入口 —— 浮层此前零按钮
           入口(不知道 Shift+/ 存在就永远发现不了)。分派 = help-panel 同链: kbToggleHelp 是
           _kbToggleKbHelp 的模板别名(shortcuts_engine.js, Vue 模板解析不到 _ 前缀成员,
           issue 26-10-03-1412; 与 Shift+/ 同一 toggle 方法, 开/关行为与键盘完全一致; 浮层开着时
           被 modal-mask(z-index 130) 盖住点不到, 鼠标关走 Esc/x/遮罩, 键盘自切换
           KB_SELF_TOGGLE_OVERLAY 本体不动 —— 纯显示层)。键帽串走 kbKeycapOf('help-panel') 现算
           (id 引用注册表, I1 不手抄; 改绑即时跟随/空串即隐藏与顶栏键帽同链); I4/D10 例外裁定:
           键位提示不走 title/.aq-tip 通道。版式: 复用 .sb-btn(与「完整统计」同款, 四皮肤既有样式
           零新增 CSS); 插在 spacer 之后 = 增宽先被 .sb-spacer(flex:1) 吸收, 不挤右角速度组;
           高度: 键帽 11px mono + 3px padding + 3px border ≈ 20px + .sb-btn 2px padding ≈ 26px,
           在 --statusbar-h(34px) 锁高内(实测断言见 e2e statusbar-kbd-entry)。 -->
      <button class="sb-btn" @click.stop="kbToggleHelp()">
        键位
        <kbd v-if="kbKeycapOf('help-panel')" class="aq-kbd">{{ kbKeycapOf('help-panel') }}</kbd>
      </button>
      <!-- 通知入口(WEBUI 通知 S4, 原「错误历史」, 2026-10-09 改名; 模板 T2): 照 .sb-hist/.sb-qb 范式(图标 + title +
           @click.stop), 样式单点在 shared/console_hub.css 的 .sb-err 段。独立按钮不入
           .sb-speed(该组 overflow: hidden), 常驻渲染(不依赖 todayTraffic)。未读徽标 =
           面板关闭期新增条目数(errUnread 别名, 源字段 _errUnread; 含陈述型通知 _recordNotice),
           无未读静默不显示(保守默认)。 -->
      <button class="sb-err" :class="{ on: errPanelOpen }" title="通知" @click.stop="errPanelOpen = !errPanelOpen">
        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-bell"></use></svg>
        <span v-if="errUnread > 0" class="sb-err-badge">{{ errUnread }}</span>
      </button>
      <!-- FX-08 → 2026-09-20 改版: 每方向合成一组「[方向图标] 速度 / 限速」, 整组就是一个按钮 ——
           点图标 / 速度 / 限速任一处都能就近弹出限速浮层; 不再单独给限速配图标(仪表盘 i-gauge 退役),
           分隔靠斜杠 "/";
           "限制速度"是按钮, 点击只打开该方向预聚焦的浮层(独立的"限速"按钮退役)。
           R10-03: 三个文字标签去棹(同排已有图标 + 数值, 文字纯冗余); 2026-10-04: 悬浮 title 一并移除。
           R10-04: 取值口径 = speedLimitBytes 单点(状态栏与速度染色分母同源)。 -->
      <span class="sb-speed">
        <!-- ALT-01: 备用速度切换(计划 26-09-28-0037 TPL-A) —— qB 惯例"乌龟"隐喻:
             熄灭 = 主速度生效, 亮绿 = 备用速度生效; 状态读主轮询的 statsServer.use_alt_speed_limits
             (零新增请求), 单击经命令队列切 qB toggle 端点; 备用限速数值在限速浮层改。 -->
        <button class="sb-alt" :class="{ on: sbAltOn }" :title="sbAltTitle" @click.stop="toggleAltSpeed()">
          <svg class="ico ico-sm" :class="{ spin: altToggling }" viewBox="0 0 16 16"><use href="#i-turtle"></use></svg>
        </button>
        <!-- 2026-10-11: 速度数值染方向色(.spd-down/.spd-up -> --today-down/up, 与流量图同源);
             限速 .lim 保持中性灰不动 -->
        <button class="sb-spd spd-down" :class="{ off: sbLimits.down === '不限' }"
                @click.stop="openSpeedAt($event, 'down')">
          <svg class="ico ico-sm ico-down" viewBox="0 0 16 16"><use href="#i-download"></use></svg>
          <span class="val">{{ fmtSpeed(totalDl) }}</span>
          <span class="slash">/</span>
          <span class="lim">{{ sbLimits.down }}</span>
        </button>
        <span class="sb-sep"></span>
        <button class="sb-spd spd-up" :class="{ off: sbLimits.up === '不限' }"
                @click.stop="openSpeedAt($event, 'up')">
          <svg class="ico ico-sm ico-up" viewBox="0 0 16 16"><use href="#i-upload"></use></svg>
          <span class="val">{{ fmtSpeed(totalUl) }}</span>
          <span class="slash">/</span>
          <span class="lim">{{ sbLimits.up }}</span>
        </button>
      </span>
    </footer>
