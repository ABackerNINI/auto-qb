
      <!-- ================================================================
           设置页(Console Hub): 首页卡片总览 → 二级页分区, 说明走就近浮窗。
           经典设置页已移除(2026-09-25), 本页是唯一设置页; 与 cfg* 读写共用同一棵配置树。
           ================================================================ -->
      <main v-if="page==='settings'" class="ce-page hub-page">
        <div v-if="cfg.loading" class="ce-placeholder loading">正在加载配置…</div>
        <div v-else-if="!cfg.schema" class="ce-placeholder">
          <p class="error">{{ cfg.error || '配置加载失败' }}</p>
          <button class="hb-btn" @click="cfgLoad()">重试</button>
        </div>
        <template v-else>
          <div class="hb-wrap">

            <!-- ============ 首页: 卡片总览 ============ -->
            <div class="hb-view" :class="{ on: hub.view === 'hub' }">
              <header class="hb-hd">
                <div>
                  <h1>设置</h1>
                  <p class="hd-sub">{{ hubStats.groups }} 个分区 · 共 {{ hubStats.fields }} 项 ·
                    <span :class="{ on: hubStats.dirty }">{{ hubStats.dirty ? '有改动还没保存' : '已与磁盘同步' }}</span>
                  </p>
                </div>
                <div class="hd-search">
                  <svg class="hb-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
                  <input class="hb-input" v-model="hub.query" placeholder="搜索配置项，比如「端口」">
                </div>
              </header>

              <!-- 搜索命中: 按配置项名直跳, 不用记它在哪个分区 -->
              <div v-if="hubHits.length" class="hb-blk hb-cut">
                <div class="hb-blk-hd">
                  <span class="bh-t">搜索结果</span>
                  <span class="bh-n">点一下直接跳到那一行</span>
                </div>
                <button v-for="h in hubHits" :key="h.key" class="hb-row hb-row-hit" @click="hubJump(h)">
                  <span class="hb-lb">{{ h.label }}</span>
                  <span class="hb-ct"><span class="hb-dim">{{ h.groupLabel }}</span></span>
                  <span></span>
                </button>
              </div>

              <!-- 「有 N 项建议你看一下」警示条暂时隐藏(2026-09-26): 伪警示, 只复述 schema 静态风险文案,
                   不反映配置健康, 见 issues/26-09-22-2002-bug-webui-config-health-warning;
                   真修(改渲染后端 warnings)后取消本注释包裹恢复。分区卡 LED warn / 「含风险」徽标不受影响。
              <div v-if="hubRiskList.length" class="hb-attn">
                <svg class="hb-ico lg at-ico" viewBox="0 0 16 16"><path d="M8 2 1.5 13.5h13z"/><path d="M8 6.5v3M8 11.6v.6"/></svg>
                <div class="at-body">
                  <b>有 {{ hubRiskList.length }} 项建议你看一下</b>
                  <p>{{ hubRiskList[0].groupLabel }} · {{ hubRiskList[0].label }}：{{ hubRiskList[0].risk }}</p>
                </div>
                <button class="hb-btn ghost at-go" @click="hubGo(hubRiskList[0].group)">去看 →</button>
              </div>
              -->

              <div class="hb-grid">
                <button v-for="c in hubCards" :key="c.key" class="hb-card" @click="hubGo(c.key)">
                  <div class="hb-card-top">
                    <span class="hb-card-ico hb-cut" :class="{ off: c.led === 'off' }">
                      <svg class="hb-ico lg" viewBox="0 0 16 16"><use :href="'#' + c.icon"></use></svg>
                    </span>
                    <div class="hb-card-t">{{ c.title }}</div>
                  </div>
                  <p class="hb-card-d">{{ c.desc }}</p>
                  <div class="hb-card-f">
                    <span class="hb-led" :class="c.led"></span>
                    <span class="cf-v">{{ c.readout }}</span>
                    <span v-for="b in c.badges" :key="b.text" class="hb-badge" :class="b.cls">{{ b.text }}</span>
                  </div>
                </button>
              </div>

            </div>

            <!-- ============ 二级页: 一个分区只做一件事 ============ -->
            <div class="hb-view" :class="{ on: hub.view !== 'hub' }">
              <!-- 返回条(方案一 2026-09-28): 原小字面包屑随页滚走, 二级页深处没有回首页入口 ——
                   升级为吸顶(样式见 console_hub.css .hb-crumb), 左端箭头+「设置」整钮回首页,
                   右端 Esc 键帽 = 方案三快捷键的可见提示(真实处理在 config_hub.js::hubOnKey) -->
              <nav class="hb-crumb">
                <button class="cb-back" @click="hubBack()">
                  <svg class="hb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.2 5 8l4.8 4.8"/></svg>设置
                </button>
                <span class="cb-sep">/</span>
                <span class="cb-now">{{ hubNow.title }}</span>
                <span class="cb-kbd"><kbd>Esc</kbd> 返回首页</span>
              </nav>

              <header class="hb-sec">
                <span class="hb-sec-mark hb-cut">
                  <svg class="hb-ico lg" viewBox="0 0 16 16"><use :href="'#' + hubNow.icon"></use></svg>
                </span>
                <div>
                  <h1>{{ hubNow.title }}</h1>
                  <p class="sh-lede">{{ hubNow.lede }}</p>
                </div>
              </header>

              <!-- 站点: 二级页内用切角小标签切换, 不再做左右主从两栏 -->
              <template v-if="hub.view === 'trackers'">
                <!-- 聚焦搜索层(方案C, 2026-09-29 拍板 plans/26-09-29-0323): 聚焦或有词即开层,
                     列表/详情退隐成背景, 搜索行升为面板 + 下挂命中面板; 收层路径(点命中/Esc/点暗幕/点外)
                     一律清词(跳转器拍板延续) -->
                <div class="hb-tr-stage" :class="{ on: hubTrackerStageOpen }">
                  <div class="hb-tr-veil" @click="hubTrackerStageClose(true)"></div>
                  <div class="hb-tr-search">
                    <svg class="hb-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
                    <input ref="trackerSearchInput" class="hb-input" v-model="cfg.trackerQuery" autocomplete="off"
                           placeholder='搜索站点…(空格=且, -词排除, "短语")'
                           :aria-expanded="hubTrackerStageOpen ? 'true' : 'false'"
                           @focus="hub.trackerSearchFocus = true"
                           @keydown="hubTrackerKeydown($event)">
                    <button v-if="cfg.trackerQuery.trim()" class="hb-tr-x"
                            @mousedown.prevent @click="hubTrackerClear()">×</button>

                    <!-- 命中面板: 头(标签 + 命中数搬出输入框 + 键位) / 命中行(高亮只走 act:
                         键盘 ↑↓ 与真实鼠标移动接管共用, 治上下键选中项闪烁) /
                         尾(「新增站点「词」」快捷新增 + Esc 提示); 空态语法引导也在面板内 -->
                    <div v-if="hubTrackerStageOpen" class="hb-tr-drop">
                      <div class="hb-tr-drop-hd">
                        <span class="p-t">站点搜索</span>
                        <span v-if="hubTrackerCountText && hubTrackerHits.kind !== 'negOnly'" class="p-n">{{ hubTrackerCountText }}</span>
                        <span class="p-k"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 打开</span>
                      </div>
                      <div class="hb-tr-drop-list">
                        <p v-if="!cfg.trackerQuery.trim()" class="hb-tr-hint">
                          输入关键词, 名称 / 域名 / 标签 / 分组 / 规则 / 限速 / HR 全字段匹配。<br>
                          语法: 空格 = 且 · -词 排除 · "短语" 连续匹配
                        </p>
                        <p v-else-if="hubTrackerHits.kind === 'negOnly'" class="hb-tr-hint warn">
                          只有排除词 — 请补一个要包含的词
                        </p>
                        <p v-else-if="!hubTrackerHits.hits.length" class="hb-tr-hint">
                          没有站点匹配「{{ cfg.trackerQuery.trim() }}」— 换更短的词, 或在下面直接新增
                        </p>
                        <template v-else>
                          <button v-for="(h, i) in hubTrackerHits.hits" :key="h.name" class="hb-tr-hit"
                                  :class="{ on: cfg.trackerKey === h.name, act: hub.trackerHitIdx === i }"
                                  :style="{ animationDelay: (i * 24) + 'ms' }"
                                  @click="hubTrackerPick(h.name)" @mousemove="hubTrackerHoverIdx(i, $event)">
                            <span class="hb-tr-hit-name" :class="{ hit: h.nameHit }">{{ h.name }}</span>
                            <span v-if="cfg.trackerKey === h.name" class="hb-tr-cur">当前</span>
                            <span class="hb-tr-chips">
                              <span v-for="c in h.chips" :key="c.grp + '|' + c.raw" class="hb-tr-chip">
                                <i>{{ c.grp }}</i><em>{{ c.raw }}</em>
                              </span>
                              <span v-if="h.more" class="hb-tr-chip more">+{{ h.more }}</span>
                            </span>
                          </button>
                        </template>
                      </div>
                      <div class="hb-tr-drop-ft">
                        <button class="hb-btn dashed sm" @click="hubAddTracker(cfg.trackerQuery.trim())">
                          <svg class="hb-ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>新增站点<span
                              v-if="cfg.trackerQuery.trim() && hubTrackerHits.kind !== 'negOnly'">「{{ cfg.trackerQuery.trim() }}」</span>
                        </button>
                        <span class="ft-esc"><kbd>Esc</kbd> 退出搜索</span>
                      </div>
                    </div>
                  </div>

                  <!-- pill 行: 站点 pill + 行尾动作区(新增 = 虚线描边 / 导入 = 幽灵钮, 与站点 pill 形制分离);
                       搜索态整行随聚焦层退隐变暗, 不再 v-if 隐藏(背景仍在) -->
                  <div class="hb-pills">
                    <button v-for="name in cfgTrackerNames()" :key="name" class="hb-pill"
                            :class="{ on: cfg.trackerKey === name }" @click="cfg.trackerKey = name">
                      {{ name }}
                    </button>
                    <span class="hb-pill-tail">
                      <button class="hb-btn dashed sm" @click="hubAddTracker()">
                        <svg class="hb-ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>新增站点
                      </button>
                      <button class="hb-btn ghost sm" :disabled="hub.importing" @click="hubImportSites()">
                        <svg class="hb-ico" viewBox="0 0 16 16"><path d="M8 2v8M4.6 7 8 10.4 11.4 7M3 13h10"/></svg>导入缺失站点
                      </button>
                    </span>
                  </div>

                <!-- 详情: 整栏宽(不再左右分栏) -->
                <div class="hb-tr-detail">
                  <div v-if="cfg.trackerKey && (!hubTrackerActive || hubTrackerSelIn)" class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">{{ cfg.trackerKey }}</span>
                      <span class="bh-r">
                        <button class="hb-btn sm" @click="cfgTrackerRename(cfg.trackerKey)">重命名</button>
                        <button class="hb-btn danger sm" @click="cfgTrackerRemove(cfg.trackerKey)">删除</button>
                      </span>
                    </div>
                    <hub-field v-for="item in cfgTrackerItems()" :key="hubKey(item.path)" :item="item"></hub-field>
                  </div>
                  <p v-else-if="hubTrackerActive" class="hb-tr-hint">
                    当前选中站点不在命中里 — 点上面下拉里的命中项选中站点
                  </p>
                  <div v-else class="hb-blk hb-cut">
                    <div class="hb-blk-hd"><span class="bh-n">暂无站点配置, 点上面「新增站点」添加一个</span></div>
                  </div>
                </div>
                </div><!-- /hb-tr-stage -->
              </template>

              <!-- 规则: 「条件 → 动作」两栏卡片 -->
              <template v-else-if="hub.view === 'rules'">
                <div class="hb-pills">
                  <button v-for="g in cfgRuleGroupNames()" :key="g" class="hb-pill"
                          :class="{ on: cfg.ruleGroupKey === g }" @click="cfg.ruleGroupKey = g">
                    {{ g }}<span class="p-n">{{ cfgRuleNames(g).length }}</span>
                  </button>
                  <button class="hb-pill" @click="hubAddRuleGroup()">＋ 新增规则集</button>
                </div>
                <template v-if="cfg.ruleGroupKey">
                  <div class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">{{ cfg.ruleGroupKey }}</span>
                      <span class="bh-n">{{ cfgRuleNames(cfg.ruleGroupKey).length }} 条</span>
                      <span class="bh-r">
                        <button class="hb-btn sm" @click="hubAddRule(cfg.ruleGroupKey)">＋ 新增规则</button>
                        <button class="hb-btn danger sm" @click="cfgRuleRemoveGroup(cfg.ruleGroupKey)">删除规则集</button>
                      </span>
                    </div>
                  </div>

                  <div v-for="rn in cfgRuleNames(cfg.ruleGroupKey)" :key="rn" class="hb-rule hb-cut">
                    <div class="hb-rule-hd">
                      <span class="rh-n">{{ rn }}</span>
                      <span class="rh-s">{{ cfgRuleSummary(cfg.ruleGroupKey, rn) }}</span>
                      <span class="rh-r">
                        <span v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="hb-badge risk">含风险动作</span>
                        <label class="hb-switch" title="启用/停用该规则">
                          <input type="checkbox" :checked="cfgRuleEnabled(cfg.ruleGroupKey, rn)"
                                 @change="cfgRuleSetEnabled(cfg.ruleGroupKey, rn, $event.target.checked)">
                          <span class="hb-sw-track"></span>
                        </label>
                        <button class="hb-btn sm" @click="cfgRuleRename(cfg.ruleGroupKey, rn)">重命名</button>
                        <button class="hb-btn danger sm" @click="cfgRuleRemove(cfg.ruleGroupKey, rn)">删除</button>
                      </span>
                    </div>
                    <!-- 规则级字段(触发/间隔/去重/冷却/后续规则/监听字段): 折叠段, 复用 hb-blk-hd 条状头
                         + hub-field 通用行; 摘要行常显当前节奏, 展开才渲染字段(与设置页 group 段同口径) -->
                    <div class="hb-rule-meta">
                      <div class="hb-blk-hd hb-sub-toggle" role="button" tabindex="0"
                           @click="cfgRuleMetaToggle(cfg.ruleGroupKey, rn)"
                           @keyup.enter="cfgRuleMetaToggle(cfg.ruleGroupKey, rn)">
                        <span class="bh-t">触发与节奏</span>
                        <span class="bh-n">{{ cfgRuleMetaSummary(cfg.ruleGroupKey, rn) }}</span>
                        <span class="bh-r">
                          <button class="hb-btn ghost sm" :aria-expanded="cfgRuleMetaOpen(cfg.ruleGroupKey, rn)"
                                  @click.stop="cfgRuleMetaToggle(cfg.ruleGroupKey, rn)">{{ cfgRuleMetaOpen(cfg.ruleGroupKey, rn) ? '收起' : '展开' }}</button>
                        </span>
                      </div>
                      <template v-if="cfgRuleMetaOpen(cfg.ruleGroupKey, rn)">
                        <hub-field v-for="item in cfgRuleMetaItems(cfg.ruleGroupKey, rn)"
                                   :key="hubKey(item.path)" :item="item"></hub-field>
                      </template>
                    </div>
                    <div class="hb-rule-flow">
                      <div class="hb-flow-grp">
                        <div class="hb-flow-grp-hd">条件<span class="fg-hint">全部满足才执行</span></div>
                        <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'conditions')" :key="i" class="hb-step">
                          <div class="hb-step-bar">
                            <span class="st-n">{{ i + 1 }}</span>
                            <span class="st-t">{{ hubPluginText(entry) }}</span>
                            <span class="st-r">
                              <button class="hb-btn ghost sm" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, -1)">↑</button>
                              <button class="hb-btn ghost sm" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, 1)">↓</button>
                              <button class="hb-btn danger sm" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'conditions', i)">✕</button>
                            </span>
                          </div>
                          <hub-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'conditions', i)"
                                     :key="hubKey(item.path)" :item="item"></hub-field>
                        </div>
                        <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'conditions').length" class="hb-hp">
                          没配条件 = 这条规则总是执行
                        </p>
                        <select class="hb-select" :value="''" @change="hubPickPlugin(cfg.ruleGroupKey, rn, 'conditions', $event)">
                          <option value="">＋ 添加条件…</option>
                          <option v-for="p in cfgConditionOptions()" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                      </div>
                      <div class="hb-flow-grp">
                        <div class="hb-flow-grp-hd">动作<span class="fg-hint">按顺序执行</span></div>
                        <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'actions')" :key="i"
                             class="hb-step" :class="hubStepClass(entry)">
                          <div class="hb-step-bar">
                            <span class="st-n">{{ i + 1 }}</span>
                            <span class="st-t">{{ hubPluginText(entry) }}</span>
                            <span class="st-r">
                              <button class="hb-btn ghost sm" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, -1)">↑</button>
                              <button class="hb-btn ghost sm" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, 1)">↓</button>
                              <button class="hb-btn danger sm" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">✕</button>
                            </span>
                          </div>
                          <hub-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'actions', i)"
                                     :key="hubKey(item.path)" :item="item"></hub-field>
                        </div>
                        <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'actions').length" class="hb-hp">
                          未配置动作 = 规则只做条件判断, 不会执行任何操作
                        </p>
                        <select class="hb-select" :value="''" @change="hubPickPlugin(cfg.ruleGroupKey, rn, 'actions', $event)">
                          <option value="">＋ 添加动作…</option>
                          <option v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                      </div>
                    </div>
                    <div v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="hb-rule-foot">
                      <p class="hb-hp risk" style="margin:0">{{ cfgRuleRisk(cfg.ruleGroupKey, rn) }}</p>
                    </div>
                  </div>
                </template>
              </template>

              <!-- 限速: 阶梯图 + 档位(每一档是「流量低于 X → 限速 Y」一个整体) -->

              <!-- 全局流量来源(计划 26-10-17-0339 S17/D15; 26-10-17-1737 S1 总开关): 一张卡合并「总开关
                   + 来源单选 + 工具状态」。enabled 关 = 停一切取数; 关源时来源单选与子参数区按 D14 灰显不隐藏
                   (后端允许关源后仍改配置); 底部状态区五态 + 拉起/重试 + 自启; 工具参数(高级)经控制面读写。 -->
              <template v-else-if="hub.view === 'traffic_source'">
                <div class="hb-blk hb-cut">
                  <div class="hb-blk-hd"><span class="bh-t">数据来源</span><span class="bh-n">二选一, 只有选中的来源参与取数</span></div>
                  <hub-field v-for="row in tmEnabledItems()" :key="hubKey(row.path)" :item="row"></hub-field>
                  <div class="hb-row" :class="{ 'hb-grey': tmSourceOff() }">
                    <div class="hb-lb">来源</div>
                    <div class="hb-ct">
                      <button class="hb-btn sm" :class="tmProvider() === 'traffic_monitor' ? 'primary' : 'ghost'" :disabled="tmSourceOff()" @click="tmSetProvider('traffic_monitor')">Traffic Monitor 文件</button>
                      <button class="hb-btn sm" :class="tmProvider() === 'global_traffic_monitor' ? 'primary' : 'ghost'" :disabled="tmSourceOff()" @click="tmSetProvider('global_traffic_monitor')">整机流量监视器(工具)</button><span v-if="tmSourceOff()" class="bh-n">来源已关闭: 已停止一切取数 —— 打开上方「启用」即恢复</span>
                    </div>
                  </div>
                  <div :class="{ 'hb-grey': tmSourceOff() }">
                    <hub-field v-for="row in tmProviderItems(tmProvider())" :key="hubKey(row.path)" :item="row"></hub-field>
                  </div>
                </div>
                <div class="hb-blk hb-cut">
                  <div class="hb-blk-hd">
                    <span class="bh-t">工具状态</span><span class="bh-n"><span class="hb-led" :class="tmStateClass()"></span> {{ tmStateText() }}</span>
                    <span class="bh-r"><button class="hb-btn ghost sm" :disabled="tm.loading" @click="tmLoad()">{{ tm.loading ? '读取中…' : '刷新' }}</button></span>
                  </div>
                  <p v-if="tm.loading && !tm.loaded" class="hb-hp" style="padding:12px 14px">正在读取工具状态…</p>
                  <template v-else>
                    <div v-if="tm.state === 'not_installed'" class="hb-row"><div class="hb-lb">未安装</div><div class="hb-ct">还没找到工具。请在上方填「工具目录」或「工具可执行文件」后点「立即拉起」。<button class="hb-btn ghost sm" @click="tmPickOpen()">选择文件…</button></div></div>
                    <div v-else-if="tm.state === 'launching'" class="hb-row"><div class="hb-lb">拉起中</div><div class="hb-ct">已在拉起, 等待工具就绪 · 剩余约 {{ Math.ceil(tm.retryS) }} 秒</div></div>
                    <div v-else-if="tm.state === 'launch_failed'" class="hb-row"><div class="hb-lb">拉起失败</div><div class="hb-ct">{{ tm.error || '未知原因' }} · 退避剩余约 {{ Math.ceil(tm.retryS) }} 秒, 可点「立即拉起 / 重试」</div></div>
                    <div v-else-if="tm.state === 'not_running'" class="hb-row"><div class="hb-lb">未运行</div><div class="hb-ct">{{ tm.error || '工具当前没在跑。点「立即拉起」由 auto-qb 拉起它。' }}</div></div>
                    <template v-else-if="tm.state === 'ready' && tm.status">
                      <div class="hb-row"><div class="hb-lb">控制面</div><div class="hb-ct">端口 {{ tm.toolUrl }} · PID {{ tm.pid || '—' }} · 版本 {{ tm.version || '—' }} · 数据目录 <span style="font-family:var(--hb-font-mono)">{{ tm.dataDir || '—' }}</span></div></div>
                      <div class="hb-row"><div class="hb-lb">当日流量</div><div class="hb-ct">上行 {{ tmFmtBytes(tm.status.day_up_bytes) }} · 下行 {{ tmFmtBytes(tm.status.day_down_bytes) }} · 合计 {{ tmFmtBytes(tm.status.day_total_bytes) }} · {{ tm.status.subscriber_count }} 个订阅 · 末事件号 {{ tm.status.last_event_id }}</div></div>
                      <div class="hb-row"><div class="hb-lb">历史文件</div><div class="hb-ct" style="font-family:var(--hb-font-mono)">{{ tm.status.paths && tm.status.paths.dat }}</div></div>
                      <div class="hb-row"><div class="hb-lb">开机自启</div><div class="hb-ct"><label><input type="checkbox" :checked="tm.autostartRegistered" :disabled="tm.autoBusy" @change="tmAutostart($event.target.checked ? 'install' : 'uninstall')">&nbsp;已注册</label><span class="bh-n">{{ tm.autostartRegistered ? '开机会自动起' : '未注册(开机不会自动起)' }}</span><span v-if="!tm.autostartRegistered && tm.autostartError" class="hb-hp risk" :title="tm.autostartError" style="max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom">· {{ tm.autostartError }}</span><span v-if="tm.autoMsg" class="bh-n">{{ tm.autoMsg }}</span><span v-if="tm.autoErr" class="hb-hp risk">{{ tm.autoErr }}</span></div></div>
                    </template>
                    <div v-else class="hb-row"><div class="hb-lb">就绪异常</div><div class="hb-ct">{{ tm.error || '工具可达但状态读取异常' }}</div></div>
                    <div class="hb-row">
                      <div class="hb-lb"></div>
                      <div class="hb-ct"><button class="hb-btn" :disabled="tm.relaunching" @click="tmRelaunch()">{{ tm.relaunching ? '拉起中…' : '立即拉起 / 重试' }}</button><button class="hb-btn ghost sm" :disabled="!tm.reachable || !tm.toolUrl" @click="tmOpenToolSettings()">打开工具设置</button></div>
                    </div>
                  </template>
                </div>
                <!-- 文件选择器(D10③): 找不到工具时用目录导航 + 文件名输入写 tool_exe / tool_dir; 后端 /api/fs/dirs 只列目录且限在允许保存路径内, 范围外请手填绝对路径。 -->
                <div v-if="tm.pick.open" class="hb-blk hb-cut">
                  <div class="hb-blk-hd">
                    <span class="bh-t">选择工具文件</span><span class="bh-n">{{ tm.pick.path || '选择位置' }}</span>
                    <span class="bh-r"><button class="hb-btn ghost sm" :disabled="!tm.pick.parent" @click="tmPickUp()">上级</button><button class="hb-btn ghost sm" @click="tm.pick.open = false">关闭</button></span>
                  </div>
                  <div style="padding:12px 14px">
                    <p v-if="tm.pick.loading" class="hb-hp">正在读取目录…</p>
                    <p v-else-if="tm.pick.error" class="hb-hp error">{{ tm.pick.error }}</p>
                    <div v-else style="display:flex;flex-wrap:wrap;gap:6px">
                      <button v-for="d in tm.pick.dirs" :key="d.path" class="hb-btn ghost sm" @click="tmPickEnter(d)">{{ d.name }}</button>
                      <p v-if="!tm.pick.dirs.length" class="hb-hp">此目录下没有可进入的子目录</p>
                    </div>
                    <div class="hb-row" style="margin-top:8px">
                      <div class="hb-lb">文件名</div>
                      <div class="hb-ct">
                        <input class="hb-input" v-model="tm.pick.name" placeholder="如 gtm.exe / launch.cmd">
                        <button class="hb-btn sm" :disabled="!tm.pick.path || !tm.pick.name.trim()" @click="tmPickApplyExe()">写入工具可执行文件</button>
                        <button class="hb-btn ghost sm" :disabled="!tm.pick.path" @click="tmPickApplyDir()">写入工具目录</button>
                      </div>
                    </div>
                    <p class="bh-n">只列目录、限在允许的保存路径内; 范围外请直接在「工具目录 / 工具可执行文件」文本框填绝对路径。</p>
                  </div>
                </div>
                <!-- 工具自身参数(高级): 采样/落盘/阈值/适配器 —— 经工具控制面读写(读后写, 全量覆盖) -->
                <div v-if="tm.reachable" class="hb-blk hb-cut">
                  <div class="hb-blk-hd">
                    <span class="bh-t">工具参数(高级)</span><span class="bh-n">采样间隔 / 落盘阈值 / 适配器 —— 经工具控制面读写</span>
                    <span class="bh-r"><button class="hb-btn ghost sm" @click="tm.advancedOpen = !tm.advancedOpen">{{ tm.advancedOpen ? '收起' : '展开' }}</button></span>
                  </div>
                  <div v-show="tm.advancedOpen">
                    <div v-for="p in tmParams()" :key="p.key" class="hb-row">
                      <div class="hb-lb">{{ p.label }}</div>
                      <div class="hb-ct">
                        <input v-if="p.kind === 'list'" class="hb-input" type="text" v-model="tm.form[p.key]" :placeholder="p.hint || ''">
                        <input v-else class="hb-input" :type="p.kind === 'text' ? 'text' : 'number'" :step="p.step || 'any'" v-model="tm.form[p.key]">
                        <span v-if="p.bytes" class="bh-n">= {{ tmFmtBytes(Number(tm.form[p.key]) || 0) }}</span>
                      </div>
                    </div>
                    <div class="hb-row">
                      <div class="hb-lb"></div>
                      <div class="hb-ct"><button class="hb-btn" :disabled="tm.saving" @click="tmSave()">{{ tm.saving ? '保存中…' : '保存到工具' }}</button><span v-if="tm.saveMsg" class="bh-n">{{ tm.saveMsg }}</span><span v-if="tm.saveErr" class="hb-hp risk">{{ tm.saveErr }}</span></div>
                    </div>
                  </div>
                </div>
              </template>
