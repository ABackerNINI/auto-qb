
      <!-- ================================================================
           设置页(Console Hub): 首页卡片总览 → 二级页分区, 说明走就近浮窗。
           经典设置页已移除(2026-09-25), 本页是唯一设置页; 与 cfg* 读写共用同一棵配置树。
           ================================================================ -->
      <main v-if="page==='settings'" class="ce-page hub-page">
        <div v-if="cfg.loading" class="ce-placeholder loading">正在加载配置…</div>
        <div v-else-if="!cfg.schema" class="ce-placeholder">
          <p class="error">{{ cfg.error || '配置加载失败' }}</p>
          <button class="hb-btn" @click="cfgLoad()">重试</button>
        </div>
        <template v-else>
          <div class="hb-wrap">

            <!-- ============ 首页: 卡片总览 ============ -->
            <div class="hb-view" :class="{ on: hub.view === 'hub' }">
              <header class="hb-hd">
                <div>
                  <h1>设置</h1>
                  <p class="hd-sub">{{ hubStats.groups }} 个分区 · 共 {{ hubStats.fields }} 项 ·
                    <span :class="{ on: hubStats.dirty }">{{ hubStats.dirty ? '有改动还没保存' : '已与磁盘同步' }}</span>
                  </p>
                </div>
                <div class="hd-search">
                  <svg class="hb-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
                  <input class="hb-input" v-model="hub.query" placeholder="搜索配置项，比如「端口」">
                </div>
              </header>

              <!-- 搜索命中: 按配置项名直跳, 不用记它在哪个分区 -->
              <div v-if="hubHits.length" class="hb-blk hb-cut">
                <div class="hb-blk-hd">
                  <span class="bh-t">搜索结果</span>
                  <span class="bh-n">点一下直接跳到那一行</span>
                </div>
                <button v-for="h in hubHits" :key="h.key" class="hb-row hb-row-hit" @click="hubJump(h)">
                  <span class="hb-lb">{{ h.label }}</span>
                  <span class="hb-ct"><span class="hb-dim">{{ h.groupLabel }}</span></span>
                  <span></span>
                </button>
              </div>

              <!-- 「有 N 项建议你看一下」警示条暂时隐藏(2026-09-26): 伪警示, 只复述 schema 静态风险文案,
                   不反映配置健康, 见 issues/26-09-22-2002-bug-webui-config-health-warning;
                   真修(改渲染后端 warnings)后取消本注释包裹恢复。分区卡 LED warn / 「含风险」徽标不受影响。
              <div v-if="hubRiskList.length" class="hb-attn">
                <svg class="hb-ico lg at-ico" viewBox="0 0 16 16"><path d="M8 2 1.5 13.5h13z"/><path d="M8 6.5v3M8 11.6v.6"/></svg>
                <div class="at-body">
                  <b>有 {{ hubRiskList.length }} 项建议你看一下</b>
                  <p>{{ hubRiskList[0].groupLabel }} · {{ hubRiskList[0].label }}：{{ hubRiskList[0].risk }}</p>
                </div>
                <button class="hb-btn ghost at-go" @click="hubGo(hubRiskList[0].group)">去看 →</button>
              </div>
              -->

              <div class="hb-grid">
                <button v-for="c in hubCards" :key="c.key" class="hb-card" @click="hubGo(c.key)">
                  <div class="hb-card-top">
                    <span class="hb-card-ico hb-cut" :class="{ off: c.led === 'off' }">
                      <svg class="hb-ico lg" viewBox="0 0 16 16"><use :href="'#' + c.icon"></use></svg>
                    </span>
                    <div class="hb-card-t">{{ c.title }}</div>
                  </div>
                  <p class="hb-card-d">{{ c.desc }}</p>
                  <div class="hb-card-f">
                    <span class="hb-led" :class="c.led"></span>
                    <span class="cf-v">{{ c.readout }}</span>
                    <span v-for="b in c.badges" :key="b.text" class="hb-badge" :class="b.cls">{{ b.text }}</span>
                  </div>
                </button>
              </div>

            </div>

            <!-- ============ 二级页: 一个分区只做一件事 ============ -->
            <div class="hb-view" :class="{ on: hub.view !== 'hub' }">
              <nav class="hb-crumb">
                <button @click="hubBack()">设置</button>
                <span class="cb-sep">/</span>
                <span class="cb-now">{{ hubNow.title }}</span>
              </nav>

              <header class="hb-sec">
                <span class="hb-sec-mark hb-cut">
                  <svg class="hb-ico lg" viewBox="0 0 16 16"><use :href="'#' + hubNow.icon"></use></svg>
                </span>
                <div>
                  <h1>{{ hubNow.title }}</h1>
                  <p class="sh-lede">{{ hubNow.lede }}</p>
                </div>
              </header>

              <!-- 站点: 二级页内用切角小标签切换, 不再做左右主从两栏 -->
              <template v-if="hub.view === 'trackers'">
                <!-- 搜索行: 名称/域名/标签/分组/规则/限速/HR 全字段匹配, 语法照搬种子搜索(计划 26-09-27-1852) -->
                <div class="hb-tr-search">
                  <svg class="hb-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
                  <input class="hb-input" v-model="cfg.trackerQuery" autocomplete="off"
                         placeholder='搜索站点…(空格=且, -词排除, "短语")'>
                  <button v-if="cfg.trackerQuery.trim()" class="hb-tr-x" title="清空"
                          @mousedown.prevent @click="hubTrackerClear()">×</button>
                  <span v-if="hubTrackerCountText" class="hb-tr-count"
                        :class="{ warn: hubTrackerHits.kind === 'negOnly' }">{{ hubTrackerCountText }}</span>
                </div>

                <!-- 非搜索态: pill 行(只显示站点名, 不带配置键数徽标) -->
                <div v-if="!hubTrackerActive" class="hb-pills">
                  <button v-for="name in cfgTrackerNames()" :key="name" class="hb-pill"
                          :class="{ on: cfg.trackerKey === name }" @click="cfg.trackerKey = name">
                    {{ name }}
                  </button>
                  <button class="hb-pill" @click="hubAddTracker()">＋ 新增站点</button>
                  <button class="hb-pill" :disabled="hub.importing" @click="hubImportSites()">⤓ 导入缺失站点</button>
                </div>

                <!-- 搜索态: 命中列表居左 + 所选站点详情居右; 点命中行只切右侧不清搜索, Esc / × 返回全量 -->
                <div class="hb-tr-split" :class="{ on: hubTrackerActive }">
                  <div v-if="hubTrackerActive" class="hb-tr-hits">
                    <p v-if="hubTrackerHits.kind === 'negOnly'" class="hb-tr-hint warn">
                      只有排除词 — 请补一个要包含的词
                    </p>
                    <p v-else-if="!hubTrackerHits.hits.length" class="hb-tr-hint">
                      没有站点匹配「{{ cfg.trackerQuery.trim() }}」— 试试更短的词, 或检查是否有排除词误伤
                    </p>
                    <template v-else>
                      <button v-for="h in hubTrackerHits.hits" :key="h.name" class="hb-tr-hit"
                              :class="{ on: cfg.trackerKey === h.name }" @click="cfg.trackerKey = h.name">
                        <span class="hb-tr-hit-name" :class="{ hit: h.nameHit }">{{ h.name }}</span>
                        <span class="hb-tr-chips">
                          <span v-for="c in h.chips" :key="c.grp + '|' + c.raw" class="hb-tr-chip">
                            <i>{{ c.grp }}</i><em>{{ c.raw }}</em>
                          </span>
                          <span v-if="h.more" class="hb-tr-chip more">+{{ h.more }}</span>
                        </span>
                      </button>
                    </template>
                  </div>

                  <div class="hb-tr-detail">
                    <div v-if="cfg.trackerKey && (!hubTrackerActive || hubTrackerSelIn)" class="hb-blk hb-cut">
                      <div class="hb-blk-hd">
                        <span class="bh-t">{{ cfg.trackerKey }}</span>
                        <span class="bh-r">
                          <button class="hb-btn sm" @click="cfgTrackerRename(cfg.trackerKey)">重命名</button>
                          <button class="hb-btn danger sm" @click="cfgTrackerRemove(cfg.trackerKey)">删除</button>
                        </span>
                      </div>
                      <hub-field v-for="item in cfgTrackerItems()" :key="hubKey(item.path)" :item="item"></hub-field>
                    </div>
                    <p v-else-if="hubTrackerActive" class="hb-tr-hint">
                      当前选中站点不在命中里 — 点左侧任一命中行, 右侧出该站字段详情
                    </p>
                    <div v-else class="hb-blk hb-cut">
                      <div class="hb-blk-hd"><span class="bh-n">暂无站点配置, 点上面「＋ 新增站点」添加一个</span></div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- 规则: 「条件 → 动作」两栏卡片 -->
              <template v-else-if="hub.view === 'rules'">
                <div class="hb-pills">
                  <button v-for="g in cfgRuleGroupNames()" :key="g" class="hb-pill"
                          :class="{ on: cfg.ruleGroupKey === g }" @click="cfg.ruleGroupKey = g">
                    {{ g }}<span class="p-n">{{ cfgRuleNames(g).length }}</span>
                  </button>
                  <button class="hb-pill" @click="hubAddRuleGroup()">＋ 新增规则集</button>
                </div>
                <template v-if="cfg.ruleGroupKey">
                  <div class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">{{ cfg.ruleGroupKey }}</span>
                      <span class="bh-n">{{ cfgRuleNames(cfg.ruleGroupKey).length }} 条</span>
                      <span class="bh-r">
                        <button class="hb-btn sm" @click="hubAddRule(cfg.ruleGroupKey)">＋ 新增规则</button>
                        <button class="hb-btn danger sm" @click="cfgRuleRemoveGroup(cfg.ruleGroupKey)">删除规则集</button>
                      </span>
                    </div>
                  </div>

                  <div v-for="rn in cfgRuleNames(cfg.ruleGroupKey)" :key="rn" class="hb-rule hb-cut">
                    <div class="hb-rule-hd">
                      <span class="rh-n">{{ rn }}</span>
                      <span class="rh-s">{{ cfgRuleSummary(cfg.ruleGroupKey, rn) }}</span>
                      <span class="rh-r">
                        <span v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="hb-badge risk">含风险动作</span>
                        <label class="hb-switch" title="启用/停用该规则">
                          <input type="checkbox" :checked="cfgRuleEnabled(cfg.ruleGroupKey, rn)"
                                 @change="cfgRuleSetEnabled(cfg.ruleGroupKey, rn, $event.target.checked)">
                          <span class="hb-sw-track"></span>
                        </label>
                        <button class="hb-btn sm" @click="cfgRuleRename(cfg.ruleGroupKey, rn)">重命名</button>
                        <button class="hb-btn danger sm" @click="cfgRuleRemove(cfg.ruleGroupKey, rn)">删除</button>
                      </span>
                    </div>
                    <div class="hb-rule-flow">
                      <div class="hb-flow-grp">
                        <div class="hb-flow-grp-hd">条件<span class="fg-hint">全部满足才执行</span></div>
                        <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'conditions')" :key="i" class="hb-step">
                          <div class="hb-step-bar">
                            <span class="st-n">{{ i + 1 }}</span>
                            <span class="st-t">{{ hubPluginText(entry) }}</span>
                            <span class="st-r">
                              <button class="hb-btn ghost sm" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, -1)">↑</button>
                              <button class="hb-btn ghost sm" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'conditions', i, 1)">↓</button>
                              <button class="hb-btn danger sm" title="删除该条件" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'conditions', i)">✕</button>
                            </span>
                          </div>
                          <hub-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'conditions', i)"
                                     :key="hubKey(item.path)" :item="item"></hub-field>
                        </div>
                        <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'conditions').length" class="hb-hp">
                          没配条件 = 这条规则总是执行
                        </p>
                        <select class="hb-select" :value="''" @change="hubPickPlugin(cfg.ruleGroupKey, rn, 'conditions', $event)">
                          <option value="">＋ 添加条件…</option>
                          <option v-for="p in cfgConditionOptions()" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                      </div>
                      <div class="hb-flow-grp">
                        <div class="hb-flow-grp-hd">动作<span class="fg-hint">按顺序执行</span></div>
                        <div v-for="(entry, i) in cfgPluginList(cfg.ruleGroupKey, rn, 'actions')" :key="i"
                             class="hb-step" :class="hubStepClass(entry)">
                          <div class="hb-step-bar">
                            <span class="st-n">{{ i + 1 }}</span>
                            <span class="st-t">{{ hubPluginText(entry) }}</span>
                            <span class="st-r">
                              <button class="hb-btn ghost sm" title="上移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, -1)">↑</button>
                              <button class="hb-btn ghost sm" title="下移" @click="cfgPluginMove(cfg.ruleGroupKey, rn, 'actions', i, 1)">↓</button>
                              <button class="hb-btn danger sm" title="删除该动作" @click="cfgPluginRemove(cfg.ruleGroupKey, rn, 'actions', i)">✕</button>
                            </span>
                          </div>
                          <hub-field v-for="item in cfgSpecItems(cfg.ruleGroupKey, rn, 'actions', i)"
                                     :key="hubKey(item.path)" :item="item"></hub-field>
                        </div>
                        <p v-if="!cfgPluginList(cfg.ruleGroupKey, rn, 'actions').length" class="hb-hp">
                          未配置动作 = 规则只做条件判断, 不会执行任何操作
                        </p>
                        <select class="hb-select" :value="''" @change="hubPickPlugin(cfg.ruleGroupKey, rn, 'actions', $event)">
                          <option value="">＋ 添加动作…</option>
                          <option v-for="p in cfgActionOptions(cfg.ruleGroupKey, rn)" :key="p.name" :value="p.name">{{ p.label }}</option>
                        </select>
                      </div>
                    </div>
                    <div v-if="cfgRuleRisk(cfg.ruleGroupKey, rn)" class="hb-rule-foot">
                      <p class="hb-hp risk" style="margin:0">{{ cfgRuleRisk(cfg.ruleGroupKey, rn) }}</p>
                    </div>
                  </div>
                </template>
              </template>

              <!-- 限速: 阶梯图 + 档位(每一档是「流量低于 X → 限速 Y」一个整体) -->
