        <transition name="pop">
        <div v-if="menu.visible" ref="ctxMenu" class="ctx-menu" :style="{left: menu.x+'px', top: menu.y+'px'}" @contextmenu.prevent @click.stop>
          <!-- 行右键菜单四支(计划 26-10-20-0024 W3 起): 项集/顺序/显隐/跨层全部由注册表
               shared/ctx_menu.js(window.AQB_CTX_MENU_REG) + 布局数据(web.ctx_menu, 经
               /api/webui/flags 下发, lifecycle.loadWebFlags 写入 flags)驱动 —— 本模板只保留
               ①四支判据链(与 triggers.js variant 口径一致, 静态守阵 T3 的比对面)与
               ②「更多操作」子面板的展开交互(CTX-05/06, 在 menu.js)。
               渲染: ctxItems('<支>') 出一级可见项, ctxSubItems('member') 出次级可见项; 点击
               走 ctxRun(it) 分派到注册表 act(原方法调用逐字平移, 动作链一行不动)。默认布局
               (不写 ctx_menu 时)与静态模板逐位一致 —— 零漂移由 node 电池(注册表层)与
               e2e menus.spec(渲染层)双守。逐项语义(门控/置灰/动态文案/图标)见注册表内注释:
               改项集改注册表单点, 别回本模板逐项直写(直写 = 四支人肉奇偶, 复发路径即
               pitfall ctx-menu-branch-parity: 2026-10-09 用户报「辅种页单组右键菜单缺选项」)。
               置灰判据单点 = decorate.js::REANNOUNCE_BLOCKED_STATES(注册表 dyn: "reannounce"
               钩子 reannounceMenuGate(), qB 口径; title 恒绑字符串, 空串 = 清除提示通道)。

               CTX-03 批量菜单收录口径(plan 26-10-02-1955 W2/W3/W4 改写): 被右键的行属于当前
               选中集合时, 菜单升级为对**整个选中集合**生效(与批量动作同一套链路, 见 menu.js
               _ctxMulti / commands.js ctxAct)。收录"对整批同一语义"的动作(开始/暂停/汇报/
               重新校验/跳检/标签分类/批量删除)、"同一目标值作用于全选"的编辑项(限速/移动 ——
               本计划推翻旧版"批量菜单刻意不放限速等编辑项"的注释口径)与"逐目标同语义"的导出
               (导出 .torrent —— 每个目标各得一个 .torrent, 前端循环逐个触发下载, 不进 bulk
               合单); 跳检是高危项, 由 flags.skip_check_menu 门控(fail-closed, 后端端点同步
               拒单); 仍不放需要**逐目标现值**的单目标项(详细信息/重命名/复制等, 预填与展示
               都依赖单个目标的当前值); 要单目标操作请不选中任何行再右键。 -->
          <template v-if="menu.multi">
            <template v-for="it in ctxItems('multi')" :key="it.id">
              <div v-if="it.kind === 'sep'" class="ctx-sep"></div>
              <div v-else class="ctx-item" :class="[it.cls, { 'is-gated': it.gated }]" :title="it.title" @click="ctxRun(it)">
                <svg class="ico ico-sm" :class="it.icon.cls" viewBox="0 0 16 16"><use :href="it.icon.use"></use></svg>{{ it.label }}
              </div>
            </template>
          </template>
          <template v-else-if="menu.episode">
            <!-- 整集整剧(shows.js openShowEpMenu/openShowMenu): scope=ep/show 决定动态文案,
                 取首个成员哈希(同剧同集通常共用同一保存路径); 项集与注册表 episode 支对齐 -->
            <template v-for="it in ctxItems('episode')" :key="it.id">
              <div v-if="it.kind === 'sep'" class="ctx-sep"></div>
              <div v-else class="ctx-item" :class="[it.cls, { 'is-gated': it.gated }]" :title="it.title" @click="ctxRun(it)">
                <svg class="ico ico-sm" :class="it.icon.cls" viewBox="0 0 16 16"><use :href="it.icon.use"></use></svg>{{ it.label }}
              </div>
            </template>
          </template>
          <template v-else-if="menu.hash">
            <!-- 单种子(menu.hash): 一级 14 项(含「更多操作」父项)+ 5 线; 次级 11 项 + 2 线。
                 FX-15 次级菜单(R10-14: 文案由"高级能力"改"更多操作" —— 装的都是 qB 常规种子
                 控制, 不是"高级"能力); hover 与点击均可展开; CTX-06: 复制族(名称/哈希/magnet)
                 由独立子面板并入本面板末尾 —— 一级只留这一个入口; 移出父项/面板后延迟收起
                 (CTX-05, 180ms 宽限跨过 4px 缝, 见 menu.js openSub/keepSub/scheduleSubClose);
                 子面板钳位在 menu.js _subFitViewport(估宽只管首帧方向, 精确收口在实测)。
                 D7: 次级无可见项时注册表不出「更多操作」父项(单选项/空面板 = 半残 UI)。 -->
            <template v-for="it in ctxItems('member')" :key="it.id">
              <div v-if="it.kind === 'sep'" class="ctx-sep"></div>
              <div v-else-if="it.kind === 'submenu'" class="ctx-item has-sub" :class="{ open: subMenu === 'advanced' }"
                   @mouseenter="openSub('advanced', $event)" @mouseleave="scheduleSubClose()"
                   @click.stop="toggleSub('advanced', $event)">
                <svg class="ico ico-sm" :class="it.icon.cls" viewBox="0 0 16 16"><use :href="it.icon.use"></use></svg>{{ it.label }}
                <svg class="ico ico-sm ctx-caret" viewBox="0 0 16 16"><use href="#i-chevron"></use></svg>
                <div v-if="subMenu === 'advanced'" class="ctx-sub" :class="{ 'flip-x': subFlip }"
                     :style="{ top: subTop + 'px' }"
                     @click.stop @mouseenter="keepSub()">
                  <template v-for="sit in ctxSubItems('member')" :key="sit.id">
                    <div v-if="sit.kind === 'sep'" class="ctx-sep"></div>
                    <div v-else class="ctx-item" :class="[sit.cls, { 'is-gated': sit.gated }]" :title="sit.title" @click="ctxRun(sit)">
                      <svg class="ico ico-sm" :class="sit.icon.cls" viewBox="0 0 16 16"><use :href="sit.icon.use"></use></svg>{{ sit.label }}
                    </div>
                  </template>
                </div>
              </div>
              <div v-else class="ctx-item" :class="[it.cls, { 'is-gated': it.gated }]" :title="it.title" @click="ctxRun(it)">
                <svg class="ico ico-sm" :class="it.icon.cls" viewBox="0 0 16 16"><use :href="it.icon.use"></use></svg>{{ it.label }}
              </div>
            </template>
          </template>
          <template v-else>
            <!-- CTX-03 组级动作补齐(2026-10-09 用户报「单组右键菜单缺选项」): 单组菜单此前只有
                 开始/暂停/汇报 + 打开文件夹/流量图/删除, 而多选批量菜单还有 重新校验/跳检/限速/
                 移动/标签分类/导出 —— 同一批动作在「右键 1 组」与「选 2 组」两条路径上项集不一致。
                 现按批量菜单同序同图标补齐(项集在注册表 group 支), 目标 = 该组全部成员
                 (menu.key 组级解析); 下游复用多选同一套链路(recheckGroup / skipCheckGroup /
                 editLimitsGroup / editMoveGroup / metaGroup / exportGroup, 见 commands.js),
                 不为组级另开旁路。跳检同样吃 flags.skip_check_menu 门控(fail-closed);
                 qB 口径流量图(S5b)吃 flags.qb_traffic_enabled 门(无入口即无请求, P5 验收)。 -->
            <template v-for="it in ctxItems('group')" :key="it.id">
              <div v-if="it.kind === 'sep'" class="ctx-sep"></div>
              <div v-else class="ctx-item" :class="[it.cls, { 'is-gated': it.gated }]" :title="it.title" @click="ctxRun(it)">
                <svg class="ico ico-sm" :class="it.icon.cls" viewBox="0 0 16 16"><use :href="it.icon.use"></use></svg>{{ it.label }}
              </div>
            </template>
          </template>
        </div>
        </transition>
        <!-- 表头右键菜单(TBL-05): 针对**该列**的操作 —— "隐藏xxx"即隐藏这一列; 另给排序直达与完整列选择器入口 -->
        <transition name="pop">
        <div v-if="headMenu.visible" ref="headMenuEl" class="ctx-menu" :style="{left: headMenu.x+'px', top: headMenu.y+'px'}"
             @click.stop @contextmenu.prevent>
          <div class="ctx-item" :class="{ muted: headMenu.locked }" @click="headMenuHide()">
            <svg class="ico ico-sm ico-hide" viewBox="0 0 16 16"><use href="#i-eye-off"></use></svg>
            {{ headMenu.locked ? '「' + headMenu.label + '」为必显列' : '隐藏「' + headMenu.label + '」' }}
          </div>
          <template v-if="headMenu.sortable">
            <div class="ctx-sep"></div>
            <div class="ctx-item" @click="headMenuSort(-1)">
              <svg class="ico ico-sm ico-sort" viewBox="0 0 16 16"><use href="#i-arrow-down"></use></svg>按「{{ headMenu.label }}」降序
            </div>
            <div class="ctx-item" @click="headMenuSort(1)">
              <svg class="ico ico-sm ico-sort" viewBox="0 0 16 16"><use href="#i-arrow-up"></use></svg>按「{{ headMenu.label }}」升序
            </div>
          </template>
          <!-- FX-28: 时间点列(见 TIME_FMT_KEYS)通用 —— 显示口径切换(勾 = 当前口径); 时长列不出现 -->
          <template v-if="headTimeFmtAble()">
            <div class="ctx-sep"></div>
            <div class="ctx-item" @click="headMenuTimeFmt('rel')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-clock"></use></svg>相对时间(3分钟前)
              <svg v-if="timeFmt[headMenu.key] === 'rel'" class="ico ico-sm col-tick ctx-tick" viewBox="0 0 16 16"><use href="#i-check"></use></svg>
            </div>
            <div class="ctx-item" @click="headMenuTimeFmt('abs')">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-calendar"></use></svg>绝对时间(09-20 20:56)
              <svg v-if="timeFmt[headMenu.key] === 'abs'" class="ico ico-sm col-tick ctx-tick" viewBox="0 0 16 16"><use href="#i-check"></use></svg>
            </div>
          </template>
          <div class="ctx-sep"></div>
          <div class="ctx-item" @click="headMenuPicker()">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-columns"></use></svg>显示/隐藏列…
          </div>
        </div>
        </transition>
        <!-- 文件优先级小菜单(详情抽屉内容页签): 复用 .ctx-menu 视觉, 锚定单元格, 视口吸附 -->
        <transition name="pop">
        <div v-if="filePrio.visible" ref="filePrioEl" class="ctx-menu" :style="{left: filePrio.x+'px', top: filePrio.y+'px'}" @click.stop>
          <div class="ctx-item" @click="setFilePriority(0)">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>不下载
          </div>
          <div class="ctx-item" @click="setFilePriority(1)">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-down"></use></svg>正常
          </div>
          <div class="ctx-item" @click="setFilePriority(6)">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-arrow-up"></use></svg>高
          </div>
          <div class="ctx-item" @click="setFilePriority(7)">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-bolt"></use></svg>最高
          </div>
        </div>
        </transition>
        <!-- 抽屉右键菜单(R2 S3 计划 26-10-09-2219 · 2026-10-10 模板选择迁右键): 菜单内容 = 右键
             命中区域的模板选项(单选带勾, 经典恒在首位; 目标页签见 dtMenuTab/openDrawerMenu) +
             分隔线 + 合并开关(仅种子详情形态 dtMenuMergeOn; 流量形态只出流量模板选项)。
             合并开启且门内时页签栏收敛为两对合并页签[常规&内容][Tracker&用户], 正文双列并排;
             门不满足置灰可见(is-gated + title 提示; dtToggleMerge 里再拦一道, 无入口即无状态变化)。 -->
        <transition name="pop">
        <div v-if="drawerMenu.visible" ref="drawerMenuEl" class="ctx-menu" :style="{left: drawerMenu.x+'px', top: drawerMenu.y+'px'}"
             @click.stop @contextmenu.prevent>
          <div v-for="o in dtMenuTplOptions" :key="o.id" class="ctx-item" @click="dtMenuPick(o.id)">
            <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-layers"></use></svg>{{ o.label }}
            <svg v-if="dtMenuTplCurrent === o.id" class="ico ico-sm ctx-tick" viewBox="0 0 16 16"><use href="#i-check"></use></svg>
          </div>
          <template v-if="dtMenuMergeOn">
            <div class="ctx-sep"></div>
            <div class="ctx-item" :class="{ 'is-gated': !dtMergeGateOk() }"
                 :title="dtMergeGateOk() ? '常规&amp;内容 · Tracker&amp;用户 并排（再点关闭）' : '窗口宽度不足'"
                 @click="dtToggleMerge()">
              <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-columns"></use></svg>合并页签
              <svg v-if="dtMenuMergeOn" class="ico ico-sm ctx-tick" viewBox="0 0 16 16"><use href="#i-check"></use></svg>
            </div>
          </template>
        </div>
        </transition>
        </main>
      </div>
