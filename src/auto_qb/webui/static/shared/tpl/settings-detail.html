              <!-- 快捷键分区(W6, 计划 26-09-28-0354 §5.2): 客户端块, 不进配置 schema

              <template v-else-if="hub.view === 'keys'">

                    <span class="bh-n">点「录制」后按下组合键即录入 · Esc 取消录制 · 禁用 = 空键位</span>

                      <button class="hb-btn ghost sm" :disabled="kbKeysLoading" @click="kbResetAll()">全部重置</button>
                      <button class="hb-btn primary sm" :disabled="!kbDirty() || kbKeysLoading" @click="kbSaveKeys()">保存</button>

              <!-- 「WebUI」卡(计划 26-10-20-0024 W4, D6): 跳检开关迁入 + 行右键菜单布局定制。

                   shared/ctx_menu_custom.js, 合并语义复用 shared/ctx_menu.js(与运行时同一份)。

              <template v-else-if="hub.view === 'webui'">

                <div class="hb-blk hb-cut">

                    <span class="bh-t">跳检开关</span>
                    <span class="bh-n">关闭时种子右键菜单不显示跳检项, web 端点同步拒单(fail-closed); 规则源里的跳检不受影响</span>

                  <div class="hb-row">
                    <span class="hb-lb">右键菜单显示跳检</span>

                  </div>
                </div>

                <div class="hb-blk hb-cut ctx-custom">
                  <div class="hb-blk-hd">
                    <span class="bh-t">右键菜单布局</span>
                    <span class="bh-n">拖动或 ↑↓ 调顺序 · 取消勾选 = 隐藏(位置留着, 勾回来即归位) · 「移入次级/移出到一级」在一级与「更多操作」之间搬家</span>
                    <span class="bh-r">
                      <button class="hb-btn ghost sm" :disabled="!cmBranchCustomized"

                    </span>
                  </div>

                  <!-- tab(一支一屏, D15): 角标 = 一级/次级可见项数(隐藏与开关关掉的都不计, 与菜单同口径) -->
                  <div class="ctx-custom-tabs">
                    <button v-for="b in ctxBranchList" :key="b.key" class="ctx-custom-tab"
                            :class="{ on: cmBranch === b.key }" @click="ctxCust.branch = b.key">
                      <span class="ctx-custom-tab-t">{{ b.label }}</span>
                      <span class="ctx-custom-tab-n">{{ b.top }}<template v-if="b.sub"> · 次级 {{ b.sub }}</template></span>
                      <span v-if="cmIsCustomized(b.key)" class="ctx-custom-dot" title="这支已定制(与默认布局不同)"></span>
                    </button>
                  </div>
                  <p class="ctx-custom-hint">{{ cmBranchHint }}</p>

                  <!-- 两个固定区(D17): 一级 / 次级「更多操作」。同一张表渲染两次(区标题/说明来自
                       cmSections), 行内容逐字相同 —— 两处各写一份就是"改一边忘另一边"的复发形态 -->
                  <div v-for="sec in cmSections" :key="sec.level" class="ctx-custom-sec"
                       @dragover.prevent @drop.prevent="cmDropTail(cmBranch, sec.level)">
                    <div class="ctx-custom-sec-hd">
                      <span class="ctx-custom-sec-t">{{ sec.title }}</span>
                      <span class="ctx-custom-sec-n">{{ sec.note }}</span>
                      <button class="hb-btn ghost sm" @click="cmAddSep(cmBranch, sec.level)">+ 分隔线</button>
                    </div>
                    <div class="ctx-custom-list">
                      <div v-for="r in cmRows(cmBranch, sec.level)" :key="r.id" class="ctx-custom-row"
                           :class="{ off: r.hidden, sep: r.sep, danger: r.danger,
                                     dragging: ctxCust.drag && ctxCust.drag.level === r.level && ctxCust.drag.id === r.id,
                                     over: ctxCust.over && ctxCust.over.level === r.level && ctxCust.over.idx === r.idx }"
                           draggable="true"
                           @dragstart="cmDragStart(r, $event)" @dragover="cmDragOver(r, $event)"
                           @drop.prevent.stop="cmDropAt(r)" @dragend="cmDragEnd()">
                        <span class="ctx-custom-grip" aria-hidden="true">⋮⋮</span>
                        <label class="ctx-custom-chk"
                               :title="r.sep ? (r.hidden ? '显示这条线' : '隐藏这条线') : (r.hidden ? '在菜单里显示' : '在菜单里隐藏')">
                          <input type="checkbox" :checked="!r.hidden" @change="cmToggleHidden(cmBranch, r.level, r.id)">
                        </label>
                        <template v-if="r.sep">
                          <span class="ctx-custom-sep-line"></span>
                          <span class="ctx-custom-sep-t">{{ r.label }}</span>
                          <span class="ctx-custom-acts">
                            <button v-if="r.userSep" class="ctx-custom-x" title="删除这条线"
                                    @click="cmDelSep(cmBranch, r.level, r.id)">✕</button>
                          </span>
                        </template>
                        <template v-else>
                          <svg v-if="r.use" class="hb-ico ctx-custom-ico" viewBox="0 0 16 16" aria-hidden="true"><use :href="r.use"></use></svg>
                          <span class="ctx-custom-name">{{ r.label }}</span>
                          <span v-if="r.submenu" class="ctx-custom-tag">次级入口</span>
                          <span v-if="r.gate" class="ctx-custom-tag gate">开关控制</span>
                          <span v-if="r.danger" class="ctx-custom-tag danger">危险</span>
                          <span class="ctx-custom-acts">
                            <button class="ctx-custom-arrow" :disabled="r.idx === 0" title="上移"
                                    @click="cmMoveStep(cmBranch, r.level, r.id, -1)">↑</button>
                            <button class="ctx-custom-arrow" :disabled="r.idx === cmRows(cmBranch, r.level).length - 1" title="下移"
                                    @click="cmMoveStep(cmBranch, r.level, r.id, 1)">↓</button>
                            <button v-if="r.movable" class="hb-btn ghost sm"
                                    @click="cmMoveLevel(cmBranch, r.level, r.id)">{{ r.level === 0 ? '移入次级' : '移出到一级' }}</button>
                          </span>
                        </template>
                      </div>
                      <p v-if="sec.level === 1 && !cmRows(cmBranch, 1).length" class="ctx-custom-empty">
                        次级菜单为空 —— 右键菜单里不会出现「更多操作」入口。把上面的项「移入次级」即可建立入口。
                      </p>
                    </div>
                  </div>

                  <p class="ctx-custom-note">
                    布局与其它配置项一起保存(右上角「保存」), 保存后当前标签的右键菜单立即生效, 其它标签/浏览器刷新后生效。
                    分隔线是一等公民: 用户加的线可以删, 默认线只能隐藏(隐藏后位置仍保留在配置里)。
                  </p>
                </div>
              </template>

              <!-- 运行日志(2026-09-26 并入「常规」分区页尾, 不再单列首页卡/独立分区; 2026-09-28 起默认折叠):
                   等级/行数变更与刷新均手动触发, 不自动轮询; 首次展开才拉一次(config_hub.js hubLogsToggle) -->

              <!-- 普通分区: 块 → 行(取代旧页的五种折叠容器) -->
              <template v-else>
                <div v-for="b in hubBlocks" :key="b.key" class="hb-blk hb-cut">
                  <div class="hb-blk-hd">
                    <span class="bh-t">{{ b.label }}</span>
                    <span v-if="b.help" class="bh-n">{{ b.help }}</span>
                    <span class="bh-r">
                      <!-- readonly(程序托管)段(如 fs): 启用/关闭开关无意义, 换成徽标(issue 26-09-28-2135) -->
                      <template v-if="b.section">
                        <span v-if="b.item.field && b.item.field.readonly" class="hb-badge">程序维护</span>
                        <aq-switch v-else :checked="cfgExists(b.item.path)"
                                   :on-change="(v) => cfgToggleSection(b.item.path, b.item.field, v)"></aq-switch>
                      </template>
                    </span>
                  </div>
                  <template v-if="!b.section || cfgExists(b.item.path)">
                    <hub-field v-for="row in b.rows" :key="hubKey(row.path)" :item="row"></hub-field>
                  </template>
                </div>
                <!-- M4+合并(2026-09-25): HR 站点状态(只读端点 /api/hr/status) 并入「HR 在线核实」分区页尾,
                     不再单列首页卡片; 26-10-02-1936 阶段2 起默认折叠, 打开分区不再自动拉数(决策点⑤a),
                     首次展开才拉(hr_status.js hrsToggle), 之后手动刷新(站点数据小时级节奏, 不轮询) -->
                <template v-if="hub.view === 'hr_check'">
                  <!-- 站点接入(计划 26-09-27-1318; 绑定改映射制见 26-09-27-1930): 启用的唯一入口 ——
                       卡片键来自内置站点档案(schema.constants.hr_check_site_presets), 点选启用 + 微调,
                       零 URL/路径/参数填写; 绑定状态前端按映射口径先行提示, fail-fast 仍在后端校验兜底 -->
                  <div class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">站点接入</span>
                      <span class="bh-n">点选启用; 页面地址/解析器/下载路径由内置站点档案自动处理, 微调可折叠</span>
                    </div>
                    <div style="padding:12px 14px">
                      <p v-if="!hrSitePresets().length" class="hb-hp">当前版本没有内置站点档案(升级后这里会出现可接入的站点)</p>
                      <div v-else class="hrs-list">
                        <article v-for="p in hrSitePresets()" :key="p.id" class="hrs-site">
                          <div class="hrs-site-head">
                            <span class="hrs-site-name">{{ p.id }}</span>
                            <span class="hrs-tag">解析器 {{ p.adapter }}</span>
                            <span class="hrs-tag" :class="hrSiteBinding(p).cls">{{ hrSiteBinding(p).text }}</span>
                          </div>
                          <p class="hrs-line">HR 页 https://{{ p.web_domain }}{{ p.page_path }} · 种子下载 {{ p.download_path }} · 翻页参数 ?{{ p.page_param }}=N(档案内置, 无需填写)</p>
                          <div class="hrs-line" style="display:flex;align-items:center;gap:10px">
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                              <input type="checkbox" :checked="hrSiteEnabled(p.id)" @change="hrSiteSetEnabled(p.id, $event.target.checked)">
                              <span>启用在线核实</span>
                            </label>
                          </div>
                          <details v-if="hrSiteEnabled(p.id) || cfgExists(['config', 'hr_check', 'sites', p.id])" style="margin-top:6px">
                            <summary class="bh-n">微调项(不改就用默认值)</summary>
                            <hub-field v-for="row in hrSiteTuningItems(p.id)" :key="hubKey(row.path)" :item="row"></hub-field>
                          </details>
                        </article>
                      </div>
                    </div>
                  </div>

                  <div class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">站点状态</span>
                      <span class="bh-n">{{ hrsSummaryText() }}</span>
                      <span class="bh-r">
                        <span v-if="hrsPollText()" class="bh-n">{{ hrsPollText() }}</span>
                        <button class="hb-btn ghost sm" :disabled="hrs.refreshing" @click="hrsExpandAndRefreshAll()">全部立即拉取</button>
                        <button class="hb-btn ghost sm" :disabled="hrs.loading" @click="hrsExpandAndReload()">刷新</button>
                        <button class="hb-btn ghost sm" :aria-expanded="hrsOpen" @click="hrsToggle()">{{ hrsOpen ? '收起' : '展开' }}</button>
                      </span>
                    </div>
                  </div>
                    <!-- 折叠 ⇄ 全屏覆盖层(计划 26-10-02-1936 阶段2, 用户拍板①改判): 「展开」即打开覆盖式
                         全屏弹窗(让出顶栏与状态栏), 两态之间没有内嵌展开态 —— 内容区只在覆盖层里可见。
                         实现是同一节点 v-show + fixed 定位, 不做 DOM 搬迁: 本项目是 Vue 3 运行时模板,
                         appendChild 搬 Vue 管理的节点会在重渲染时与锚点插入打架; chips 过滤(laneSel)与
                         阶段3 的排序状态都在组件 state 里, 单节点显隐天然随行, 零新请求。
                         !覆盖层必须是 .hb-blk 的**兄弟**而不是子节点: atlas 的 .hb-cut 带 clip-path,
                         会把 fixed 后代的绘制裁剪到块盒内(全屏层只剩与块重叠的部分可点, 其余点穿)。
                         关闭三路: ✕ / ESC(lifecycle 退栈链 hrsOpen 分支, 先于 26-10-02-1632 清筛选兜底) /
                         点遮罩(.hr-full-mask, 面板盖满中段时自然兜不到, 保留遮罩点击为面板留缝时的兜底) -->
                    <!-- aqb:hr-full-modal:begin (守阵 test_frontend_hr_full_modal_wiring 的扫描锚) -->
                    <div class="hr-full-mask" v-show="hrsOpen" aria-hidden="true" @click="hrsCollapse()"></div>
                    <section v-show="hrsOpen" class="hr-full-modal" role="dialog" aria-modal="true" aria-label="站点状态(全屏)">
                      <div class="hr-full-modal-hd">
                        <span class="hr-full-modal-t">站点状态</span>
                        <span class="hr-full-modal-sub">{{ hrsSummaryText() }}</span>
                        <button class="hb-btn ghost sm" aria-label="关闭" @click="hrsCollapse()">✕</button>
                      </div>
                      <div class="hr-full-modal-bd">
                        <div style="padding:12px 14px">
                      <p v-if="hrs.note" class="logs-note">{{ hrs.note }}</p>
                      <p v-if="hrs.refreshNote" class="logs-note">{{ hrs.refreshNote }}</p>
                      <p v-if="hrs.loaded && hrs.enabled" class="hrs-channel">{{ hrsChannelText() }}</p>
                      <p v-if="hrs.loading && !hrs.loaded" class="hb-hp">正在读取站点状态…</p>
                      <p v-else-if="hrs.error" class="hb-hp error">{{ hrs.error }}</p>
                      <p v-else-if="!hrs.sites.length" class="hb-hp">
                        {{ hrs.enabled ? '还没有站点配置 hr_check 或取数线程未启动' : 'HR 在线核实未启用(配置里打开后这里会显示各站点现状)' }}
                      </p>
                      <div v-else class="hrs-list">
                        <article v-for="s in hrs.sites" :key="s.site" class="hrs-site">
                          <div class="hrs-site-head">
                            <span class="hrs-site-name">{{ s.site }}</span>
                            <span class="hrs-tag">{{ s.listing === 'none' ? '全站型' : '清单型' }}</span>
                            <span class="hrs-tag" :class="hrsStateClass(s)">{{ hrsStateText(s) }}</span>
                            <span class="hrs-tag">通道 {{ s.channel_text }}</span>
                            <span v-if="s.stale" class="hrs-tag warn">复用窗已过</span>
                            <span v-if="s.zero_rows && !s.empty_confirmed && !s.count_attested_empty" class="hrs-tag warn">零行未确认</span>
                            <span v-if="s.count_attested_empty" class="hrs-tag ok">计数自证空集</span>
                          </div>
                          <p class="hrs-line">{{ s.fresh_text }}
                            <button class="hb-btn ghost sm" :disabled="hrs.refreshing"
                                    @click="hrsRefresh(s.site)">立即拉取</button>
                          </p>
                          <!-- 表① 全量详情表(计划 26-10-01-2216 阶段2 + 26-10-02-1936 阶段3): 逐种子清单,
                               按站点按需拉一次(hr_status.js loadHrSiteEntries, 打开分区/手动刷新, 不轮询);
                               档位 chips × 已删除种子切换钮前端本地过滤不回后端; 表头三态排序对齐种子页
                               (shared/sort.js 范式: 首点降 → 再点升 → 第三击恢复后端默认序, 空值恒末位);
                               三列重组(拍板④): 档位徽章 / 核实结论(徽章+来源·时间副行) / 在列(徽章+最近被见到副行);
                               骨架照 .drawer-table 范式(同挂一类);
                               单元格一律不挂原生 title(hr-tooltip-overlap), 名称过长靠 .wrap 换行;
                               人话(lane_text/need_seed_text/verified_source_text)全由后端算好, 前端不重算 -->
                          <!-- aqb:hr-detail-table:begin (守阵 test_frontend_hr_detail_table_wiring 的扫描锚) -->
                          <template v-for="d in [hrsDetailOf(s.site)]" :key="'hrd-' + s.site">
                            <div v-if="d.loaded && !d.error" class="hr-detail-table-bar">
                              <span v-for="c in hrsLaneChips()" :key="c[0]" class="hrs-tag hr-chip"
                                    :class="{ on: hrsLaneSelOf(s.site) === c[0] }"
                                    @click="hrsSetLaneSel(s.site, c[0])">{{ c[1] }}</span>
                              <span class="hrs-tag hr-chip" :class="{ on: hrsOldOnOf(s.site) }"
                                    @click="hrsToggleOld(s.site)">{{ hrsOldBtnText(s.site) }}</span>
                              <span v-if="d.now" class="hr-detail-table-fresh">数据截至 {{ fmtTs(d.now) }}</span>
                            </div>
                            <p v-if="d.loading && !d.loaded" class="hb-hp">正在读取站点明细…</p>
                            <aq-empty v-else-if="d.error" icon="#i-warn" :text="d.error"></aq-empty>
                            <aq-empty v-else-if="d.readError" icon="#i-warn" :text="'站点文件读取失败: ' + d.readError"></aq-empty>
                            <table v-else-if="hrsDetailRows(s.site).length" class="drawer-table hr-detail-table">
                              <thead>
                                <!-- 表头借表壳组件 thead 模式(计划 26-10-11-1722 P5): 根模板是
                                     in-DOM 的, 自定义元素直接放 <thead> 里会被浏览器 foster-parent
                                     移出表格 ⇒ 用 <tr is="vue:aq-table"> 占位; 排序仍走 HR 自己的
                                     hrsSetSort(D3=B), 组件只画列名/箭头并 emit sort -->
                                <tr is="vue:aq-table" mode="thead" table-id="hrDetail" :cols="hrsCols()"
                                    :sort-key="hrsSortKeyOf(s.site)" :sort-dir="hrsSortDirOf(s.site)"
                                    @sort="hrsSetSort(s.site, $event)"></tr>
                              </thead>
                              <tbody>
                                <tr v-for="e in hrsDetailRows(s.site)" :key="e.tid" :class="{ missing: !e.active }">
                                  <td><span class="hr-lane" :class="hrsLaneCls(e.lane)">{{ e.lane }} {{ e.lane_text }}</span></td>
                                  <td class="wrap">{{ e.name || "—" }}</td>
                                  <td class="mono-cell">{{ e.tid }}</td>
                                  <td class="num">{{ hrsSize(e.uploaded_bytes) }}</td>
                                  <td class="num">{{ hrsSize(e.downloaded_bytes) }}</td>
                                  <td class="num">{{ hrsRatio(e.ratio) }}</td>
                                  <td class="num">{{ hrsNeedSeed(e.need_seed_text) }}</td>
                                  <td class="mono-cell">{{ hrsDone(e.done_iso) }}</td>
                                  <td><span class="hr-vsrc" :class="hrsSrcCls(e)">{{ hrsVerdictText(e) }}</span><span
                                       class="hr-sub">{{ hrsVerdictSub(e) }}</span></td>
                                  <td><span class="hr-pres" :class="hrsPresenceCls(e)">{{ hrsPresenceText(e) }}</span><span
                                       class="hr-sub">{{ hrsPresenceSub(e) }}</span></td>
                                </tr>
                              </tbody>
                            </table>
                            <aq-empty v-else :text="hrsEmptyText(s.site)"></aq-empty>
                          </template>
                          <!-- aqb:hr-detail-table:end -->
                          <!-- 表② 排障视图(计划 26-10-01-2216 阶段3, 拍板①a): 排障性文本(取波/守恒/零行三态/
                               现在不放行/备注/站点文件/配额/时间窗/存量)收进原生 details **默认收起**, 表格化为
                               站点级 kv 行 + 各档波次明细(§5.3); 展开态是临时排障动作, 不进 localStorage 不持久化;
                               数据全来自 /api/hr/status 现有载荷(hrsKvRows 拼行), 无新请求无新定时器;
                               波次表同挂 .hr-detail-table 继承表① 徽章色义(计划: 阶段3 复用阶段2 骨架与徽章) -->
                          <!-- aqb:hr-diag:begin (守阵 test_frontend_hr_diag_view_wiring 的扫描锚) -->
                          <details class="hrs-diag">
                            <summary>排障视图 · 波次明细与站点诊断</summary>
                            <table class="drawer-table hr-diag-kv">
                              <tbody>
                                <tr v-for="kv in hrsKvRows(s)" :key="kv.k">
                                  <td>{{ kv.k }}</td>
                                  <td class="mono-cell" :class="kv.cls">{{ kv.v }}
                                    <button v-if="kv.act" class="hb-btn ghost sm" :disabled="hrs.confirming"
                                            @click="hrsConfirmEmpty(s.site)">确认空清单</button>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                            <table v-if="s.lanes && s.lanes.length" class="drawer-table hr-detail-table hr-wave-table">
                              <thead>
                                <!-- 波次表列定义取 HR 表注册表(hrsWaveCols, 计划 26-10-11-1722 P5);
                                     不接排序(行数 ≤4), 故不上表壳组件。两支写在同一行(v-for 的
                                     template 内不留空白 —— 空白会被 Vue 折成零长文本节点混进 <tr>,
                                     子节点骨架比对即红)且 num 列走 v-if 而不是 `:class="{num}"` ——
                                     后者在非 num 列会渲出空 class=""(normalizeClass 恒回字符串) -->
                                <tr>
                                  <template v-for="c in hrsWaveCols()" :key="c.key"><th v-if="c.num" class="num">{{ c.label }}</th><th v-else>{{ c.label }}</th></template>
                                </tr>
                              </thead>
                              <tbody>
                                <tr v-for="ls in s.lanes" :key="ls.lane">
                                  <td><span class="hr-lane" :class="hrsLaneCls(ls.lane)">{{ ls.lane }} {{ ls.lane_text }}</span></td>
                                  <td class="mono-cell" :class="hrsLaneClass(ls)">{{ ls.status_text }}</td>
                                  <td class="num">{{ ls.pages }}</td>
                                  <td class="num">{{ ls.rows }}</td>
                                  <td class="num">{{ hrsWaveCutoff(ls) }}</td>
                                  <td class="num">{{ ls.fail_streak }}</td>
                                  <td class="num">{{ hrsWaveCount(ls) }}</td>
                                  <td class="mono-cell">{{ ls.detail || "—" }}</td>
                                </tr>
                              </tbody>
                            </table>
                            <p v-else class="hrs-line">各档波次: {{ s.lanes_text || '-' }}</p>
                          </details>
                          <!-- aqb:hr-diag:end -->
                        </article>
                      </div>
                      <!-- 表③ 拉取历史(计划 26-10-04-0312 §3.5): 全局段(历史跨站点成时间轴, 不进 per-site
                           article), 表② 同款 <details> 折叠范式默认收起; 首次展开才拉一次 /api/hr/history
                           (limit=300, @toggle 触发 hrsHistEnsureLoaded), 「刷新」手动重拉, 不轮询不加定时器;
                           站点 chips 由行内站点集合现算 + 「仅看异常」toggle, 纯前端本地过滤不回后端;
                           行点击展开各档明细子行(hrsHistSubText); 人话(ts_text/trigger_text/result_text/
                           result_tone/lane_text/status_text/elapsed_text)全由后端算好, 前端只挑徽章色档
                           与排版; 展开态不持久化(表② 同款临时排障动作) -->
                      <!-- aqb:hr-history:begin (守阵 test_frontend_hr_history_wiring 的扫描锚) -->
                      <details class="hrs-diag" @toggle="hrsHistOnToggle($event)">
                        <summary>拉取历史 · 最近取数与波次明细</summary>
                        <p v-if="!hrs.enabled" class="hb-hp">HR 在线核实未启用(启用后这里会显示最近取数与波次明细)</p>
                        <template v-else>
                          <div v-if="hrsHist.loaded && !hrsHist.error" class="hr-detail-table-bar">
                            <span v-for="c in hrsHistSiteChips()" :key="'hrh-chip-' + c[0]" class="hrs-tag hr-chip"
                                  :class="{ on: hrsHistSiteSel() === c[0] }"
                                  @click="hrsHistSetSite(c[0])">{{ c[1] }}</span>
                            <span class="hrs-tag hr-chip" :class="{ on: hrsHistBadOn() }"
                                  @click="hrsHistToggleBad()">仅看异常</span>
                            <button class="hb-btn ghost sm" :disabled="hrsHist.loading" @click="hrsHistReload()">刷新</button>
                            <span class="hr-detail-table-fresh">{{ hrsHistFreshText() }}</span>
                          </div>
                          <p v-if="hrsHist.loading && !hrsHist.loaded" class="hb-hp">正在读取拉取历史…</p>
                          <p v-else-if="hrsHist.error" class="hb-hp error">{{ hrsHist.error }}
                            <button class="hb-btn ghost sm" :disabled="hrsHist.loading" @click="hrsHistReload()">重试</button></p>
                          <template v-else>
                            <p v-for="(histErr, histSite) in hrsHist.readErrors" :key="'hrh-err-' + histSite" class="hrs-line error">站点 {{ histSite }} 文件读取失败: {{ histErr }}</p>
                            <table v-if="hrsHistRows().length" class="drawer-table hr-detail-table hr-hist-table">
                              <thead><tr>
                                <th>时间</th><th>站点</th><th>触发</th><th>结果</th>
                                <th class="num">页数</th><th class="num">行数</th><th class="num">回填</th><th class="num">放行</th>
                                <th class="num">耗时</th><th>说明</th>
                              </tr></thead>
                              <tbody>
                                <template v-for="r in hrsHistRows()" :key="'hrh-' + hrsHistKey(r)">
                                  <tr class="hr-hist-row" @click="hrsHistToggleRow(r)">
                                    <td class="mono-cell">{{ r.ts_text }}</td>
                                    <td class="mono-cell">{{ r.site }}</td>
                                    <td>{{ r.trigger_text }}</td>
                                    <td><span class="hr-hres" :class="hrsHistResCls(r)">{{ r.result_text }}</span></td>
                                    <td class="num">{{ hrsHistWaveNum(r, 'pages') }}</td>
                                    <td class="num">{{ hrsHistWaveNum(r, 'rows') }}</td>
                                    <td class="num">{{ hrsHistBackfill(r) }}</td>
                                    <td class="num">{{ hrsHistVerified(r) }}</td>
                                    <td class="num">{{ r.elapsed_text || '—' }}</td>
                                    <td class="wrap">{{ r.reason || '—' }}</td>
                                  </tr>
                                  <tr v-if="hrsHistIsOpen(r)" class="hr-hist-sub">
                                    <td colspan="10">{{ hrsHistSubText(r) }}</td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                            <p v-else class="hb-hp">最近还没有拉取记录(取数波完成/被拦/人工对账后这里会出现时间轴)</p>
                          </template>
                        </template>
                      </details>
                      <!-- aqb:hr-history:end -->
                      </div>
                      </div>
                    </section>
                    <!-- aqb:hr-full-modal:end -->
                </template>

                <!-- 运行日志: 随「常规」分区页尾渲染(hub.view === 'basic'), 不自动轮询;
                     默认折叠(2026-09-28), 首次展开才拉一次(config_hub.js hubLogsToggle) -->
                <template v-if="hub.view === 'basic'">
                  <div class="hb-blk hb-cut">
                    <div class="hb-blk-hd">
                      <span class="bh-t">运行日志</span>
                      <span class="bh-n">{{ logs.file || '日志文件未配置(config.log.file)' }}</span>
                      <span class="bh-r">
                        <select class="hb-select" v-model="logs.level" @change="hubLogsLoad()">
                          <option value="">全部级别</option>
                          <option value="INFO">INFO</option>
                          <option value="WARNING">WARNING</option>
                          <option value="ERROR">ERROR</option>
                        </select>
                        <select class="hb-select" v-model.number="logs.num" @change="hubLogsLoad()">
                          <option :value="200">200 行</option>
                          <option :value="300">300 行</option>
                          <option :value="500">500 行</option>
                          <option :value="1000">1000 行</option>
                          <option :value="2000">2000 行</option>
                        </select>
                        <button class="hb-btn ghost sm" :disabled="logs.loading" @click="hubLogsLoad()">刷新</button>
                        <button class="hb-btn ghost sm" :aria-expanded="logs.open"
                                @click="hubLogsToggle()">{{ logs.open ? '收起' : '展开' }}</button>
                      </span>
                    </div>
                    <!-- 折叠体用 v-if 不用 v-show(26-10-20-2231 / R23-B-16 立判据 (d)): 折叠态
                         隐层若留在 DOM 里, 读屏与页内查找仍能命中一段「看不见的日志」; 日志行
                         本来就是一次性长文本, 收起时没有任何理由继续占着节点。 -->
                    <div v-if="logs.open" style="padding:12px 14px">
                      <p v-if="logs.note" class="logs-note">{{ logs.note }}</p>
                      <pre v-if="logs.lines.length" class="hb-logs-pre">{{ logs.lines.join('\n') }}</pre>
                      <p v-else class="hb-hp">{{ logs.loading ? '正在加载日志…' : (logs.error || '日志文件暂无内容') }}</p>
                    </div>
                  </div>
                </template>
              </template>
            </div>
          </div>

          <div class="hb-actbar">
            <span class="ab-st">
              <span class="hb-led" :class="cfgDirty ? 'warn' : 'ok'"></span>
              {{ cfgDirty ? '有改动还没保存' : '已与磁盘同步' }}
            </span>
            <span class="ab-r">
              <button class="hb-btn ghost" @click="cfgDiscard()">放弃改动</button>
              <button class="hb-btn primary" :disabled="cfg.saving || !cfgDirty" @click="cfgSave()">
                {{ cfg.saving ? '保存中…' : '保存并应用' }}
              </button>
            </span>
          </div>

          <!-- 就近说明浮窗: 面板(切角) + 箭头(独立元素, 否则会被面板的 clip-path 裁掉) -->
          <div class="hb-pop hb-cut" :class="{ on: !!hub.help }" ref="hubPop" role="dialog" aria-label="配置项说明"
               :style="{ left: hub.pop.left + 'px', top: hub.pop.top + 'px' }">
            <template v-if="hub.help">
              <div class="hb-pop-hd">
                <h2>{{ hub.help.t }}<span class="pk">{{ hub.help.k }}</span></h2>
                <button class="pop-x" aria-label="关闭" @click="hubCloseHelp()">✕</button>
              </div>
              <div v-if="hub.help.tags.length" class="hb-pop-tags">
                <span v-for="t in hub.help.tags" :key="t" class="hb-badge on">{{ t }}</span>
              </div>
              <div class="hb-pop-sec"><h3>它是什么</h3><p>{{ hub.help.what }}</p></div>
              <div class="hb-pop-sec"><h3>默认值</h3><div class="hb-pop-val">{{ hub.help.def }}</div></div>
              <div v-if="hub.help.when.length" class="hb-pop-sec">
                <h3>什么时候需要改</h3>
                <ul><li v-for="(w, i) in hub.help.when" :key="i">{{ w }}</li></ul>
              </div>
              <div v-if="hub.help.risk" class="hb-pop-sec">
                <h3>注意</h3>
                <div class="hb-pop-risk"><b>风险 · </b>{{ hub.help.risk }}</div>
              </div>
              <div v-if="hub.help.rel.length" class="hb-pop-sec">
                <h3>容易和它搞混的</h3>
                <div class="hb-pop-rel">
                  <span v-for="(r, i) in hub.help.rel" :key="i">{{ r[0] }}<i>{{ r[1] }}</i></span>
                </div>
              </div>
            </template>
          </div>
          <div class="hb-pop-arrow" :class="{ on: !!hub.help, left: hub.arrow.place === 'left', right: hub.arrow.place === 'right' }"
               ref="hubArrow" :style="{ left: hub.arrow.left + 'px', top: hub.arrow.top + 'px' }"></div>
        </template>
      </main>

    </template>
