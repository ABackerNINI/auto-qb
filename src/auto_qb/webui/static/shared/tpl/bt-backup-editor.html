<!-- 「BT_backup 目录」单路径编辑器 + 自动探测(计划 26-11-11-0259 S4 重写, 读法2: 按钮是探测
     唯一入口): x-template 注入 body(transfer-targets.html 同范式) —— 本文件**只贡献模板**,
     数据与动作一律经 $root 回调根实例(方法域在 shared/bt_backup_editor.js 的 bb* 系列);
     组件里再写一份会触发 _scan_mixin_wiring 重名守阵。
     挂载点: settings-detail.html 通用分区分支的 config.relocate 块内(D3: bt_backup 是 fastresume
     收尾的依赖配置, 与「整组迁移」同块呈现; schema relocate.bt_backup 打 hidden(S4, 组件接管
     渲染, 与 web.transfer/ctx_menu 同款) —— 通用编辑树不渲染, 不然同键双输入框)。
     树形状与写回口径(标量 ["config","relocate","bt_backup"] / 留空 = 写空串 = 未启用, 与 S1
     校验一致)见 bt_backup_editor.js 头注释。路径合法性不在前端做平行实现: 由后端
     validate_config 聚合 400 拦下, 报错经 cfg.saveError(config_editor.js)在输入框下方原样展开
     (多行 pre-wrap)。五态证据区的判定全在后端(probe.verdict 单点), 前端只渲染不重判 ——
     文案对照表 BB_VERDICT_TEXT 在 JS 单点; 探测结果只回填草稿, 保存才落盘。 -->
<script type="text/x-template" id="tpl-aq-bt-backup-editor">
  <div class="bt-bk">
    <div class="bt-bk-row">
      <input class="hb-input hb-mono" :value="$root.bbValue" placeholder="留空 = 未启用, 可点自动探测"
             title="qB 的 BT_backup 目录本机路径; 留空 = fastresume 收尾未启用"
             @input="$root.bbSet($event.target.value)">
      <span class="bt-bk-acts">
        <button class="hb-btn sm" :disabled="$root.bbProbe.running" @click="$root.bbProbeRun()">
          {{ $root.bbProbe.running ? "探测中…" : "自动探测" }}</button>
      </span>
    </div>

    <p v-if="$root.cfg.saveError" class="bt-bk-saveerr">{{ $root.cfg.saveError }}</p>

    <div v-if="$root.bbProbe.error" class="bt-bk-ev">
      <p class="bt-bk-verdict bad">探测失败: {{ $root.bbProbe.error }}</p>
    </div>

    <div v-if="$root.bbProbe.result" class="bt-bk-ev">
      <p class="bt-bk-verdict" :class="$root.bbVerdictCls()">{{ $root.bbVerdictText() }}</p>
      <p class="bt-bk-note">{{ $root.bbProbe.result.reason }}</p>
      <p v-if="$root.bbProbe.result.verdict === 'hit' && !$root.bbProbe.filled" class="bt-bk-note">
        输入框已有草稿值, 探测结果未覆盖 —— 如需采用请先清空再探。</p>
      <p v-if="$root.bbProbe.result.online === false" class="bt-bk-offline">qB 离线: hash 自证未参与, 以上结果未自证</p>
      <p v-if="$root.bbStorageText()" class="bt-bk-meta">qB 恢复数据存储: {{ $root.bbStorageText() }}</p>

      <div v-if="$root.bbProbe.result.candidates && $root.bbProbe.result.candidates.length" class="bt-bk-cands">
        <div v-for="(c, i) in $root.bbProbe.result.candidates" :key="i" class="bt-bk-cand">
          <div class="bt-bk-cand-hd">
            <span class="bt-bk-cand-path">{{ c.path }}</span>
            <span class="bt-bk-tag">{{ $root.bbOriginText(c.origin) }}</span>
            <span v-if="c.qualified" class="bt-bk-tag ok">合格</span>
            <span v-else class="bt-bk-tag">不合格</span>
            <span v-if="c.hash_matched" class="bt-bk-tag ok">hash 自证命中</span>
          </div>
          <p class="bt-bk-cand-note">{{ c.qualification_reason }}</p>
        </div>
      </div>

      <ul v-if="$root.bbNotes().length" class="bt-bk-notes">
        <li v-for="(n, i) in $root.bbNotes()" :key="i">{{ n }}</li>
      </ul>
    </div>

    <p class="ctx-custom-note">
      路径与其它配置项一起保存(右上角「保存并应用」), 非法值会被后端整体拒下并在上方列出全部问题;
      留空 = fastresume 收尾未启用。探测只回填草稿, 保存才落盘; qB 与本程序不同文件系统(远程/容器)
      时探测恒落空, 须手写路径。
    </p>
  </div>
</script>
