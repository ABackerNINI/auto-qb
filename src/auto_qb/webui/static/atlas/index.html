  <div id="app" v-cloak>
    <!-- 密钥输入(未授权时): 遮罩仅由 authRequired 把守, 验证通过前主界面 DOM 不渲染(防错误密钥闪现)。
         本地已有密钥时验证过程显示"验证中"加载态而非输入表单(修复刷新时闪现输入密钥界面) -->
    <div v-if="authRequired" class="login-mask">
      <div v-if="bootstrapping" class="login-card login-loading">
        <div class="brand">
          <span class="brand-mark"><img class="brand-img" src="/shared/icon.png" alt=""></span>
          <span>auto-qb</span>
        </div>
        <svg class="ico spin" viewBox="0 0 16 16"><use href="#i-orbit"></use></svg>
        <p class="muted">正在验证本地密钥…</p>
      </div>
      <form v-else class="login-card" @submit.prevent="saveToken">
        <div class="brand">
          <span class="brand-mark"><img class="brand-img" src="/shared/icon.png" alt=""></span>
          <span>auto-qb</span>
        </div>
        <p class="muted">请输入 WEB 访问密钥(见启动日志或 data_dir/web.token)</p>
        <input v-model="tokenInput" type="password" placeholder="访问密钥" autocomplete="current-password" required>
        <button type="submit" class="bt primary" :disabled="!tokenInput.trim() || authPending">{{ authPending ? '验证中…' : '进入' }}</button>
        <button v-if="authErrorKind === 'unavailable'" type="button" class="bt ghost"
                @click="retryAuth" :disabled="authPending">重试连接</button>
        <p v-if="authError" class="error">{{ authError }}</p>
      </form>
    </div>

  </div>
