    <!-- 限速浮层(SPD-04; FX-08 就近弹出) —— 星图此前只有入口按钮、没有浮层(点了没反应), 本次一并补齐。
         无遮罩; 必须是状态栏的兄弟节点(.statusbar 有 overflow: hidden, 嵌在里面会被裁掉)。 -->
    <div v-if="speedOpen" ref="speedPop" class="speed-pop" :style="speedPopStyle()"
         role="dialog" aria-label="限速" @click.stop>
      <div class="modal-title">
        <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-gauge"></use></svg>
        <span>限速</span>
        <button class="bt icon add-dialog-x" title="关闭" @click="closeSpeedDialog">
          <svg class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="add-dialog-body">
        <div class="speed-mode-line" :title="speedMode.error || speedModeLine">
          <svg class="ico ico-sm" viewBox="0 0 16 16"><use :href="speedMode.curveEnabled ? '#i-gauge' : '#i-lock'"></use></svg>
          <span>{{ speedMode.loaded ? speedModeLine : (speedMode.error || "正在加载状态…") }}</span>
        </div>
        <div class="speed-dialog-grid">
          <label class="modal-field">
            <span class="modal-field-label">上行 KiB/s</span>
            <input id="sp-up" v-model="speedOverride.up" type="number" min="0" inputmode="numeric" placeholder="0 = 不限">
          </label>
          <label class="modal-field">
            <span class="modal-field-label">下行 KiB/s</span>
            <input id="sp-down" v-model="speedOverride.down" type="number" min="0" inputmode="numeric" placeholder="0 = 不限">
          </label>
        </div>
        <p v-if="speedMode.curveEnabled" class="add-dialog-hint">曲线启用中: 覆盖为临时, 下一档位切换时恢复</p>
        <p v-else class="add-dialog-hint">两方向都需填写 · 0 = 不限速</p>
      </div>
      <div class="modal-actions">
        <button class="bt ghost" @click="closeSpeedDialog">取消</button>
        <button class="bt primary" :disabled="!speedOvReady || speedOverride.busy"
                title="临时覆盖 qB 全局限速(两方向都需填写, 0 = 不限)" @click="submitSpeedDialog">
          <svg v-if="speedOverride.busy" class="ico ico-sm spin" viewBox="0 0 16 16"><use href="#i-refresh"></use></svg>
          <svg v-else class="ico ico-sm" viewBox="0 0 16 16"><use href="#i-bolt"></use></svg>
          {{ speedOverride.busy ? '提交中…' : '应用' }}
        </button>
      </div>
    </div>

    <!-- 提示条与站内确认框: 全局单例(替代 alert/confirm/prompt, 视觉与主题一致) -->
    <div class="toast-wrap">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.kind">
        <svg class="ico ico-sm" :class="{ spin: t.kind === 'busy' }" viewBox="0 0 16 16">
          <use :href="{ ok: '#i-check', error: '#i-warn', busy: '#i-refresh', timeout: '#i-clock' }[t.kind] || '#i-info'"></use>
        </svg>
        <span>{{ t.text }}</span>
      </div>
    </div>
