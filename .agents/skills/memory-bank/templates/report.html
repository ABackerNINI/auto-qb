<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>@@TITLE@@</title>
<meta name="doc-type" content="report">
<meta name="doc-topic" content="@@TOPIC@@">
<meta name="doc-status" content="Done">
<meta name="doc-added" content="@@STAMP@@">
<meta name="doc-updated" content="@@STAMP@@">
<meta name="doc-refs" content="">
<style>
  :root {
    --bg: #10151a;
    --ink: #e4eaef;
    --dim: #a2b0bd;
    --faint: #6f7d8a;
    --hair: #26313a;
    --hair-soft: #1c252d;
    --accent: #6db3c9;
    --accent-ink: #8fd0e0;
    --warn: #e2a86e;
    --ok: #8fc98f;
    --no: #d98a8a;
    --code-bg: #151d25;
    --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --display: "Bahnschrift", "Segoe UI", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); color-scheme: dark; font-family: var(--sans); font-size: 15px; line-height: 1.65; margin: 0; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2c3944; border-radius: 5px; }
  /* 版面自适应: sheet 随视口流动 (封顶 1280px), 侧距 clamp(18~44px) 随宽度伸缩;
     正文与表格同宽 —— 右缘不再参差 (2026-10-17 用户反馈「宽度不统一不协调」) */
  .sheet { max-width: 1280px; margin: 0 auto; padding: 48px clamp(18px, 3.2vw, 44px) 80px; }

  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  h1 { font-family: var(--display); font-size: 33px; line-height: 1.18; letter-spacing: -0.01em; font-weight: 600; margin: 10px 0 6px; }
  .lede { color: var(--dim); font-size: 16px; margin: 0 0 22px; }
  .meta { font-family: var(--mono); font-size: 11.5px; color: var(--faint); line-height: 1.9; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 10px 0; margin-bottom: 40px; }
  .meta b { color: var(--dim); font-weight: 400; }

  h2 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.005em; margin: 52px 0 4px; padding-top: 18px; border-top: 1px solid var(--hair); }
  h2 .no { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); letter-spacing: 0.08em; display: block; margin-bottom: 6px; font-weight: 400; }
  h3 { font-family: var(--display); font-size: 16.5px; font-weight: 600; margin: 28px 0 6px; }
  h4 { font-family: var(--display); font-size: 14.5px; font-weight: 600; margin: 20px 0 4px; color: var(--dim); }
  p { margin: 10px 0; }
  ul, ol { margin: 8px 0; padding-left: 22px; }
  li { margin: 4px 0; }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; color: var(--accent-ink); }
  pre { background: var(--code-bg); border: 1px solid var(--hair-soft); padding: 13px 16px; overflow-x: auto; margin: 12px 0; }
  pre code { background: none; padding: 0; color: var(--ink); font-size: 12.5px; line-height: 1.6; }
  .cm { color: var(--faint); }

  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11.5px; letter-spacing: 0.08em; padding: 6px 10px; border-bottom: 1px solid var(--hair); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--hair-soft); vertical-align: top; }
  td code, th code { white-space: nowrap; }
  /* 窄视口 (<=1180px): 表格单元格内的长路径允许断行, 换取表格不溢出页面; 宽屏不受影响 */
  @media (max-width: 1180px) { td code, th code { white-space: normal; overflow-wrap: anywhere; } }
  .good { color: var(--ok); }
  .bad { color: var(--no); }
  .wr { color: var(--warn); }
  .aside { border-left: 2px solid var(--hair); padding: 2px 0 2px 14px; color: var(--dim); margin: 14px 0; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="sheet">

<div class="kicker">REPORT · memory-bank · doc-topic: @@TOPIC@@</div>
<h1>@@TITLE@@</h1>
<p class="lede"><!-- SLOT: 导语(lede): 一句话说清结论是什么、证据是哪一次 --></p>
<div class="meta">
  <b>doc-added</b> @@STAMP@@ · <b>doc-updated</b> @@STAMP@@ · <b>doc-status</b> Done · <b>载体</b> 单文件 HTML(dark)<br>
  <b>来源</b> <!-- SLOT: 来源: 触发这轮取证/审计/分析的事件或问题 -->
</div>

<h2><span class="no">§01</span>结论</h2>
<!-- SLOT: 结论: 审计/取证/可行性分析的结论先行; 有取舍的记决策依据 -->

<h2><span class="no">§02</span>证据快照</h2>
<!-- SLOT: 证据快照: 关键数据/日志/现象 (能引就引原文与行号; 快照 = 当时现场, 后续不改) -->

<h2><span class="no">§03</span>方法与局限</h2>
<!-- SLOT: 方法与局限: 怎么测的/边界条件/未覆盖的部分 -->

</div>
</body>
</html>
