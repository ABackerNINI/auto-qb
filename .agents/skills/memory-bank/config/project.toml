# memory-bank skill 的项目绑定配置 (统一落点 <skill>/config/project.toml, 计划 26-11-17-0010 S1/D12)。
# 口径: 项目词汇与项目路径全部外置到这里, 代码只读配置 —— 换项目/改枚举只改本文件, 不触 scripts/*.py;
# 节缺失或值为空 → 脚本宽容回落 (跳过对应校验 + 必打提示行, 禁静默降级, D13)。

[domains]
# 任务档案领域枚举 (文件名首段; `kb.new task --topic <领域>-<专题>` 按**最长前缀**匹配, 枚举项可含短横线)。
# 不足用先扩枚举再建档 (口径见 SKILL.md「任务档案规范」); 改这里即生效, 不触代码。
values = ["webui", "backend", "rule", "memory-bank", "docs", "test", "deps", "config", "dev"]

[siblings]
# 跨 clone 档案查重的兄弟工作区目录名**显式列表** (只读 ls 各自的 memory-bank/tasks/, 忽略日期前缀
# 按 slug 比对; 自身 clone 自动排除)。每项相对本仓库根的 parent 目录解析 (与旧 glob `../auto-qb-*`
# 同锚点); 空列表 = 单 clone, 不查跨 clone。列出即生效, 不再按名字模式扫 parent 目录。
tasks_dirs = ["auto-qb-zcode-clone2", "auto-qb-zcode-clone3"]

[nav]
# kb.nav 的项目绑定面 (计划 26-11-17-0010 S11 批9b 外置, S1 同款模式)。
# repo_deny: 仓库根下这些**首段**不进导航 (红线排除表, 判据 nav_data._denied; 越界面独立拒绝)。
#   本仓实例 = 旧 REPO_DENY 原样搬家 (config.yml 是真生产配置, auto-qb-data/ 是运行数据,
#   见 pitfalls/ops/prod-files.md); 缺失回落通用默认 (.git/.env) + 必打提示 (D13/R-7)。
repo_deny = ["config.yml", "auto-qb-data", ".git", ".env"]
# remotes: 主线远端候选序 (kb.nav 顶栏「拉取」按序取第一个存在的远端, 与 my-commit-flow
#   main_candidates 同构)。本仓实例 = Gitee 优先 (历史 clone 的 origin 可能是 GitHub 镜像);
#   缺失回落单远端通用 ("origin",) + 必打提示 (D13/R-7)。空列表 = 不按候选序挑, 直接取第一个。
remotes = ["gitee", "origin", "github"]
