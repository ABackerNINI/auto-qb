[pytest]
pythonpath = src
testpaths = tests
# -n 8: 并行跑(2026-10-08 由 -n 4 上调: 2772 个用例 -n 4 43.8s → -n 8 26.6s)。
#   需要 dev 依赖 pytest-xdist。
#   ⚠ 甜点是**随用例体量与负载形态变的**: `tests/` 以 CPU 轻量单测为主, `-n 8` 更好;
#     `.commands/` 那批**真实 git 子进程**场景用例是 IO 密集, 同样 -n 8(见 .commands/test/config.toml);
#     但 `-n auto`(32 worker)会把机器打满致夹具超时 —— **别用 auto**。
#   想串行排查时加 `-n 0`(如 `uv run pytest tests/test_web.py -q -n 0`)——
#   单文件跑用并行反而慢在 worker 启动上。
#   ⚠ sidefx 台账在并行下靠 conftest 的 workeroutput 回传汇总, 见 tests/conftest.py;
#     覆盖率与串行差 1 个单位, 换并行时要重刷基线 —— 见 memory-bank/pitfalls/testing/parallel-run.md。
addopts = -n 8 --cov=src --cov-report=term-missing --cov-branch --cov-fail-under=98
# 第三方互操作的弃用警告: 零信息, 每次全量/快测都在结论区后刷 4-6 行明细(W2, 计划 26-09-28-0157 §10)。
# 精确按消息前缀匹配 —— 不整体关 DeprecationWarning/UserWarning, 自家与依赖升级的真信号不被掩盖。
# ⚠ starlette 的那条类别是 UserWarning 子类(StarletteDeprecationWarning), 按类别匹配会落空 —— 只认消息前缀。
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:
    ignore:The anyio.abc.BlockingPortal alias is deprecated:
