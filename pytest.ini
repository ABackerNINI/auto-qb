[pytest]
pythonpath = src
testpaths = tests
# -n 4: 并行跑(全量 19.4s → 5.0s)。需要 dev 依赖 pytest-xdist。
#   想串行排查时加 `-n 0`(如 `uv run pytest tests/test_web.py -q -n 0`)——
#   单文件跑用并行反而慢在 worker 启动上。
#   ⚠ sidefx 台账在并行下靠 conftest 的 workeroutput 回传汇总, 见 tests/conftest.py;
#     覆盖率与串行差 1 个单位, 换并行时要重刷基线 —— 见 memory-bank/pitfalls/testing/parallel-run.md。
addopts = -n 4 --cov=src --cov-report=term-missing --cov-branch
