[pack]
name      = "doc"
when      = "文档机检：坏链 / 注入上限 / 命令漂移"
confirmed = true

[tasks."doc.links"]
run     = ["python <skill-dir:memory-bank>/scripts/check_doc_links.py --quiet"]
timeout = 180
when    = "改名 / 搬家后查相对链接坏没坏"
note    = "坏链不会让任何用例失败，只能机检；--quiet 只报问题。脚本 2026-10-06 从根 scripts/ 迁入 memory-bank skill（随 skill 移植）"

[tasks."doc.caps"]
run     = ["python scripts/check_context_caps.py <args>"]
timeout = 120
when    = "查上下文字符上限与 cap 债务(提交闸门每次都跑默认模式); 清理会话用 --strict 收口"
note    = "2026-09-30 债务制: 只有 AGENTS.md 是硬规定(超 8000 注入时尾部被静默截断, 超限即拦、不挂账); 其余尺寸超限是**债务** —— 默认只报告不拦提交, 输出自带「提醒用户另开新会话清理」指令。<args> 可传 --strict(债务非空即 rc=1, 只许用在清理会话收口, 闸门只用默认模式) / --quiet"

[tasks."doc.drift"]
run     = ["python scripts/check_command_drift.py <args>"]
timeout = 180
when    = "文档里有没有人（含 agent）手抄了已收录的命令"
note    = "命令只应在包里定义一份；文档里要写就写 task id。<args> 可传 --list 看正在盯的命令骨架"
