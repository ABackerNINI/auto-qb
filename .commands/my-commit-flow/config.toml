[pack]
name        = "my-commit-flow"
when        = "git 协作：开工同步 / 提交 / 推送"
origin      = "my-commit-flow"  # 从 skill 降为包，名字不变
version     = "2.0.0"
confirmed   = true
scripts_dir = "scripts"

# 子包由**上级注册**（路径 <父>/<名>/config.toml），启用状态只在这里声明一处。
# 包是黑盒：本包自己的 `.my-commit-flow.toml`（闸门 / 红线 / 远端）引擎不读、不知道它存在，
# 由包内脚本自读 —— 引擎里连"提交"这件事都不认识。
[packs.ship]
enabled = true

# v3 输出契约(计划 26-09-28-0157): 成功一行, 失败一行(原因 + 下一步); 检查项内联进 ship 编排。
# v2 的独立 preflight 任务已移除(闸门引擎收编进 _pipeline.py, 由 ship.commit 内部调用)。

[tasks."my-commit-flow.sync"]
script = "sync.py"
pin    = true
when   = "会话开工：第一个执行动作（改文件 / 跑校验 / 任何 git 写操作）之前；以及收到「提交」后的第一步（收尾回写之前）。自动 fetch + 快进/rebase(分叉保线性)"
note   = "成功一行: 已同步/同步成功 <hash>(生成物冲突自动化解时附「自动重跑生成物 N 处」); 失败一行含原因与步骤(冲突已自动回滚); 结果贴进回复"
doc    = "references/pipeline.md"

[tasks."my-commit-flow.verify-ref"]
script = "verify_ref.py"
when   = "排障：核对 ref 三处一致（HEAD / refs/heads / packed-refs）—— ship.commit 已内置静默核对"
note   = "通过一行; 不一致给处置步骤"
doc    = "references/pipeline.md"
