[pack]
name      = "ship"
when      = "提交与推送（闸门 / 暂存 / 核 ref / 推主线）"
confirmed = true

# 本包没有 scripts_dir → 继承父包的 `.commands/my-commit-flow/scripts`。
# 触发口径（不变）：用户显式说"提交 / 入库 / 推上去"这类词才算；
# "继续 / 接着做 / ok / 你看着办"一律不算。

[tasks."ship.commit"]
script = "commit.py"
pin    = true
risky  = true
when   = "用户显式说「提交」：暂存 + 提交 + 核 ref + 自动续推（落后未合流会被内含预检 STOP —— 先按「同步路径」合并远端再回来）"
note   = "零参数缺省 = 全量提交本次改动(红线照拦) + 核 ref + 自动续推(--no-push 只提交); 消息缺省读 <root>/.git/COMMIT_MSG_AI.txt, 提交落稳后脚本自动删除(消费即删, 下次提交前必须重写); RESULT: PARTIAL=已提交未推送, 补跑 ship.push; 拒 -A / . / *"
doc    = "references/pipeline.md"

[tasks."ship.push"]
script = "push.py"
risky  = true
when   = "补推 / 单独推送（ship.commit 已默认续推; 本条用于推送未完成后补推, 或远端无法核实的重验）→ 核对远端 ref → 尝试一次镜像"
note   = "镜像失败只报一次：不重试 / 不换代理 / 不改走 SSH / 不回滚主线"
doc    = "references/pipeline.md"
