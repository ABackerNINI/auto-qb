# 提交流水线配置(my-commit-flow) —— 已逐项人工确认(初稿由 preflight.py --init 生成)
# 生效值与来源: python <skill-dir>/scripts/preflight.py --show-config

confirmed = true

branch = ""                       # 留空 = 跟当前分支
# 2026-10-08 起: origin 存在即主线, 镜像由主线主机决定(主机 ≠ 主线主机的第一个远端) ——
# 下面四个键只在**没有 origin** 的仓库里兜底(旧逻辑, 行为不变); 判据单点在 _ship_config.py。
main_candidates = ["gitee", "origin", "github"]
main_host_mark  = "gitee.com"     # 按 URL 特征挑主线(历史 clone 的 origin 可能是 GitHub 镜像)
mirror          = "github"
mirror_host_mark = "github.com"

# 决策点指针: 预检在检查表末尾打印它 —— 把「改代码 / 跑 git 前该读哪份陷阱索引」
# 摆到提交那一刻眼前(库里的约束不接到决策点上就等于没写)。留空 = 不打印。
pitfalls_index = "memory-bank/pitfalls/git/_index.md"

# 出现即 STOP: 生产配置 / 运行时数据(见 AGENTS.md 红线节)
red_lines = ["config.yml", "auto-qb-data/"]
# 出现需人工确认: 用户自己的在途改动 / 不该入库的项目数据
warn_lines = ["想法.md", ".workbuddy-ai/"]

platform_hints = ["winreg", "dir_fd", "socket", "subprocess"]
staged_panic = 200
each_limit = 99                 # <each:GLOB> 的展开条数上限(超了说明提交范围该拆)

# ---------------------------------------------------------------------------
# 生成物冲突自动化解(计划 memory-bank/plans/26-10-03-1544):
# 同步时若冲突 / 重叠**全部**落在可重跑的生成物上, 自动「任取一侧 + 重跑生成器 + 自证」,
# 无需人工; 只要有一个手写文件参与, 行为与不配这三个键时逐字一致(该失败就失败)。
# ⚠ 三个键必须同时加进 _ship_config.KEY_DEFAULTS, 否则会被按「顶层未知键」STOP。
# ---------------------------------------------------------------------------
auto_resolve_generated = true
# 白名单来源: 打印生成器负责的全部路径(一行一个, 仓库相对)。
# ⚠ **列错 = 静默丢内容**: 多一个其实不是生成物的路径, 冲突时就会把它当生成物丢弃(自证也救不回);
#   少一个则该冲突化解不了。唯一权威来源是生成器自己的 `--list`(集合单点 gen_all.py)。
generated_list_cmd  = "python <skill-dir:memory-bank>/scripts/gen_all.py --list"
# 重跑命令(自证 = 同一命令加 `--check`); 两步都走现成的 <skill-dir:NAME> 占位符解析。
generated_regen_cmd = "python <skill-dir:memory-bank>/scripts/gen_all.py"

# ---------------------------------------------------------------------------
# 闸门: auto = true → 预检**真的执行**它(红了即 STOP, 退出码 1); 不标/标 false → 只打印。
# 命令里的占位符由预检展开, 展开不了即 STOP(不降级成打印 —— 那会让人以为跑过了):
#   <root>            仓库根绝对路径
#   <skill-dir:NAME>  skill 目录(项目级 → 用户级)
#   <changed:GLOB>    本次改动里匹配的文件 → 拼成一条命令
#   <each:GLOB>       按匹配文件把这条 run 复制成多条命令(条数上限 each_limit)
#   <each:GLOB|--with-safety>  同上, 但先问每个脚本的 `--safety` 探针, 把「无参即真动作」
#                     的脚本摘出去(如 --help 会真的同步 / 推送的 sync.py / push.py)
# 未知键 / timeout 非法 → STOP: 闸门很贵, 拼错键让它静默失效比报错坏得多。
# ---------------------------------------------------------------------------

[[gates]]
match = ["src/", "tests/"]
# ❗不在这里抄命令 —— 走 `commands` 引擎的 `dev.fmt`(yapf 只在包里定义一处)。
#   改动清单由预检算(它才是"本次改了哪些文件"的权威), 经 `<changed:>` 展开后当 `<args>` 传给 task。
# ⚠ 2026-10-08: yapf 的语法缓存目录 `%LOCALAPPDATA%\Google\YAPF\Cache` 不在 agent 沙箱白名单里
#   —— 每次跑都会刷一批被拒的临时 pickle(判据见 memory-bank/pitfalls/testing/sandbox-tool-cache.md)。
#   实测**多数时候仍能在 <1s 内正常跑完**, 但当天确实观察到过挂死(100% 单核 + 持续写磁盘):
#   故 timeout 收到 60s, 且引擎超时点会**杀整棵进程树**(不再是留孤儿继续烧)。
#   彻底消除: 把该缓存目录加进沙箱白名单(Settings -> Permission & Approval)。
run   = ["python <skill-dir:commands>/scripts/run.py run dev.fmt -- <changed:*.py>"]
auto  = true
timeout = 60
note  = "格式化: 只碰本次改过的 py 文件(经 commands 引擎调 dev.fmt); timeout 60s 是给 yapf 沙箱缓存问题兜底"

[[gates]]
match = ["src/", "tests/"]
# ❗不在这里抄命令 —— 走 `commands` 引擎的 `test.quick`。命令只有一处定义(在 `.commands/test/`),
#   抄一份到这里就是第 N+1 处副本, 而"哪份才是生效的那份"不写在命令旁边(见 commands SKILL.md 初衷)。
#   TMPDIR / cmd.exe 写法 / 引号这些陷阱跟着 task 走, 由包自持, 这里看不见也不需要看见。
run   = ["python <skill-dir:commands>/scripts/run.py run test.quick"]
auto  = true
timeout = 900
note  = "全量测试(跳覆盖率报表): 经 commands 引擎跑 test.quick, 红了即 STOP"

[[gates]]
# ❗这些脚本测试**不在 pytest 的 testpaths(tests/) 里** —— 不挂这条就永远没人跑,
#   等于"改了包却没有任何机检消费"(实测: 一条与 rebase 禁令相撞的旧文案在包里躺了很久)。
# 2026-11-01 起按包收窄(计划 26-11-01-0434 方案 C): 一条拆两条 —— 改包文件由 test.pkg.scoped
# 按 <changed:> 归并受影响包, 单包只跑该包、≥2 包保守整跑(D4); 引擎目录(.agents/skills/commands/)
# 改动走第二条 --full 整跑(引擎测试贴着引擎放, 改引擎永远全跑)。TMPDIR/写法配方单点仍在
# test 包(wrapper 内置), 这里不抄第二份。test.pkg 本体保留: 手工整跑 + scoped --full 的转调目标。
match = [".commands/", ".agents/skills/commands/"]
run   = ["python <skill-dir:commands>/scripts/run.py run test.pkg.scoped -- <changed:.commands/**>",
         "python <skill-dir:commands>/scripts/run.py run test.pkg.scoped --full -- <changed:.agents/skills/commands/**>"]
auto  = true
timeout = 300
note  = "包与引擎的脚本测试: 改哪个包跑哪个包(≥2 包/引擎改动保守整跑) —— test.pkg 本体保留给手工整跑与 scoped 的 --full 转调"

[[gates]]
match = ["memory-bank/"]
# 2026-10-11 补两条 (静默红根因, issue 26-10-11-1630): 原清单只有索引生成器 + timekit, 漏了
#   `gen_baseline_recent --check` 与 `check_wording --check` —— 二者都在 `kb.check` 的 run 列表里
#   (即"该跑的"), 却没进闸门, 于是"能判红却不在闸门里" = **静默红** (实测: 三份基线切片缺三行头
#   使 kb.check 第 4 条恒红, 提交照过)。覆盖面从此与 kb.check 对齐, 由
#   tests/test_memory_bank.py::test_commit_gate_covers_kb_check 钉住 (再漏即红)。
# 2026-11-08 重构: 三个制品索引生成器的 --check 移除 (本体与调用点已同批退役) ——
#   其生成物 (tasks/plans/reports/issues 的 _index.md 与 attachments/_archive.md) 已随低价值层
#   移除退役 (计划 26-11-08-1625 D4/D5); 索引生成只剩 gen_kb_index 一家 (pitfalls)。
run   = ["python <skill-dir:memory-bank>/scripts/gen_kb_index.py --check",
         "python <skill-dir:memory-bank>/scripts/gen_doc_map.py --check",
         "python <skill-dir:memory-bank>/scripts/gen_baseline_recent.py --check",
         "python <skill-dir:memory-bank>/scripts/check_wording.py --check",
         "python <skill-dir:memory-bank>/scripts/check_mutation_anchor.py --check",
         "python <skill-dir:memory-bank>/scripts/check_doc_templates.py --check",
         "python <skill-dir:memory-bank>/scripts/timekit.py --check --files <changed:memory-bank/**>",
         "python <skill-dir:memory-bank>/scripts/check_status_drift.py --check",
         "python <skill-dir:memory-bank>/scripts/check_html.py --check <changed:**/*.html>"]
auto  = true
timeout = 60
note  = "知识库索引 + 制品索引与专题视图 + 日期守卫 + 基线切片结构 + 回写措辞: 生成物与滚动面都必须自洽 (整目录一条闸门, 不再按子目录各配一条; 2026-11-08 起索引生成只剩 gen_kb_index/pitfalls 一家); timekit --check 拦未来日期 / 坏体例 (2026-10-06 加); gen_baseline_recent / check_wording (2026-10-11 加, 补齐 kb.check 覆盖面); check_doc_templates --check (2026-10-17 P1 加: 冻结线之后新建族文件的命名/头部/状态词表/无残留 SLOT, 存量豁免; 2026-10-31 修: plan/report 圈面改文件名 stamp 前缀, 堵「缺 doc-added 手写新件整件逃逸」洞, RM02-RM10 事故); check_mutation_anchor --check (2026-10-31 加: 常驻锚防流水, 台账/逐轮日志写回 = 红); check_status_drift --check (2026-10-31 加: 状态漂移守卫, progress 判据节反链 x Open / issue badge vs meta / status-unreadable 硬拦; 2026-11-08 重构 W5: progress 判据节反链档随 progress/ 目录退役删除)"

[[gates]]
# HTML 结构守卫(2026-11-01 两起实测事故: 闭合标签少 `>` 被分词器整段吞掉, 其后内容全嵌进未闭合
# 元素, 排版错乱且浏览器零报错)。L1+L2 零依赖常驻判据随上一条闸门全库跑(<2s); 本条是**规范级
# 增量面**: 本次改动的 HTML 才过 W3C v.Nu —— 改谁谁达标, 未触动的存量 320 条 error 不进闸门。
# vnu.jar 在 <root>/.tools/(gitignored, 缺时自动下载 ~32MB, 需 java); 无 HTML 改动时跳过。
# 2026-11-01 扩面: <changed:> 从 memory-bank/** 放开到全仓 —— memory-bank 外还有存量 HTML
# (skill 骨架样例等), 改谁都该达标; match 用子串 ".html"(真有 HTML 改动才命中闸门,
# 纯 md/py 提交不空跑, 无匹配仍走 <changed:> 的静默跳过语义)。
match = [".html"]
run   = ["python <skill-dir:memory-bank>/scripts/check_html.py --vnu --strict <changed:**/*.html>"]
auto  = true
timeout = 120
note  = "HTML 规范级增量检查(v.Nu): 全仓改动 HTML 都查(2026-11-01 起不限 memory-bank); 有 error 即 STOP; 修复后重跑, 或 commands run kb.html-audit 看全库报告"

[[gates]]
match = ["memory-bank/active-context/"]
run   = ["python <skill-dir:memory-bank>/scripts/gen_active_recent.py --check"]
auto  = true
timeout = 60
note  = "会话切片: 命名定宽前缀 / 三行头 / cap —— 该脚本只校验, 不写文件"

[[gates]]
match = ["memory-bank/", "docs/", "AGENTS.md"]
run   = ["python <skill-dir:memory-bank>/scripts/check_doc_links.py --quiet"]
auto  = true
timeout = 60
note  = "相对链接存在性: 改名 / 搬家后的坏链不会让任何测试失败, 只能机检 (2026-10-06 从根 scripts/ 迁入 memory-bank skill, 随 skill 移植)"

[[gates]]
# 两处都扫: `.agents/skills/`(仍是通用 skill 的家) 与 `.commands/`(包内脚本 ——
# my-commit-flow 的脚本就从前者迁到了后者)。
# ❗`|--with-safety`(2026-10-03 修): 冒烟只给脚本加 `--help`, 而 `--help` 未必被脚本认 ——
#   把陌生参数当无参处理时, 无参数=真动作的脚本会被**真跑一次**: `sync.py --help` 真的同步,
#   `push.py --help` 真的推送(推送顺序固定, 尤其禁止)。所以 --with-safety 让展开先问每个
#   脚本自己的 `--safety` 探针, 把「无参即真动作」的摘出去(摘掉会在输出里写明, 不是静默丢)。
#   ⚠ 这条闸门**不配 auto = true** 也能兜住 —— 展开是统一入口(run.py 与 commit 闸门共用)。
match = [".agents/skills/", ".commands/"]
run   = ["python <each:.agents/skills/**/scripts/*.py|--with-safety> --help",
         "python <each:.commands/**/scripts/*.py|--with-safety> --help"]
auto  = true
timeout = 300
note  = "脚本冒烟: 改了哪个跑哪个(<each:> 把一条 run 复制成多条); |--with-safety 摘掉「无参即真动作」脚本(否则 --help 会真的同步/推送)"

[[gates]]
# 评审留痕(2026-11-06, 计划/report 26-11-06-0723): 分批评审的强制面。
# 为什么 match 是空串(每次提交都跑): 触发条件不是"改了哪些文件", 而是**批内累计未评改动量** ——
#   锚点从 git 历史现算(最近一条带 Review:/Review-Skip: 的提交), 谁漏评谁的提交滚进下一批。
#   按路径匹配永远命中不了"这一笔含可评增量"这种事(下限已退役, 任何可评增量都需留痕)。
# ❗不在这里抄命令 —— 走 commands 引擎的 review.trace(单点定义在 .commands/review/config.toml)。
#   该 task 用裸 python 而非 uv run: 脚本纯 stdlib, 而 uv/console-script 在本仓有 trampoline 坏掉的先例
#   (pitfalls/ops/venv-trampoline-clone-copy.md), 提交闸门不能押在它上面。
match = [""]
run   = ["python <skill-dir:commands>/scripts/run.py run review.trace"]
auto  = true
timeout = 60
note  = "评审留痕: 可评内容 >0 行(代码+事实性文档)或触安全敏感面即需 `Review:` trailer(含 `· 基`); 新提交写 `Review-Skip:` 判红; 实算恒 0 且无 Review: trailer 才静默; 口径单点见 .commands/review/config.toml 的 review.trace note"

[[gates]]
# 空串 = 每次提交都命中 (hit 用 startswith/子串匹配, 空串匹配一切路径)。
# 为什么需要"每次"而不是只匹配 .agents/skills/: 从远端 pull 进来的 skill 改动在
# 本地不产生 diff (HEAD 已经跟着往前走了), 按路径匹配永远命中不了 —— 只能靠每次
# 提交跑一次幂等同步来兜, 接受的代价是"落后到下一次提交"(不值得为它给每个
# clone 手动配 core.hooksPath)。
match = [""]
run   = ["python scripts/sync_agent_skills.py"]
auto  = true
timeout = 60
note  = "skill 链接同步(幂等): 拉取来的改动靠每次提交兜一次"

[[gates]]
# 2026-09-30 起分两档 (cap 债务制, 计划 memory-bank/plans/26-09-30-2112):
#   · **AGENTS.md 是硬规定** —— 超 8000 字符注入时**尾部被静默截断**(写了也看不到),
#     所以超了且本次改动命中 → 仍 STOP(不套 50% 收缩、不进债务体系、没有挂账通道)。
#   · 其余一切尺寸(SKILL.md / 包内阅读预算 / KB 角色 cap)是**债务** —— 提交时派生输出,
#     只报告不拦; agent 读到输出后在回复里提醒用户另开会话清理。
# `memory-bank/` 也在 match 里: 债务是**编辑知识库时**欠下的, 只在改 AGENTS.md / skill 时跑
# 的话, 触发点等于没接线(G2 要求"提交时必然可见")。
# ❗闸门只用**默认模式**: `--strict` 是清理会话的收口开关(债务非空即 rc=1), 挂进闸门等于
#   把债务重新变成提交前置条件 —— 那正是本计划要取消的东西。
# 2026-11-01 起按改动收窄(计划 26-11-01-0434 方案 D, 拍板 D5): 一条拆三条, <changed:> 无匹配
# 即静默跳过; 硬规定语义不变(AGENTS.md 超限且改动命中仍 STOP); 债务只算本次改动的文件 ——
# 存量债务的可见性收敛到「该文件被改时 + 清理会话 doc.caps --strict」(滞后接受)。
match = ["AGENTS.md", ".agents/skills/", "memory-bank/"]
run   = ["python scripts/check_context_caps.py --files <changed:AGENTS.md>",
         "python scripts/check_context_caps.py --files <changed:.agents/skills/**>",
         "python scripts/check_context_caps.py --files <changed:memory-bank/**>"]
auto  = true
timeout = 60
note  = "上下文字符上限: AGENTS.md 超限且改动命中即拦(硬规定, 语义不变); SKILL/阅读预算/KB 角色 cap 债务只算本次改动的文件(2026-11-01 方案 D 收窄) —— 输出含「提醒用户另开新会话清理」, 不拦提交"

[[gates]]
# 空串 = 每次提交都跑: 手抄可能出现在**任何**文档里, 按路径匹配必然漏。
# 这条是整套 commands 设计的成败点 —— 没有它, 包里的单点定义会被文档里的副本慢慢架空,
# 最后退化成"第 N+1 处副本"。
# 2026-11-01 起按改动收窄(计划 26-11-01-0434 方案 A): 一条拆三条, 各自 <changed:> 无匹配即
# 整条静默跳过 —— 纯代码提交三条全跳; 改 md 只扫改动文件; 注册表(.commands/*/config.toml)
# 或引擎骨架提取逻辑(.agents/skills/commands/scripts/)变了才全量(旧副本可能在新判据下漂移)。
# 改动清单单点仍是预检 —— 脚本不自查 git(复跑阶段树已净, 自查语义就错)。
match = [""]
run   = ["python scripts/check_command_drift.py --files <changed:*.md>",
         "python scripts/check_command_drift.py --full <changed:.commands/**/config.toml>",
         "python scripts/check_command_drift.py --full <changed:.agents/skills/commands/scripts/*.py>"]
auto  = true
timeout = 180
note  = "命令漂移: 改动的 md 只扫改动文件(逐个仍过 SCAN_GLOBS/EXEMPT); 注册表/引擎骨架逻辑变了 → 全量扫; 文档里手抄已收录的命令 → 判红(必须写成 commands run <task>)"
