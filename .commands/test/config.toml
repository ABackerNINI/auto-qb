[pack]
name      = "test"
when      = "验证代码：全量 / 快速 / 单文件"
confirmed = true
scripts_dir = "scripts"

# ❗命令**必须自带 TMPDIR**：工具 shell 的 TMPDIR 默认是 `H:\Temp`，那个盘上符号链接读取被拒，
#   pytest 会在收尾的 `cleanup_dead_symlinks` 上抛 `PermissionError [WinError 5] … pytest-current`
#   —— 用例其实全过，只是退出码非 0 ⇒ **假红**（已实际踩到）。约定见 memory-bank/testing/tmpdir.md。
# ⚠ 写法是 **cmd.exe** 的：引擎用 `subprocess.run(shell=True)`，Windows 上解析到 COMSPEC → cmd.exe，
#   所以 POSIX 的 `TMPDIR=x cmd` 前缀**不生效**（实测 rc=1）。用 TOML **字面串**（单引号）写，
#   免得为内层双引号转义。
# ⚠ **引号不能省**：`set VAR=value && cmd` 会把 `&&` 前的空格并进 value —— 实测 TMPDIR 变成
#   `'R:/Temp/auto-qb/tests '`（带尾随空格）；`set "VAR=value" && cmd` 才是干净的。

[tasks."test.full"]
run     = ['set "TMPDIR=R:/Temp/auto-qb/tests" && uv run pytest tests -q']
timeout = 900
pin     = true
when    = "改完代码要验一遍（带覆盖率；提交闸门跑的是 test.quick）"
note    = "必须 cmd.exe 写法 + 引号不能省，理由见本文件顶部; silent_success: 成功只出结论行(TOTAL/passed), 覆盖率明细按需 show"
silent_success = true

[tasks."test.quick"]
run     = ['set "TMPDIR=R:/Temp/auto-qb/tests" && uv run pytest tests -q --no-cov']
timeout = 900
when    = "只要结论、不要覆盖率报表（快约 7s；提交闸门用这条）"
note    = "同上必须 cmd.exe 写法; silent_success: 成功只出结论行"
silent_success = true

[tasks."test.pkg"]
run     = ['set "TMPDIR=R:/Temp/auto-qb/tests" && uv run pytest .commands .agents/skills/commands -q --no-cov -n 4']
timeout = 300
when    = "改了 .commands/ 下的包脚本或 commands 引擎 —— 它们的测试不在 testpaths(tests/) 里, 全量测试收不到"
note    = "**-n 0 曾挂住, 已于 2026-10-03 修根因**(根因与修法见 memory-bank/pitfalls/testing/parallel-run.md): 原先串行在本机**挂住** —— my-commit-flow 的真实临时仓库用例跑到第 15 个后不再推进, 从而**卡死 ship.commit 的闸门**(闸门是这个 task 的调用方, 表现是提交无输出即中止)。根因**不是仓库逻辑**, 是 Windows 上 `subprocess.run(capture_output=True)` 高负载 + 大量 spawn 时无限挂死(CreateProcess 不返回 / 孙进程占管道写端); 已在 `_pipeline.run_capture` 加看门狗(硬截止 + `taskkill /F /T` 杀整棵树), 修复后 `-n 0` 跑三个包脚本用例 79 passed / 275s 不再挂。**本 task 仍保持 -n 4**(闸门要快且能收口, 96 passed / ~105s)。收集面含 .agents/skills/commands(引擎测试贴着引擎放, 2026-09-27 起)。2026-09-28 起也要 TMPDIR 前缀: 上述场景测试用 tmp_path 夹具会建 pytest 临时目录(原『不建临时目录』的说法随 v3 场景测试过时)。silent_success: 成功只出结论行"
silent_success = true

[tasks."test.one"]
run     = ['set "TMPDIR=R:/Temp/auto-qb/tests" && uv run pytest <args> -q -n 0 --no-cov']
timeout = 900
when    = "排查单个文件 / 用 -k 筛一组用例"
note    = "<args> 填文件路径或 -k 表达式；单文件用 -n 0（并行会慢在 worker 启动上）。**内置 --no-cov**（2026-10-05, issue 26-10-05-0922-chore-pytest-cov-gate-test-one）: pytest.ini addopts 的 --cov-fail-under=98 是对**全量收集面**设的闸, 单文件/筛选收集面小 ⇒ 覆盖率必然远低于门槛, 会把「用例全绿」打成覆盖率 FAIL（假红, 实测 11 passed + Total 18.52%）；覆盖率闸只归 test.full（及 CI 全量跑）, 要覆盖率报表用 test.full。详见 memory-bank/pitfalls/testing/single-file-coverage-gate.md"

[tasks."test.keys-update"]
run     = ["uv run python scripts/update_config_key_surface.py"]
when    = "键面守卫(test_config_key_surface)报基线过期后重写 tests/fixtures/config_key_surface.txt"
note    = "消失键且版本未抬时脚本拒绝重生成(先抬 CURRENT_VERSIONS + 注册迁移再跑); 生成器单点在测试模块, 不要复制展开逻辑"

[tasks."test.linux"]
script  = "linux_ci.py"
timeout = 900
when    = "本机复现 Linux CI(平台差异排查): 起容器跑全量, 与 Windows 侧对照 —— 改了平台相关代码/测试后必跑"
note    = "用脚本而不是一行 run: 命令里全是 && / ; / | 与多层引号, 引擎在 Windows 上走 cmd.exe, 引号地狱必踩。配方与两个必踩点(别删容器内 /work/.git, 否则 test_commands_engine 多 5 条假红; 先删宿主 .venv 再 uv sync)单点在 memory-bank/pitfalls/testing/patching.md「Docker 等价复现」节。默认镜像 python3.12(= CI 矩阵), 传参可换镜像(如 python3.13-bookworm-slim)。输出全文透传(排障要看 FAILED 明细与覆盖率行)"
doc     = "../../memory-bank/pitfalls/testing/patching.md"
