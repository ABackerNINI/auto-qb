[pack]
name      = "test"
when      = "验证代码：全量 / 快速 / 单文件"
confirmed = true
scripts_dir = "scripts"

# ! TMPDIR **不再由命令前缀设置**(2026-11-02, 计划 26-11-02-0657)：改由 tests/_tmp_bootstrap.py
#   在 pytest 进程内自举探测(R→H→系统temp, 单一配置点 TMP_ROOT_CANDIDATES)；外部 TMPDIR 不含
#   自举标记一律 rc=4 拒收。旧 `set "TMPDIR=R:/..."` 写法自 2026-09-23 引入起在本机从未生效
#   (R 盘不存在, gettempdir 静默回落 %TEMP%)——教训：禁止静默降级。坑档 memory-bank/pitfalls/testing/tmpdir.md。

[tasks."test.full"]
run     = ['uv run pytest tests -q']
timeout = 1800
pin     = true
when    = "改完代码要验一遍（带覆盖率；提交闸门跑的是 test.quick）"
note    = "TMPDIR 由 tests/_tmp_bootstrap.py 自举(2026-11-02 起, 理由见本文件顶部); timeout 900→1800(2026-11-02: B 环境四 clone 并发机载实测全量 1519s); silent_success: 成功只出结论行(TOTAL/passed), 覆盖率明细按需 show"
silent_success = true

[tasks."test.quick"]
run     = ['uv run pytest tests -q --no-cov -n 8']
timeout = 900
when    = "只要结论、不要覆盖率报表（提交闸门用这条）"
note    = "TMPDIR 由 tests/_tmp_bootstrap.py 自举(2026-11-02 起); 显式 -n 8 覆盖 pytest.ini 默认(-n 4): 2772 个用例实测 -n 4 43.8s → -n 8 26.6s(2026-10-08)。**别再降回 -n 4** —— 那是按 tests/ 老体量定的, 用例长到 2772 后已不是甜点; 详见 memory-bank/pitfalls/testing/parallel-run.md。silent_success: 成功只出结论行"
silent_success = true

[tasks."test.pkg"]
run     = ['uv run pytest .commands .agents/skills/commands -q --no-cov -n 8']
timeout = 300
when    = "改了 .commands/ 下的包脚本或 commands 引擎 —— 它们的测试不在 testpaths(tests/) 里, 全量测试收不到"
note    = "**-n 0 曾挂住, 已于 2026-10-03 修根因**(根因与修法见 memory-bank/pitfalls/testing/parallel-run.md): 原先串行在本机**挂住** —— my-commit-flow 的真实临时仓库用例跑到第 15 个后不再推进, 从而**卡死 ship.commit 的闸门**(闸门是这个 task 的调用方, 表现是提交无输出即中止)。根因**不是仓库逻辑**, 是 Windows 上 `subprocess.run(capture_output=True)` 高负载 + 大量 spawn 时无限挂死(CreateProcess 不返回 / 孙进程占管道写端); 已在 `_pipeline.run_capture` 加看门狗(硬截止 + `taskkill /F /T` 杀整棵树), 修复后 `-n 0` 跑三个包脚本用例 79 passed / 275s 不再挂。**并行度 2026-10-08 由 -n 4 调为 -n 8**: 这 134 个用例是**真实 git 子进程**场景(每个含 init/push/rebase), 属 IO 密集而非 CPU 密集 —— 实测 154 passed 下 -n 4 117s / -n 6 90s / **-n 8 73s** / -n 12 92s, 而 `-n auto`(32 worker)会因机器打满致夹具超时(**2 failed + 16 errors, 别用**); -n 8 是甜点。收集面含 .agents/skills/commands(引擎测试贴着引擎放, 2026-09-27 起)。2026-09-28 起也要 TMPDIR 前缀: 上述场景测试用 tmp_path 夹具会建 pytest 临时目录(原『不建临时目录』的说法随 v3 场景测试过时)。silent_success: 成功只出结论行"
silent_success = true

[tasks."test.pkg.scoped"]
script  = "pkg_scoped.py"
timeout = 300
when    = "提交闸门: 改了 .commands/ 下的包(按包收窄, D4)或 commands 引擎(--full 整跑)"
note    = "wrapper 归并规则: 改动文件按 `.commands/<包>/` 前缀归并, 单包只跑该包(pytest <包> -q --no-cov -n 8, TMPDIR 由 wrapper 内置); 受影响包 ≥2 或 --full → 转调 run.py run test.pkg(配方单点不复制); 0 包 → 静默 rc 0(闸门展开本应跳过, 兜底)。计划 26-11-01-0434 方案 C; 自测 scripts/test_pkg_scoped.py"

[tasks."test.one"]
run     = ['uv run pytest <args> -q -n 0 --no-cov']
timeout = 900
when    = "排查单个文件 / 用 -k 筛一组用例"
note    = "<args> 填文件路径或 -k 表达式；单文件用 -n 0（并行会慢在 worker 启动上）。**内置 --no-cov**（2026-10-05, issue 26-10-05-0922-chore-pytest-cov-gate-test-one）: 覆盖率闸是对**全量收集面**设的（阈值在 tests/conftest.py::pytest_configure, Windows 99.0 / 其它 98.5）, 单文件/筛选收集面小 ⇒ 覆盖率必然远低于门槛, 会把「用例全绿」打成覆盖率 FAIL（假红, 实测 11 passed + Total 18.52%）；覆盖率闸只归 test.full（及 CI 全量跑）, 要覆盖率报表用 test.full。详见 memory-bank/pitfalls/testing/single-file-coverage-gate.md"

[tasks."test.keys-update"]
run     = ["uv run python scripts/update_config_key_surface.py"]
when    = "键面守卫(test_config_key_surface)报基线过期后重写 tests/fixtures/config_key_surface.txt"
note    = "消失键且版本未抬时脚本拒绝重生成(先抬 CURRENT_VERSIONS + 注册迁移再跑); 生成器单点在测试模块, 不要复制展开逻辑"

[tasks."test.linux"]
script  = "linux_ci.py"
timeout = 1800
when    = "本机复现 Linux CI(平台差异排查): Docker testbed 常驻容器内跑全量, 与 Windows 侧对照 —— 改了平台相关代码/测试后必跑"
note    = "S2 起后端 = docker exec 常驻容器 auto-qb-testbed(计划 26-11-12-0152): 前置核容器在跑(不在则 [FAIL] 指引 test.linux-env, 不自动构建) -> workdir /root/auto-qb-tests/<slug>(--name 传参或自动 pid+时刻; D5 并行隔离) -> tar 流推送(排除清单 D4: __pycache__/.venv/node_modules/dist/.tools/.coverage*/.pytest_cache/.ruff_cache/auto-qb-data/tmp-analysis; .git 必随拷, find_root 坑; 含未提交 WIP) -> cp -a 模板 venv + uv export --no-hashes + uv pip install 补 delta(S1 拍板: 不用 uv sync --frozen, 锁文件 787 个 files.pythonhosted.org 绝对 URL 不吃镜像索引) -> 容器内 timeout 1500s 内层包裹 pytest(先到先干净退出, R6; 引擎 timeout 900→1800: 900s 旧值连拷贝带全量必超, issue 26-11-12-0053; 内外层差 300s 付推送与 venv 准备, T2b 实测后校准)。保留**代理透传面**: 回环主机改写 host.docker.internal(Docker Desktop 内建 DNS, exec 免 --add-host, 2026-11-12 getent 实证), no_proxy 恒并入回环 —— 缺回环放行则 test_hr_server.py 回环端点用例假红(坑档 pitfalls/testing/patching.md「容器网络坑」)。变体: --python 3.12 / --name <slug>。下轮开跑前按「内嵌 pid 已死 + mtime 超龄 12h」双条件清扫旧 workdir(R6 兜底, 同 _tmp_bootstrap 纪律)。守阵 .commands/test/scripts/test_linux_ci.py; 输出全文透传"
doc     = "../../memory-bank/plans/26-11-12-0152-plan-linux-testbed-docker.html"

[tasks."test.linux-e2e"]
script  = "linux_e2e.py"
timeout = 11400
when    = "Docker testbed 容器内跑 WEB UI e2e(playwright headless chromium): Linux 侧真浏览器冒烟; 默认 @fast 子集, --full 全量"
note    = "S3(计划 26-11-12-0152): 复用 test.linux 的容器核验/tar 推送/slug/清扫/venv 四步(import linux_ci 不复制); 差异 = 容器内跑 playwright。**node_modules 接挂定案 symlink**(计划 D4/S3 取快者, 2026-11-12 容器内实测: ln -s /opt/e2e-node/node_modules 0.002s vs per-workdir npm ci(npmmirror)冷 0.820s/页缓存热 0.469s; 且 symlink 零外呼, npm ci 每轮要 registry 可达 = 新增 D8 网络依赖面; 接挂失败 rc 26)。默认 @fast 子集(--grep @fast, 与 Windows 侧 npm run test:e2e:fast 同口径), --full 全量; `--` 后参数透传 playwright。桩由 playwright webServer 托管(HARNESS_CMD = uv run python scripts/ui_harness.py --port 0, 端口 OS 分配 + wait 捕获, 纪律单点 e2e/harness.mjs, 本 task 不引入固定口); 脚本 export UV_NO_SYNC=1(uv run 不做 sync 检查, venv 已由 cp 模板+delta 备齐; uv 0.13.7 实测支持)。**AUTO_QB_TESTBED 不导出**(唯一消费方是 pytest 挂钟基准 tests/test_modules_p5.py, e2e 不跑 pytest); **代理不透传**(桩/chromium/npm 接挂面零外呼, linux_ci 的回环放行防线用不上; venv delta 段仍可能外呼索引, 失败走 R9 换源 Dockerfile ARG UV_INDEX 经 test.linux-env 重建)。**2026-11-12 S3 实测(容器 swiftshader 软件渲染, 单用例比 Windows 慢一个量级; e2e 数字不进基线口径 —— 计划明示锚 Windows 侧)**: @fast 344 例 342 绿 / 2 败(41.7m; 2 败 = traffic-source-switch 的 route.fetch 在测试结束后才 resolve 的 spec 层竞态, 容器慢 CPU 显性化, Windows 侧恒绿, 见任务档案); --full 512 例 490 绿 / 4 败 / 18 skip(59.2m = 3551s, 4 败 = 同上 2 处 + settings-bt-backup「探测 ambiguous」双皮肤, 同为计时敏感面)。timeout 11400/内层 10800(R6 两层, 差 600s 付推送+venv ~15s): 预算 = 实测 59.2m 的 ~3x 余量。守阵 .commands/test/scripts/test_linux_e2e.py; 输出全文透传"
doc     = "../../memory-bank/plans/26-11-12-0152-plan-linux-testbed-docker.html"

# S1 基建(计划 26-11-12-0152): Docker 常驻容器 testbed 的环境底座。test.linux / test.linux-e2e
# / mutants.* 六条全部以这个容器为宿主(docker exec; S2 起落地, 现状 test.linux 走自带容器),
# 换机 clone 后先跑这条。
[tasks."test.linux-env"]
script  = "linux_env.py"
timeout = 3600
when    = "Docker testbed 基建(幂等): 构建/更新 auto-qb-testbed 镜像并保活常驻容器 —— linux 测试三面(pytest/e2e/变异)的共同前置, 首次或 uv.lock 变更后先跑"
note    = "幂等语义: tag = auto-qb-testbed:<uv.lock sha256 前 8 位>, 已存在即跳过构建(秒级 no-op); 容器已存在且镜像 ID 一致只确保运行, 钉旧镜像则重建净室。基底镜像候选经环境变量 AUTO_QB_TESTBED_HUB_MIRRORS 覆盖(值 direct=直连), 默认候选与实测钉值见 Dockerfile 头注(D8/R9: 漂移换下一家, 不写死)。github 系(uv 托管 CPython 3.13)直连失败 -> 停手请用户手动开代理后重跑, 脚本不内置代理不自动重试。构建 context 是临时目录只拷四份清单文件 —— 别把 478M 工作树整棵喂给 daemon。烘焙层 uv python install 带 RUN 级 UV_PYTHON_DOWNLOADS=manual override(uv#7340: ENV=never 连显式 install 也拦, 不加这层构建自锁)。timeout 3600: 首次构建含 apt+npm+playwright 二进制+双 venv 烘焙, github 直连慢时占大头。2026-11-12 实跑钉值: 全量构建约 161s(buildkit 步骤1-6 48.7s + 步骤7-13 及导出 112.5s, 步号非分层号), 镜像 2.95GB, 幂等复跑 0.5s no-op; 各源实测(单点在 Dockerfile 头注): Docker Hub 基底 daocloud/1ms.run 双通(daocloud 曾瞬断由候选链顶上) / apt TUNA http(https 无 CA 必死, 见 Dockerfile 层1注) / PyPI TUNA + uv 0.13.7 / npm+playwright 二进制 npmmirror / NodeSource 直连 v22.23.5 未降级 / github CPython 3.13.18 直连 6.9s 未开代理"
doc     = "../../memory-bank/plans/26-11-12-0152-plan-linux-testbed-docker.html"

# 工具侧 (tools/global-traffic-monitor) 独立口径: 自带 pyproject + uv.lock + addopts 门槛,
# 覆盖率分母只含 gtm 包, 与主仓 test.full 的 --cov=src 是两套账, 不可合算也不可互比。
# 单文件排障要加 --no-cov (否则收集面只有一个档, 覆盖率必然低于门槛 → 假红), 见
# memory-bank/pitfalls/testing/single-file-coverage-gate.md。
[tasks."test.gtm"]
run     = ["uv run --directory tools/global-traffic-monitor pytest"]
timeout = 600
when    = "改了 tools/global-traffic-monitor 或主仓 webui/tool_client.py(跨进程契约两端)—— 一条命令出 TOTAL 与门槛判定"
note    = "门槛(88)写在工具 pyproject.toml 的 addopts 里, 本命令不重复传参; 跑单个测试档用 `uv run --directory tools/global-traffic-monitor pytest tests/test_x.py --no-cov`。CI 的 test-gtm job 跑同一份 addopts, 双 OS 各一次。silent_success: 成功只出结论行"
silent_success = true

# 随机序周巡检(flaky 治理计划 26-11-05-0118 S6/D10/D13): pytest-randomly 是 dev 依赖,
# 但主套件默认**整体禁用**(pytest.ini addopts 的 -p no:randomly, 顺序必须不动);
# 本 task 是唯一显式随机序入口, 用脚本而非一行 run: `-o addopts=` 替换值含空格,
# 引擎在 Windows 走 cmd.exe 引号地狱必踩(cmdline 组装单点在脚本 build_cmd, 有单测)。
[tasks."test.random-order"]
script  = "random_order.py"
timeout = 1800
when    = "pytest-randomly 随机序周巡检(顺序依赖采样): 红先固定 seed 复现归因再走 flaky 台账; 主套件默认顺序不受本任务影响"
note    = "缺省 1 轮随机 seed; `-- --samples 3` 多轮统计采样, `-- --seed 42` 固定 seed 复现红灯, `--` 后其余参数透传 pytest。每轮头部打印 `--randomly-seed=<N>`(可复现); 任一轮红退出非零并打印复现命令 —— **不用 rerun 插件**(D9: reruns 不是修复), 红灯归因走 memory-bank/testing/flaky-ledger.md「巡检约定」节。实现: pytest.ini addopts 被 -o addopts=-n 8 整体替换(去掉 -p no:randomly 与覆盖率旗标, 插件才加载); 脚本纯函数有单测(test_random_order.py, 随 test.pkg 跑)"
