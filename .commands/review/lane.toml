# ===========================================================================
# review 包 lane 配置模板 —— 存量评审批次矩阵的数据面骨架 (计划 26-11-17-0010 S6)
#
# 定位: 与 `.commands/my-commit-flow/.my-commit-flow.toml` 同构 —— 数据在包根配置
#       文件里, 脚本只读不写。**当前没有任何代码消费本文件**(机械面在 S7 批次接线);
#       开一次存量评审前按下面字段说明填空。TOML 语法可用 `python3 -c "import
#       tomllib; tomllib.load(open('lane.toml','rb'))"` 自检。
#
# 配置缺失回落语义 (计划 26-11-17-0010 D13): 本文件是**运行必需数据** —— 要开存量
# 评审而没有批次矩阵, 属引导性报错(报错文案指路本文件与各必填字段), 不静默降级成
# "没有矩阵也照跑"; 校验类辅助数据(如快照目录缺省值)缺失才允许跳过 + 必打提示。
# ===========================================================================

[lane]
# TODO 必填: 被评审的基线分支(冻结钉定: manifest 生成时点现查远端核验, 未同步即拒;
# 任何路线认领后拒绝重生成 —— 冻结基线一经引用不可移动)
freeze_branch = ""                # 例: "develop"
# TODO 选填: 快照导出目录(留空 = <repo>/../<repo名>-snap/; 快照落在仓库之外, 不切分支不动 HEAD)
snapshot_dir  = ""

# ---------------------------------------------------------------------------
# 批次矩阵: 每条路线一个 [[route]] 表, 路线下逐批 [[route.batch]]。
# 生成 manifest 时做互斥 + 全覆盖守卫(重叠/漏配即拒并列清单) —— globs 宁缺勿滥,
# 逐批写清范围, 让"这批该看什么"可判定。globs 为 fnmatch glob(整路径, `*` 跨 `/`,
# 裸串 = 精确相等), 与 my-commit-flow 的 red_lines 同一匹配口径。
# ---------------------------------------------------------------------------

[[route]]
id    = "R1"                      # 路线 id, 例: R1 / R2 ...
owner = ""                        # TODO 认领时填; 认领单点在 route-<R>.json, 重复认领会被拒

  [[route.batch]]
  id    = "R1-1"                  # 批次 id = <路线>-<序号>; 完成判据 = 批次全覆盖无断号
  desc  = "TODO: 本批评审范围一句话(例: 某目录全域: 模块A/模块B)"
  depth = "full"                  # full = 逐文件精评 / scan = 快扫(词表以 S7 接线实现为准)
  globs = ["TODO: 本批覆盖的仓库根相对路径 glob, 例: src/module_a/*.py"]

  [[route.batch]]
  id    = "R1-2"
  desc  = "TODO: 下一批范围一句话"
  depth = "full"
  globs = ["TODO: ..."]

