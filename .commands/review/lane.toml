# ===========================================================================
# review 包 lane 配置 —— 存量评审 lane 的项目数据单点 (计划 26-11-17-0010 S7 数据外置)
#
# 定位: 与 `.commands/my-commit-flow/.my-commit-flow.toml` 同构 —— 数据在包根配置文件,
#       脚本只读不写。review_lane.py 的全部项目数据(批次矩阵 / 分层范围含 vendor 排除 /
#       快照与 lane 目录 / 计划与 R2 报告指针 / 分支策略)都从本文件读, 机械流程零改;
#       本仓矩阵即真实实例, 移植到别的项目整文件替换成本项目值即可。
#
# 接线状态: review_lane.py 消费面已随本批(计划 26-11-17-0010 S7)接线 —— 本文件为其项目
#           数据唯一来源, 无遗留硬编码; 改矩阵后须重跑 review.lane.manifest 再认领
#           (claim 的指纹校验会拒与在库 manifest 不符的旧矩阵)。
#
# 配置缺失回落语义 (计划 26-11-17-0010 D13): 本文件是**运行必需数据** —— 文件缺失 /
# 批次矩阵缺失 / 必填字段缺失 / 模板 TODO 占位未填 = 引导性报错(报错文案指路本文件与
# 具体字段, 不静默降级成 "没有矩阵也照跑"); 校验类辅助数据(r2_report / issues_dir 指向
# 的文件不在盘)缺失才允许跳过 + 必打提示(底册切片空, 不拦)。
#
# TOML 语法自检: `python3 -c "import tomllib; tomllib.load(open('lane.toml','rb'))"`
#
# 字段说明:
# - [lane]
#     campaign      评审 campaign 名(进 manifest.json 的 campaign 字段)
#     freeze_branch 被评审的基线分支(冻结钉定: manifest 生成时点核验; 任何路线认领后拒绝
#                   重生成 —— 冻结基线一经引用不可移动)。有远端时 ls-remote 核验本地 HEAD
#                   ==远端 tip 才放行; 未配置远端时取本地 HEAD(无远端稳态, D18)。
#     snapshot_root 快照导出容器目录名: 快照落仓库外 <repo 父目录>/<snapshot_root>/<repo 名>,
#                   不切分支不动 HEAD。仓库相对**单段目录名**(不得含 '/' 或 '..')—— 仓库外
#                   快照目录的删除授权/清理按它点名, 勿填通用名(如 tmp)
#     lane_dir      路线状态单点目录(manifest.json / route-<R>.json / findings / 小结落这里),
#                   仓库相对且逐段规范(不得为绝对路径, 不得含 ''/'.'/ '..' 段 —— 即禁 '//'、
#                   './'、尾 '/' 等形态), 也不得含 '\': git porcelain 恒正斜杠, 路径字段一律
#                   填 posix 形态(Windows 宿主尤其注意) —— 树净守卫按原串做 lane 前缀比对,
#                   非常规段会比对不齐产生误导性误报
#     plan_file     本 campaign 的计划文档指针(manifest 生成前先核在盘)
#     r2_report     R2 终表报告指针(底册切片用; 不在盘打警告, 切片空, 不拦)
#     issues_dir    Open issues 底册目录(不在盘打警告, 切片空, 不拦)
# - [lane.scope] 分层范围: include / exclude 均为 fnmatch glob(对仓库相对整路径, `*` 跨 `/`,
#     裸串 = 精确相等, 与 my-commit-flow 红线同一匹配口径); exclude 先判(命中即排除)。
#     本仓口径: 评审对象 = src 代码文件(.py/.js/.css/.html) + 根 scripts/*.py; vendor
#     第三方发行物(vue/uPlot min)与 __pycache__ 明确排除。
# - [[route]] / [[route.batch]] 批次矩阵: 每条路线一个 [[route]] 表, 路线下逐批
#     [[route.batch]]。生成 manifest 时做互斥 + 全覆盖守卫(重叠/漏配即拒并列清单) ——
#     globs 宁缺勿滥, 逐批写清范围, 让"这批该看什么"可判定。批次字段:
#     id    = <路线>-<序号>(完成判据 = 批次全覆盖无断号)
#     desc  = 本批评审范围一句话
#     depth = full(逐文件精评) / contract(py<->js 契约与机制) / mechanism(机制红线抽查,
#             不逐行) / scan(快扫) —— 词表以 review_lane.py 接线实现为准
#     exact = 精确路径清单(posix); globs = fnmatch glob —— 二者至少填一个
# ===========================================================================

[lane]
campaign      = "legacy-code-review-4"
freeze_branch = "develop"
snapshot_root = "auto-qb-review4-snap"
lane_dir      = "memory-bank/reports/attachments/legacy-review4"
plan_file     = "memory-bank/plans/26-11-05-2335-plan-legacy-code-review-4.html"
r2_report     = "memory-bank/reports/26-10-30-0237-report-full-code-review-2.html"
issues_dir    = "memory-bank/issues"

[lane.scope]
include = [
  "scripts/*.py",
  "src/*.py",
  "src/*.js",
  "src/*.css",
  "src/*.html",
]
exclude = [
  "src/auto_qb/webui/static/shared/vendor/*",
  "*/__pycache__/*",
]

