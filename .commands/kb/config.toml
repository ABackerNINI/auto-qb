[pack]
name      = "kb"
when      = "知识库：索引重建 / 会话切片 / 只校验不写"
confirmed = true

[tasks."kb.index"]
run     = ["python <skill-dir:memory-bank>/scripts/gen_tasks_index.py",
           "python <skill-dir:memory-bank>/scripts/gen_kb_index.py",
           "python <skill-dir:memory-bank>/scripts/gen_docs_index.py"]
timeout = 120
pin     = true
when    = "收尾回写知识库后重建索引（不要手改 _index.md）"
note    = "❗集合必须与 my-commit-flow 的 `memory-bank/` 闸门**同集**: 闸门能判红的生成物, 这里就得有重建入口 —— 2026-09-24 实测漏项导致报错文案指到跑完仍红的命令; 2026-09-29 _doc-map.md 物化退役(改查询 kb.docmap)后为三条"

[tasks."kb.docmap"]
run     = ["python <skill-dir:memory-bank>/scripts/gen_doc_map.py <args>"]
timeout = 60
when    = "查跨形态专题视图: 一件事的全部材料 / 出件前查专题主键（默认活跃专题全行+完结专题名录）"
note    = "只打印不写文件（_doc-map.md 已退役）; <args> 可传 --topic <key> 下钻 / --all 全量 / --forks 分叉提示 / --check 只校验（已挂进 kb.check）"

[tasks."kb.active"]
run     = ["python <skill-dir:memory-bank>/scripts/gen_active_recent.py <args>"]
timeout = 60
when    = "看会话滚动状态（在办专题切片，按最后活动倒序）"
note    = "只打印不写文件；<args> 可传 --check 只校验（已挂进 kb.check）"

[tasks."kb.baseline"]
run     = ["python <skill-dir:memory-bank>/scripts/gen_baseline_recent.py <args>"]
timeout = 60
when    = "看测试基线 / 最新数字 / 历史基线排障（默认列最近 3 条）"
note    = "只打印不写文件；<args> 可传 --all 或 -n N 看全量/改条数、--check 只校验（--check 已同时挂进 kb.check）"

[tasks."kb.check"]
run     = ["python <skill-dir:memory-bank>/scripts/gen_tasks_index.py --check",
           "python <skill-dir:memory-bank>/scripts/gen_kb_index.py --check",
           "python <skill-dir:memory-bank>/scripts/gen_docs_index.py --check",
           "python <skill-dir:memory-bank>/scripts/gen_doc_map.py --check",
           "python <skill-dir:memory-bank>/scripts/gen_active_recent.py --check",
           "python <skill-dir:memory-bank>/scripts/gen_baseline_recent.py --check"]
timeout = 120
when    = "改完知识库先自查，或提交前确认索引自洽"
note    = "--check 只校验不写；要在回写代码**之后**跑，否则改到一半必然红。集合 = kb.index 三条的 --check + gen_doc_map 主键校验(已无物化文件, 2026-09-29 起查孤儿) + activeContext/基线切片校验"
