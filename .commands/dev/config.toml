[pack]
name      = "dev"
when      = "开发期服务：WEB UI / 假 qB / 浏览器冒烟"
confirmed = true

[tasks."dev.webui"]
run     = ["uv run python scripts/dev_webui.py <args>"]
timeout = 3600
when    = "连真机 qBittorrent，关掉自动任务只开 WEB UI"
note    = "前台长跑，Ctrl-C 停；常用 --qb-port / --web-port / --no-open（--help 看全量）"

[tasks."dev.sim"]
run     = ["uv run python scripts/sim_qb.py <args>"]
timeout = 3600
when    = "起假 qBittorrent WebUI 客户端做仿真（--self-test 自检）"
note    = "同样前台长跑；参数很多，先 --help"

[tasks."dev.run"]
run     = ["uv run python src/auto-qb.py <args>"]
timeout = 3600
when    = "真机跑主程序（<args> 先给 config.yml 与 --dry-run）"
note    = "需真实 qBittorrent; 一律先 --dry-run 观察, 确认无误再去掉"

[tasks."dev.fmt"]
run     = ["uv run yapf -i <args>"]
timeout = 60
when    = "格式化改过的 py 文件（.style.yapf: facebook 风格, 列宽 120）"
note    = "用**项目内** yapf(pyproject dev 依赖组, 0.43.0), 不再用 PATH 上的系统 yapf。⚠ 沙箱约束: yapf 把语法 pickle 缓存在 `%LOCALAPPDATA%\\Google\\YAPF\\Cache`(platformdirs 的 Win32 已知文件夹 API 决定, **环境变量改不动**), 该目录不在工具 shell 沙箱白名单 ⇒ 每次跑都刷一批被拒的临时文件; 实测**多数时候仍 <1s 正常跑完**, 但 2026-10-08 观察到过挂死(100% 单核 + 持续写磁盘) ⇒ timeout 60s + 引擎超时杀整棵树兜底。彻底消除: 把该缓存目录加进沙箱白名单。根因见 memory-bank/pitfalls/testing/sandbox-tool-cache.md"
doc     = "../../memory-bank/pitfalls/testing/sandbox-tool-cache.md"

[tasks."dev.harness"]
run     = ["uv run python scripts/ui_harness.py <args>"]
timeout = 900
when    = "浏览器冒烟（真浏览器跑前端断言合集）"
note    = "必须 uv run —— 裸 python 会缺 qbittorrentapi"

[tasks."dev.e2e"]
run     = ["npx playwright test <args>"]
timeout = 360
when    = "改前端后跑 WEB UI 真浏览器冒烟（e2e/ 全量集; 桩服务由 webServer 自动起）"
note    = "timeout=360s: S7 矩阵轮实测默认轮 164s / hang 轮 219s, 180s 撑不住 hang 轮(引擎到点强杀 rc=1, 2026-10-06 实测后放宽)。日常门禁跑 fast 子集: npm run test:e2e:fast（--grep @fast, 分钟级）; 本 task 是全量。收尾已由 e2e/global-teardown.mjs 兜底, 工具 shell 里也能跑完并退出(Windows 上 Playwright 自带的 taskkill 走 spawnSync + 管道 stdio, 本机必 EBUSY, 不兜会用例全 PASS 但命令永不退出、8137 残留; 根因与实测见 doc); 端口固定 8137 且 reuseExistingServer=false, 别改成复用; 模式矩阵 env 参数化(计划 26-10-06-0708 S0): E2E_CMD_RESULT=ok|error|hang / E2E_SKIP_CHECK=on|off / E2E_HR_SCENE=on|empty|off / E2E_TORRENTS=N, 默认 ok/on/on/300, 改动的参数才传给桩命令; S7 矩阵轮六行(串行人跑, 每轮独立起桩): ①commands run dev.e2e ②E2E_CMD_RESULT=error commands run dev.e2e ③E2E_CMD_RESULT=hang commands run dev.e2e ④E2E_SKIP_CHECK=off commands run dev.e2e ⑤E2E_HR_SCENE=empty commands run dev.e2e(或 off) ⑥E2E_TORRENTS=3000 commands run dev.e2e"
doc     = "../../memory-bank/pitfalls/testing/playwright-teardown.md"
