[pack]
name      = "dev"
when      = "开发期服务：WEB UI / 假 qB / 浏览器冒烟"
confirmed = true

[tasks."dev.webui"]
run     = ["uv run python scripts/dev_webui.py <args>"]
timeout = 3600
when    = "连真机 qBittorrent，关掉自动任务只开 WEB UI"
note    = "前台长跑，Ctrl-C 停；常用 --qb-port / --web-port / --no-open（--help 看全量）"

[tasks."dev.sim"]
run     = ["uv run python scripts/sim_qb.py <args>"]
timeout = 3600
when    = "起假 qBittorrent WebUI 客户端做仿真（--self-test 自检）"
note    = "同样前台长跑；参数很多，先 --help"

[tasks."dev.run"]
run     = ["uv run python src/auto-qb.py <args>"]
timeout = 3600
when    = "真机跑主程序（<args> 先给 config.yml 与 --dry-run）"
note    = "需真实 qBittorrent; 一律先 --dry-run 观察, 确认无误再去掉"

[tasks."dev.fmt"]
run     = ["yapf -i <args>"]
timeout = 300
when    = "格式化改过的 py 文件（.style.yapf: facebook 风格, 列宽 120）"
note    = "<args> 传文件路径; 提交闸门只碰本次改过的, 别整仓跑 —— 会带出无关重排"

[tasks."dev.harness"]
run     = ["uv run python scripts/ui_harness.py <args>"]
timeout = 900
when    = "浏览器冒烟（真浏览器跑前端断言合集）"
note    = "必须 uv run —— 裸 python 会缺 qbittorrentapi"

[tasks."dev.e2e"]
run     = ["npx playwright test <args>"]
timeout = 180
when    = "改前端后跑 WEB UI 真浏览器冒烟（e2e/ 最小集: 渲染健康 + 数据契约; 桩服务由 webServer 自动起）"
note    = "收尾已由 e2e/global-teardown.mjs 兜底, 工具 shell 里也能跑完并退出(Windows 上 Playwright 自带的 taskkill 走 spawnSync + 管道 stdio, 本机必 EBUSY, 不兜会用例全 PASS 但命令永不退出、8137 残留; 根因与实测见 doc); 端口固定 8137 且 reuseExistingServer=false, 别改成复用; 模式矩阵 env 参数化(计划 26-10-06-0708 S0): E2E_CMD_RESULT=ok|error|hang / E2E_SKIP_CHECK=on|off / E2E_HR_SCENE=on|empty|off / E2E_TORRENTS=N, 默认 ok/on/on/300, 改动的参数才传给桩命令; S7 矩阵轮六行(串行人跑, 每轮独立起桩): ①commands run dev.e2e ②E2E_CMD_RESULT=error commands run dev.e2e ③E2E_CMD_RESULT=hang commands run dev.e2e ④E2E_SKIP_CHECK=off commands run dev.e2e ⑤E2E_HR_SCENE=empty commands run dev.e2e(或 off) ⑥E2E_TORRENTS=3000 commands run dev.e2e"
doc     = "../../memory-bank/pitfalls/testing/playwright-teardown.md"
