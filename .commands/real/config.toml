[pack]
name      = "real"
when      = "真机实测轨: 三层守卫 / 起停测试实例 / 跑 tests-real 用例(不挂提交闸门)"
confirmed = true

[tasks."real.guard"]
run     = ["uv run python tests-real/runner.py guard"]
timeout = 120
when    = "真机实测开工第一步: 端口/镜像路径白名单 + 真实种子归零"
note    = "不过即非 0 退出, 没有 --force 逃生门 —— 白名单只认 127.0.0.1:36595/36596 且镜像路径在 D:\\Programs\\qBittorrent-testing* 下"

[tasks."real.list"]
run     = ["uv run python tests-real/runner.py list"]
timeout = 30
when    = "看这一片有哪些用例(id / 文件 / 标题), 排期时定用例清单"
note    = "用例 id 写在 docstring 首行 [RMxx-nn], 从这里抽; 新增用例不必改本包"

[tasks."real.up"]
run     = ["uv run python tests-real/runner.py up <args>"]
timeout = 120
when    = "测试实例没起时拉起它(只认白名单端口)"
note    = "经 explorer.exe 拉起: 工具 shell 里 Start-Process / cmd start 起的 GUI 进程会随命令结束被杀(实测); <args> 传 --port 36595|36596, 不加 --dry-run 就真起"

[tasks."real.down"]
run     = ["uv run python tests-real/runner.py down <args>"]
timeout = 120
when    = "关掉测试实例(按镜像路径精确匹配, 不碰生产 qB)"
note    = "<args> 传 --port 36595|36596; 默认真关, 想先看传 --dry-run"

[tasks."real.pause-all"]
run     = ["uv run python tests-real/runner.py pause-all <args>"]
timeout = 120
when    = "把目标实例全部种子暂停(手工版守卫; real.guard 已含此步)"
note    = "<args> 传 --port 36595|36596"

[tasks."real.seed"]
run     = ["uv run python tests-real/seed.py add <args>"]
timeout = 600
when    = "造一个假种子并加入测试实例(手工探索用: 指定大小/落点/生成方式/是否落数据)"
note    = "默认 dry-run, 加 --yes 才真造真加; 默认 256K(KB 级就够看状态), 关键参数 --size 8M | --pattern random|zeros|text | --dir <落点> | --from <现成文件> | --no-data(不落数据) | --paused | --port 36596。落点只认 tests-real/.work/ 与 R:/qbt-fake/: ≥32M 自动落 R:(内存盘, 免写盘代价, 重启即清空)。> 2G 原则上不造, 命令会停下来等授权, 必须 --allow-huge --reason \"<原因>\" 双写才放行(只给 --allow-huge 会被拒), 只造元数据用 --no-data 不受限。默认不给 announce ⇒ 纯本地做种、零外连; 自造种子一律打 real-fake 标签, 与真实种子互不相干"

[tasks."real.seed.list"]
run     = ["uv run python tests-real/seed.py list <args>"]
timeout = 120
when    = "看实例里有哪些自造种子(hash / 名字 / 大小 / 进度 / 状态 / 落点)"

[tasks."real.seed.rm"]
run     = ["uv run python tests-real/seed.py rm <args>"]
timeout = 300
when    = "删掉自造种子(默认连数据一起删; 只认 real-fake 标签, 碰不到真实种子)"
note    = "<args> 传 --all 或 --name X 或 --hash 前缀, 加 --yes 才真删; --keep-data 保留数据文件"

[tasks."real.seed.clean"]
run     = ["uv run python tests-real/seed.py clean <args>"]
timeout = 300
when    = "清掉 tests-real/.work 与 R:/qbt-fake 下残留的数据与 .torrent(不碰 qB 里的条目)"
note    = "两处都扫(含空目录壳子), 越界直接拒跑; 加 --yes 才真删"

[tasks."real.run"]
run     = ["uv run python tests-real/runner.py run <args>"]
timeout = 3600
when    = "跑单条用例"
note    = "默认 dry-run, 必须 <args> 带 --case RM00-01 --yes 才真跑; 真跑会改 qB 状态/起停进程"

[tasks."real.suite"]
run     = ["uv run python tests-real/runner.py suite <args>"]
timeout = 3600
when    = "跑一片全部用例(一轮实测)"
note    = "<args> 传 --slice RM00 --yes; 一片半天预算, 超了就按规程 §05 拆片"
