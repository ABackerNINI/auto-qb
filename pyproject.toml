[project]
name = "auto-qb"
version = "0.1.0"
description = "基于 qBittorrent WebUI API 的 PT 种子自动化管理工具"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ABacker" }]
requires-python = ">=3.12"
keywords = ["qbittorrent", "private-tracker", "torrent", "automation", "seeding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: Utilities",
]

# 直接依赖: 精确锁定 (uv.lock 会锁全量传递依赖; 升级时改这里再 `uv lock --upgrade`)
dependencies = [
    "pyyaml==6.0.3",
    "qbittorrent-api==2026.8.1",
    "filelock==3.32.6",
    "pystray==0.19.5",
    "pillow==12.3.0",
    "customtkinter==6.0.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "ruamel.yaml==0.19.1",
    "httpx==0.28.1",
]

[project.scripts]
auto-qb = "auto_qb.cli:main"

# 开发/测试依赖 (PEP 735 依赖组, 取代 .github/workflows/requirements-dev.txt 的 dev 部分)
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # 并行跑测试: 全量 19.4s → 5.0s(`-n 4`)。见 pytest.ini 的 addopts 与
    # memory-bank/pitfalls/testing/parallel-run.md (含 sidefx 台账在并行下的回传机制)。
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_qb"]
