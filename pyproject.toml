[project]
name = "auto-qb"
# 版本号单源: 唯一权威出处是 src/auto_qb/__init__.py 的 __version__(计划 26-09-22-2318 v2 §05);
# 构建期由 hatchling regex 提取, 消灭 pyproject/源码双写漂移(旧 version = "0.1.0" 已实证漂移)。
dynamic = ["version"]
description = "基于 qBittorrent WebUI API 的 PT 种子自动化管理工具"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ABacker" }]
requires-python = ">=3.12"
keywords = ["qbittorrent", "private-tracker", "torrent", "automation", "seeding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: Utilities",
]

# 直接依赖: 精确锁定 (uv.lock 会锁全量传递依赖; 升级时改这里再 `uv lock --upgrade`)
dependencies = [
    "pyyaml==6.0.3",
    "qbittorrent-api==2026.10.1",
    "filelock==4.2.5",
    "pystray==0.19.5",
    "pillow==13.0.0",
    "customtkinter==6.0.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "ruamel.yaml==0.19.1",
    "httpx==0.28.1",
]

[project.scripts]
auto-qb = "auto_qb.cli:main"

# 开发/测试依赖 (PEP 735 依赖组, 取代 .github/workflows/requirements-dev.txt 的 dev 部分)
[dependency-groups]
dev = [
    # 机械化 bump 执行器(计划 26-09-22-2318 v2 §6.2 步骤③): 1.8.1 为实装时最新(PyPI 实查 2026-11-06)。
    "bump-my-version==1.8.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    # 并行跑测试: 全量 19.4s → 5.0s(`-n 4`)。见 pytest.ini 的 addopts 与
    # memory-bank/pitfalls/testing/parallel-run.md (含 sidefx 台账在并行下的回传机制)。
    # 随机序周巡检(flaky 治理计划 26-11-05-0118 S6/D10/D13): **默认禁用**(pytest.ini addopts
    # `-p no:randomly`, 主套件默认顺序不变), 显式巡检入口 `commands run test.random-order`。
    # 巡检约定单点: memory-bank/testing/flaky-ledger.md「巡检约定」节。
    "pytest-randomly==5.0.0",
    "pytest-xdist==3.8.0",
    # 格式化: .style.yapf(facebook, 列宽 120)。❗必须**项目内**装 —— 此前 dev.fmt 用 PATH 上的
    # 系统 yapf, 版本/缓存位置都不可控(2026-10-08 排查"yapf 挂住"时的直接诱因之一)。
    # 0.43.0 是当前最新版(PyPI 实查); 版本一升, 它的语法缓存文件名里的版本号也会变。
    "yapf==0.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 版本号单源接线: 构建时从 __init__.py 的 __version__ 行提取(计划 26-09-22-2318 v2 §4.2/§05)。
[tool.hatch.version]
source = "regex"
path = "src/auto_qb/__init__.py"

# wheel 构建钩子(hatch_build.py): 构建期把 git hash 注入 .dist-info/BUILD_ID 侧车
# —— Version 本体保持纯 SemVer, hash 经侧车溯源(计划 v2 §4.2 双路径)。
[tool.hatch.build.hooks.custom]

# 机械化 bump 接线(计划 26-09-22-2318 v2 §6.2 步骤③): bump-my-version 只负责改版本文件
# —— commit/tag 一律 false, 提交走 ship.commit 闸门、tag 走 release.tag(显式 ref + ls-remote 核验)。
# current_version 由 release.bump 流程维护; 档位由 gitmoji 决策器(suggest_bump.py)提案、agent 改判留痕。
[tool.bumpversion]
current_version = "0.2.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "src/auto_qb/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.hatch.build.targets.wheel]
packages = ["src/auto_qb"]
