---
# choose 编排块样例(plan 26-11-01-0106 W3-B, D3 转正): 动作域分支
#
# 形态: 动作列表项可为 {choose: [{when: <条件树节点>, then: [动作项...]}, ...], default: [动作项...](可选)}
#   - when 与 conditions 同款组合树节点(all/any/not 组合 + 13 种条件叶子, 可嵌套);
#   - 引擎按序求 when, 首个命中的分支执行其 then(其后分支短路不再求值);
#   - 无分支命中且有 default -> 执行 default; 无命中且无 default = 空操作(与空动作表一致);
#   - then/default 内是普通动作项(含 on_error 失败策略, 与顶层动作同语义);
#   - choose 可与普通动作项混排在 actions 列表(按顺序执行);
#   - 嵌套约束: choose 内不再允许 choose(编排块只允许一层); when 条件树深度复用
#     conditions 同款上限(16 层)。
config:
    interval: 5S
    remove_similar_tags: false
    hr:
        add_tag: ""
        add_category: "!!HR${required_seeding_time}!!"
        overwrite_category: false
        add_tag_for_satisfied: ""
        add_category_for_satisfied: --HR${required_seeding_time}--
        overwrite_category_for_satisfied: false
    grouping:
        enabled: true
        missing_tag: MISSING
    delete_tags:
    delete_tags_if_has_no_torrents:
    qbittorrent:
        host: 127.0.0.1
        port: "16585"
        username: abacker
        password: "132435."

    choose_demo_rules:
        rule:
            enabled: true
            trigger: interval
            interval: 60S
            execute_once: never
            cooldown: 0S

            conditions:
                - trackers:
                      - ptfans_cc

            actions:
                # 普通动作项与 choose 混排: 先打基础标签, 再按种子形态分支
                - add_tags:
                      - PTFans
                - choose:
                      # 分支一: 大种子(>=10GiB)且做种中 -> 限速上传保护带宽
                      - when:
                            all:
                                - size: ">=10GiB"
                                - state:
                                      - is_uploading
                        then:
                            - upload_speed_limit: 5MiB/s
                          # 分支内动作同样有 per-step on_error 失败策略(W2), 与顶层同语义
                          #   (此例从缺省, 即 policy: stop 失败即止)
                      # 分支二: HR 未达标 -> 追加 HR 标签(when 用嵌套 any 的组合树)
                      - when:
                            any:
                                - hr: condition-met
                                - not:
                                      seedtime: ">7D"
                        then:
                            - add_tags:
                                  - HR-watch
                  # 所有分支都未命中时执行 default(省略 default 且无命中 = 空操作)
                  default:
                      - add_tags:
                            - check-manual

    trackers:
        ptfans_cc:
            domains:
                - ptfans.cc
            tags:
                - PTFans
            upload_speed_limit: 1000KiB/s
            download_speed_limit: 1000KiB/s
            hr:
                required_seeding_time: 7D
                extra_seeding_time: 12H
                condition: 80%
            rules:
                - "@choose_demo_rules.rule"
