<!doctype html>
<html lang="zh-CN" data-theme="ocean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>01 · 登录页 — Console Hub 风格模板</title>
<!-- 设计溯源: 参照 resources/settings-page-templates/05-console-hub.html, 并以落地版
     src/auto_qb/webui/static/shared/console_hub.css 的**用户实测微调值**为准
     (方角控件 / 38×21 开关 / 负 spread 发光 / 派生变量声明在 --tone 覆盖层)。
     设计思维四问: 目的=值守型辅种工具的唯一入口, 要"确认我在连正确的东西";
     语调=仪表台 Console(工程感/等宽读数/分段 LED); 约束=只用既有系统字体栈与五主题令牌,
     颜色零写死; 差异点=切角大面 + LED 状态读数 + 密钥输入框走 important(凭据)语义档。 -->
<style>
/* ============ 主题令牌(与 prism/css/themes/ocean.css + tokens.css 同源) ============ */
:root {
  --font-ui: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "Bahnschrift", "Segoe UI", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
  --radius-lg: 8px; --radius: 6px; --radius-sm: 4px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .16);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, .22);
  --shadow-3: 0 14px 40px rgba(0, 0, 0, .3);
  --ease: cubic-bezier(.2, .8, .3, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --dur: 160ms;
}
:root[data-theme="ocean"] { color-scheme: dark;
  --bg: #0d1724; --bg-card: #15233a; --bg-row: #112034; --bg-hover: #1c3050;
  --bg-sunken: rgba(5, 12, 24, .5); --bg-elev: #1b2d4b; --glass: #111e31;
  --fg: #e9eff7; --fg-muted: #9cadc6; --fg-dim: #6e84a3; --fg-soft: #bccadd;
  --accent: #3aa6a6; --accent-hi: #5cc3c3; --accent-soft: rgba(58, 166, 166, .15); --accent-line: rgba(58, 166, 166, .45);
  --green: #3fd699; --green-soft: rgba(63, 214, 153, .15); --green-line: rgba(63, 214, 153, .42);
  --warn: #f5bb42; --warn-soft: rgba(245, 187, 66, .15); --warn-line: rgba(245, 187, 66, .45);
  --error: #f3766f; --error-soft: rgba(243, 118, 111, .15); --error-line: rgba(243, 118, 111, .45);
  --border: #23395a; --border-strong: #34507c; --border-soft: rgba(255, 255, 255, .07);
  --surface-1: rgba(255, 255, 255, .03); --surface-2: rgba(255, 255, 255, .06);
  --hairline: rgba(255, 255, 255, .055);
}

* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.6 var(--font-ui); background: var(--bg); color: var(--fg); }

/* ============ Console Hub 组件层(照搬 console_hub.css 微调值, 类名保持 hb-) ============ */
/* 切角: 只用于大面(登录卡 / 图标座), 控件层一律方角 —— 切角会裁掉 box-shadow 发光(硬知识①) */
.hb-cut { --hb-cut: 10px; clip-path: polygon(var(--hb-cut) 0, 100% 0, 100% calc(100% - var(--hb-cut)), calc(100% - var(--hb-cut)) 100%, 0 100%, 0 var(--hb-cut)); }

/* 语调派生: 必须声明在会覆盖 --tone 的同一层元素上(硬知识③, 派生变量固化坑) */
.hb-input, .hb-btn, .hb-card-ico, .hb-mark {
  --tone-line: color-mix(in srgb, var(--tone) 45%, transparent);
  --glow: inset 0 0 0 1px var(--tone), 0 0 22px -6px color-mix(in srgb, var(--tone) 80%, transparent);
  --glow-soft: inset 0 0 0 1px color-mix(in srgb, var(--tone) 50%, transparent),
      0 0 16px -8px color-mix(in srgb, var(--tone) 60%, transparent);
}
/* 输入框(Ash Thorp 原值): 沉底 + 方角 + 聚焦发光 */
.hb-input {
  --tone: var(--accent);
  padding: 10px 14px; background-color: var(--bg-sunken); color: var(--fg);
  border: 1px solid var(--tone-line); border-radius: 0; font-size: 13px; width: 100%;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.hb-input::placeholder { color: var(--fg-dim); opacity: 1; }
.hb-input:hover { border-color: var(--tone); box-shadow: var(--glow-soft); }
.hb-input:focus { outline: none; border-color: var(--tone); box-shadow: var(--glow); }
/* 语义档: 访问密钥 = 凭据 → important(warn); 静息描边就带语义色 */
.hb-input.important { --tone: var(--warn); }

/* 按钮: 方角描边型, 一律不带实心填充 */
.hb-btn {
  --tone: var(--fg-dim);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; background: var(--bg-elev); color: var(--fg);
  border: 1px solid var(--tone-line); border-radius: 0;
  font: 600 13px/1.4 var(--font-ui); letter-spacing: .02em; cursor: pointer; clip-path: none;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
      color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.hb-btn:hover { background: var(--bg-hover); border-color: var(--tone); box-shadow: var(--glow-soft); }
.hb-btn:focus-visible { outline: 2px solid var(--tone); outline-offset: 2px; box-shadow: var(--glow-soft); }
.hb-btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.hb-btn.primary { --tone: var(--accent); background: transparent; border-color: var(--tone-line); color: var(--accent-hi); }
.hb-btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-hi); color: var(--accent-hi); box-shadow: var(--glow); }
.hb-btn.ghost { --tone: transparent; --tone-line: transparent; background: transparent; border-color: transparent; color: var(--fg-muted); }
.hb-btn.ghost:hover { background: transparent; color: var(--accent-hi); box-shadow: none; }

/* 分段 LED 状态条: 绿=正常 / 橙=注意 / 灰=未连接 */
.led { display: inline-block; width: 34px; height: 7px; flex: none;
  background: repeating-linear-gradient(90deg, var(--fg-dim) 0 5px, transparent 5px 8px); opacity: .55; }
.led.ok { background: repeating-linear-gradient(90deg, var(--green) 0 5px, transparent 5px 8px); opacity: 1; }
.led.warn { background: repeating-linear-gradient(90deg, var(--warn) 0 5px, transparent 5px 8px); opacity: 1; }
.led.err { background: repeating-linear-gradient(90deg, var(--error) 0 5px, transparent 5px 8px); opacity: 1; }

.hb-ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.hb-ico.lg { width: 18px; height: 18px; }
.mono { font-family: var(--font-mono); }

/* ============ 登录页 ============ */
.login-mask { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  /* 背景: 顶部一束 accent 定向光 + 极淡网格(仪表台"坐标纸"), 主体仍沉在 --bg */
  background:
    radial-gradient(900px 480px at 50% -8%, var(--accent-soft), transparent 62%),
    linear-gradient(var(--hairline) 1px, transparent 1px) 0 0 / 100% 56px,
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px) 0 0 / 56px 100%,
    var(--bg);
}
/* 登录卡: 大面 → 切角 + 1px 描边 + 左上方向光; 内边距足够大, 内部控件聚焦发光不会被切角裁到 */
.login-card { width: 392px; max-width: calc(100vw - 32px); padding: 30px 32px 26px; text-align: center;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  background-image: linear-gradient(135deg, var(--surface-1), transparent 46%);
  box-shadow: var(--shadow-3); }
.brand { display: flex; align-items: center; justify-content: center; gap: 10px;
  font: 600 24px/1.2 var(--font-display); letter-spacing: .02em; }
.hb-mark { --tone: var(--accent); flex: none; width: 34px; height: 34px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-hi); border: 1px solid var(--accent-line); }
.login-sub { margin: 8px 0 0; font: 500 11px/1.5 var(--font-mono); color: var(--fg-dim); letter-spacing: .04em; }
/* 状态行: LED + mono 读数, 登录页也要回答"服务现在通不通" */
.login-state { display: flex; align-items: center; justify-content: center; gap: 9px;
  margin: 18px 0 0; padding: 8px 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
  font: 500 11.5px/1 var(--font-mono); color: var(--fg-dim); letter-spacing: .03em; }
.login-state .ok { color: var(--green); }
.login-state .err { color: var(--error); }
.login-card p.hint { margin: 14px 0 16px; font-size: 12.5px; color: var(--fg-muted); }
.login-card p.hint .mono { font-size: 11.5px; color: var(--fg-dim); }
.login-card .hb-btn { width: 100%; margin-top: 12px; }
.login-card .hb-btn.ghost { margin-top: 8px; }
.login-error { margin: 10px 0 0; font: 500 12px/1.6 var(--font-mono); color: var(--error); }
.spin { animation: hb-spin 1.1s linear infinite; }
@keyframes hb-spin { to { transform: rotate(360deg); } }

/* ============ 演示条(仅模板评审用, 实施时不带入) ============ */
.demo-bar { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center;
  padding: 8px 10px; background: var(--bg-elev); border: 1px solid var(--border-strong);
  font: 500 11.5px/1 var(--font-mono); color: var(--fg-dim); z-index: 10; }
.demo-bar button { padding: 5px 10px; border: 1px solid var(--border); background: transparent;
  color: var(--fg-muted); font: inherit; cursor: pointer; }
.demo-bar button.on { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); }
</style>
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" style="display:none">
  <symbol id="i-orbit" viewBox="0 0 16 16"><path d="M4.9 3.6A5.4 5.4 0 1 0 11.1 3.6" fill="none"/><circle cx="11.1" cy="3.6" r="1.7" fill="var(--green)" stroke="none"/><circle cx="8" cy="8" r="2.1"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.7" y="7.2" width="8.6" height="6.1" rx="0"/><path d="M5.7 7.2V5.5a2.3 2.3 0 0 1 4.6 0v1.7"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 3.1 14.2 13.2H1.8z"/><path d="M8 6.6v3.1M8 11.4v.7"/></symbol>
</svg>

<div class="login-mask">
  <form class="login-card hb-cut" id="card-form">
    <div class="brand">
      <span class="hb-mark hb-cut"><svg class="hb-ico lg" viewBox="0 0 16 16"><use href="#i-orbit"/></svg></span>
      <span>auto-qb</span>
    </div>
    <p class="login-sub">AUXILIARY SEEDING CONSOLE · WEB</p>
    <div class="login-state">
      <span class="led ok" id="state-led"></span>
      <span id="state-text">服务已就绪 · 等待鉴权</span>
    </div>
    <p class="hint">请输入 WEB 访问密钥<br><span class="mono">见启动日志 或 data_dir/web.token</span></p>
    <input class="hb-input important" type="password" placeholder="访问密钥" autocomplete="current-password">
    <button type="button" class="hb-btn primary">进入</button>
    <p class="login-error" id="form-error" hidden>AUTH_FAILED · 密钥不正确或已轮换</p>
  </form>

  <div class="login-card hb-cut" id="card-loading" hidden style="width:392px">
    <div class="brand">
      <span class="hb-mark hb-cut"><svg class="hb-ico lg" viewBox="0 0 16 16"><use href="#i-orbit"/></svg></span>
      <span>auto-qb</span>
    </div>
    <div class="login-state"><span class="led warn"></span><span>正在验证本地密钥…</span></div>
    <div style="display:flex;justify-content:center;padding:26px 0 6px">
      <svg class="hb-ico lg spin" style="width:26px;height:26px;color:var(--accent)" viewBox="0 0 16 16"><use href="#i-orbit"/></svg>
    </div>
  </div>

  <div class="login-card hb-cut" id="card-unavailable" hidden style="width:392px">
    <div class="brand">
      <span class="hb-mark hb-cut" style="--tone:var(--error);background:var(--error-soft);color:var(--error);border-color:var(--error-line)"><svg class="hb-ico lg" viewBox="0 0 16 16"><use href="#i-warn"/></svg></span>
      <span>auto-qb</span>
    </div>
    <div class="login-state"><span class="led err"></span><span class="err">服务不可达</span></div>
    <p class="hint">无法连接 auto-qb 服务<br><span class="mono">程序可能已退出或正在重启</span></p>
    <button type="button" class="hb-btn primary">重试连接</button>
  </div>
</div>

<div class="demo-bar">
  状态
  <button class="on" data-card="card-form">表单</button>
  <button data-card="card-loading">验证中</button>
  <button data-card="card-unavailable">服务不可达</button>
  <button id="err-toggle">错误文案</button>
</div>
<script>
const cards = ["card-form", "card-loading", "card-unavailable"];
document.querySelectorAll(".demo-bar button[data-card]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".demo-bar button[data-card]").forEach((x) => x.classList.toggle("on", x === b));
  cards.forEach((id) => document.getElementById(id).hidden = id !== b.dataset.card);
}));
const et = document.getElementById("err-toggle");
et.addEventListener("click", () => {
  const e = document.getElementById("form-error");
  e.hidden = !e.hidden;
  et.classList.toggle("on", !e.hidden);
  document.getElementById("state-led").className = "led " + (e.hidden ? "ok" : "err");
  document.getElementById("state-text").textContent = e.hidden ? "服务已就绪 · 等待鉴权" : "鉴权失败 · 请核对密钥";
});
</script>
</body>
</html>
