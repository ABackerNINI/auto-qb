<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="doc-refs" content="memory-bank/tasks/26-09-27-webui-curve-chart.md">
<title>config_editor.js 曲线图集成冒烟</title>
<style>
  :root { color-scheme: dark;
    --bg: #0e1218; --bg-card: #151b24; --fg: #e7ebf1; --fg-dim: #6c7a8e;
    --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .16);
    --border: #253045; --border-soft: rgba(255, 255, 255, .07); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.6 "Segoe UI", sans-serif; padding: 20px; }
  #err { color: #fbbf24; white-space: pre-wrap; }
  .ce-chart { position: relative; margin: 4px 0 18px; padding: 10px 12px 6px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid var(--border-soft); cursor: crosshair; max-width: 760px; }
  .ce-chart-svg { display: block; width: 100%; height: auto; aspect-ratio: 560 / 210; }
  /* 冒烟专项: 复现旧 shared/console_hub.css 的压扁规则, 验证悬停映射在 letterbox 下仍正确 */
  .squash .ce-chart-svg { height: 128px !important; aspect-ratio: auto !important; }
  .ce-chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .ce-chart-area { fill: var(--accent-soft); stroke: none; }
  .ce-grid-lines line { stroke: var(--border-soft); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ce-chart-tick { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  .ce-chart-cross { stroke: var(--fg-dim); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .ce-chart-dot { fill: var(--fg); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .ce-chart-svg .ce-axis-labels text { fill: var(--fg-dim); font-size: 10px; }
  .ce-chart-tip { position: absolute; transform: translate(10px, -50%); display: flex; flex-direction: column; gap: 1px;
    background: #1c2534; color: var(--fg-dim); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    font-size: 11px; white-space: nowrap; z-index: 3; pointer-events: none; }
  .ce-chart-tip.flip { transform: translate(calc(-100% - 10px), -50%); }
  .ce-chart-tip b { color: var(--fg); font-size: 12px; }
  .ce-chart-legend { display: flex; gap: 12px; padding: 4px 2px 0; font-size: 11px; color: var(--fg-dim); }
  .ce-chart-legend .ce-lg-note { margin-left: auto; }
  h3 { margin: 14px 0 4px; font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<pre id="err"></pre>
<script src="/src/auto_qb/webui/static/shared/vendor/vue.global.prod.js"></script>
<script src="/src/auto_qb/webui/static/shared/config_editor.js"></script>
<script>
window.addEventListener("error", (e) => { document.getElementById("err").textContent += "PAGE ERROR: " + e.message + "\n"; });
const app = Vue.createApp({
  mixins: [window.CONFIG_EDITOR],
  template: `
    <div v-for="(c, i) in cfgCurveList()" :key="i">
      <h3>曲线 {{ i + 1 }} · 上传</h3>
      <div v-if="cfgCurveChartOf(i, 'upload_curve')" class="ce-chart"
           @mousemove="cfgChartHover($event, i, 'upload_curve')" @mouseleave="cfgChartLeave()">
        <template v-for="ch in [cfgCurveChartOf(i, 'upload_curve')]" :key="'chu' + i">
          <svg class="ce-chart-svg" v-bind="{ viewBox: ch.viewBox }">
            <g class="ce-grid-lines">
              <line v-for="(tk, k) in ch.yTicks" :key="'gyu' + k" :x1="ch.padL" :x2="ch.w - ch.padR" :y1="tk.pos" :y2="tk.pos"></line>
            </g>
            <path class="ce-chart-area" :d="ch.area"></path>
            <line v-for="(tl, j) in ch.tierLines" :key="'tku' + j" class="ce-chart-tick"
                  :x1="tl.x" :x2="tl.x" :y1="ch.padT" :y2="ch.baseY"></line>
            <path class="ce-chart-line" :d="ch.line"></path>
            <g v-if="cfgChartHovered(i, 'upload_curve')">
              <line class="ce-chart-cross" :x1="cfg.chartHover.x" :x2="cfg.chartHover.x" :y1="ch.padT" :y2="ch.baseY"></line>
              <line class="ce-chart-cross" :x1="ch.padL" :x2="ch.w - ch.padR" :y1="cfg.chartHover.y" :y2="cfg.chartHover.y"></line>
              <circle class="ce-chart-dot" :cx="cfg.chartHover.x" :cy="cfg.chartHover.y" r="4"></circle>
            </g>
            <g class="ce-axis-labels">
              <text v-for="(tk, k) in ch.yTicks" :key="'lyu' + k" :x="ch.padL - 7" :y="tk.pos + 3.5" text-anchor="end">{{ tk.label }}</text>
              <text v-for="(tk, k) in ch.xTicks" :key="'lxu' + k" :x="tk.pos" :y="ch.h - 10" text-anchor="middle">{{ tk.label }}</text>
            </g>
          </svg>
          <div v-if="cfgChartHovered(i, 'upload_curve')" class="ce-chart-tip"
               :class="{ flip: cfg.chartHover.leftPct > 62 }"
               :style="{ left: cfg.chartHover.leftPct + '%', top: cfg.chartHover.topPct + '%' }">
            <b>第 {{ cfg.chartHover.index }} 档</b>
            <span>累计流量 {{ cfg.chartHover.tLabel }}</span>
            <span>限速 {{ cfg.chartHover.sLabel }}</span>
          </div>
          <div class="ce-chart-legend">
            <span class="ce-lg-x">横轴: 累计流量(按各档实际长度, 末档 ∞)</span>
            <span class="ce-lg-y">纵轴: 限速</span>
            <span class="ce-lg-note">{{ ch.note }}</span>
          </div>
        </template>
      </div>
      <h3>曲线 {{ i + 1 }} · 下载(六档悬殊, 容器被压扁到 128px 高)</h3>
      <div class="squash">
        <div v-if="cfgCurveChartOf(i, 'download_curve')" class="ce-chart"
             @mousemove="cfgChartHover($event, i, 'download_curve')" @mouseleave="cfgChartLeave()">
          <template v-for="ch in [cfgCurveChartOf(i, 'download_curve')]" :key="'chd' + i">
            <svg class="ce-chart-svg" v-bind="{ viewBox: ch.viewBox }">
              <g class="ce-grid-lines">
                <line v-for="(tk, k) in ch.yTicks" :key="'gyd' + k" :x1="ch.padL" :x2="ch.w - ch.padR" :y1="tk.pos" :y2="tk.pos"></line>
              </g>
              <path class="ce-chart-area" :d="ch.area"></path>
              <line v-for="(tl, j) in ch.tierLines" :key="'tkd' + j" class="ce-chart-tick"
                    :x1="tl.x" :x2="tl.x" :y1="ch.padT" :y2="ch.baseY"></line>
              <path class="ce-chart-line" :d="ch.line"></path>
              <g v-if="cfgChartHovered(i, 'download_curve')">
                <line class="ce-chart-cross" :x1="cfg.chartHover.x" :x2="cfg.chartHover.x" :y1="ch.padT" :y2="ch.baseY"></line>
                <line class="ce-chart-cross" :x1="ch.padL" :x2="ch.w - ch.padR" :y1="cfg.chartHover.y" :y2="cfg.chartHover.y"></line>
                <circle class="ce-chart-dot" :cx="cfg.chartHover.x" :cy="cfg.chartHover.y" r="4"></circle>
              </g>
              <g class="ce-axis-labels">
                <text v-for="(tk, k) in ch.yTicks" :key="'lyd' + k" :x="ch.padL - 7" :y="tk.pos + 3.5" text-anchor="end">{{ tk.label }}</text>
                <text v-for="(tk, k) in ch.xTicks" :key="'lxd' + k" :x="tk.pos" :y="ch.h - 10" text-anchor="middle">{{ tk.label }}</text>
              </g>
            </svg>
            <div v-if="cfgChartHovered(i, 'download_curve')" class="ce-chart-tip"
                 :class="{ flip: cfg.chartHover.leftPct > 62 }"
                 :style="{ left: cfg.chartHover.leftPct + '%', top: cfg.chartHover.topPct + '%' }">
              <b>第 {{ cfg.chartHover.index }} 档</b>
              <span>累计流量 {{ cfg.chartHover.tLabel }}</span>
              <span>限速 {{ cfg.chartHover.sLabel }}</span>
            </div>
            <div class="ce-chart-legend">
              <span class="ce-lg-x">横轴: 累计流量(按各档实际长度, 末档 ∞)</span>
              <span class="ce-lg-y">纵轴: 限速</span>
              <span class="ce-lg-note">{{ ch.note }}</span>
            </div>
          </template>
        </div>
      </div>
    </div>
  `,
  mounted() {
    // 与磁盘同构的 YAML 树(标量全字符串), 曲线 0: 上传=均匀三档(末档阈值 5TiB), 下载=六档悬殊
    this.cfg.tree = { config: { global_speed_limit_curve: {
      enabled: "true",
      traffic_source: [{ traffic_monitor: { dat_path: "" } }],
      curves: [{ curve: {
        period: "1D",
        upload_curve: [
          { "100GiB": { upload_speed_limit: "6MiB/s" } },
          { "200GiB": { upload_speed_limit: "4MiB/s" } },
          { "5TiB": { upload_speed_limit: "2MiB/s" } },
        ],
        download_curve: [
          { "10GiB": { download_speed_limit: "20MiB/s" } },
          { "50GiB": { download_speed_limit: "12MiB/s" } },
          { "60GiB": { download_speed_limit: "10MiB/s" } },
          { "200GiB": { download_speed_limit: "8MiB/s" } },
          { "210GiB": { download_speed_limit: "4MiB/s" } },
          { "500GiB": { download_speed_limit: "2MiB/s" } },
        ],
      } }],
    } } };
  },
});
app.mount("#app");
</script>
</body>
</html>
