---
config:
    qbittorrent:
        host: 127.0.0.1
        port: 16585
        username: abacker
        password: "132435."

    main_tick: 2S # 主循环时间间隔
    max_tasks_per_tick: 60 # 每个循环最大执行任务数

    # 内置任务检查间隔, 支持时间单位: S秒, M分, H时, D天
    # 注意: 间隔从"上一轮处理结束"开始计时, 单轮耗时超过间隔时不叠加
    interval: 60S

    log:
        file: "logs/auto-qb.log" # 日志文件路径, 留空仅输出控制台; 24/7运行建议落盘
        level: INFO # 日志等级
        max_bytes: 10MiB # 日志轮转大小
        format: "%(asctime)s - %(levelname)s - %(message)s" # 日志格式

    remove_similar_tags: true

    # 全局 HR 默认输出设置(站点 hr: 段未设置时兜底)
    hr:
        add_tag: "" # 满足HR触发条件的种子添加标签, 支持变量
        add_category: "!!HR${required_seeding_time}!!" # 分类格式, 支持变量
        overwrite_category: false
        add_tag_for_satisfied: "" # 做种时间已满足HR要求时间+额外时间的种子添加标签
        add_category_for_satisfied: "--HR${required_seeding_time}--"
        overwrite_category_for_satisfied: false

    # 添加集数标签
    add_episode_tags:
        enabled: true
        add_tag_single: "zE${episode_first}"
        add_tag_multi: "zE${episode_first}-${episode_last}"

    # 种子分组管理(辅种管理)
    grouping:
        enabled: true # 启用种子分组管理
        check_missing_files: true # 启用缺文件检查
        missing_tag: MISSING # 文件丢失时整组添加的标签

    # 全局标签清理(作为两个独立任务周期执行, 支持正则 regex: 前缀):
    delete_tags: # 彻底删除的标签格式(从所有种子移除并删除标签定义)
        - "M-Team - TP:ignore_case"
        - "regex:^BTSCHOOL"
    delete_tags_if_has_no_torrents: # 彻底删除无种子的标签格式(仅当没有任何种子使用时删除)
        - "@tracker_tags:ignore_case" # 引用全部 tracker 配置的标签
        - "regex:^zE.*"
        - "regex:^ORPHAN"

    # 全局限速曲线
    global_speed_limit_curve:
        interval: 10M
        traffic_source:
            - traffic_monitor: # Traffic Monitor: 流量监控软件, 可记录每天使用流量
                  dat_path: "D:/Programs/TrafficMonitor/history_traffic.dat"
            # 后续可能支持接入其它软件来源
        curves:
            - curve:
                  period: DAY
                  upload_curve: # 上传量达到指定值后, 限制上传速度
                      - 10GiB:
                            upload_speed_limit: 6MiB/s
                      - 20GiB:
                            upload_speed_limit: 5MiB/s
                      - 30GiB:
                            upload_speed_limit: 4MiB/s
                      - 50GiB:
                            upload_speed_limit: 2MiB/s
                      - 100GiB:
                            upload_speed_limit: 1MiB/s
                      - 1000GiB:
                            upload_speed_limit: 0.5MiB/s
                  download_curve: # 下载量达到指定值后, 限制下载速度
                      - 30GiB:
                            download_speed_limit: 11MiB/s
                      - 50GiB:
                            download_speed_limit: 10MiB/s
                      - 100GiB:
                            download_speed_limit: 5MiB/s
                      - 200GiB:
                            download_speed_limit: 2MiB/s
                      - 1000GiB:
                            download_speed_limit: 1MiB/s
            - curve:
                  period: MONTH
                  upload_curve: # 上传量达到指定值后, 限制上传速度
                      - 100GiB:
                            upload_speed_limit: 6MiB/s
                      - 200GiB:
                            upload_speed_limit: 5MiB/s
                      - 300GiB:
                            upload_speed_limit: 4MiB/s
                      - 500GiB:
                            upload_speed_limit: 2MiB/s
                      - 1000GiB:
                            upload_speed_limit: 1MiB/s
                      - 10000GiB:
                            upload_speed_limit: 0.5MiB/s
                  download_curve: # 下载量达到指定值后, 限制下载速度
                      - 600GiB:
                            download_speed_limit: 11MiB/s
                      - 1000GiB:
                            download_speed_limit: 10MiB/s
                      - 2000GiB:
                            download_speed_limit: 5MiB/s
                      - 3000GiB:
                            download_speed_limit: 2MiB/s
                      - 10000GiB:
                            download_speed_limit: 1MiB/s

    add_drive_letter_tag_rules:
        add_r_tag: # 为R盘的两个目录添加"R"标签
            enabled: true
            interval: 5S
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^R:/Download/PTing/"
                      - "regex:^R:/Download/ing/"
            actions:
                - add_tags:
                      - "R" # 添加"R"标签

    skip_checking_rules:
        i_rule: # I盘: 有参考文件的种子跳检, 无参考文件的种子不校验, 校验成功后自动开始
            enabled: true
            interval: 30M
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^I:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: skip-checking
                          auto_start: true
                      without_reference:
                          enabled: false # 禁用
                          mode: full-checking
                          auto_start: true
        r_rule: # R盘: 全部全量校验, 校验成功后自动开始
            enabled: true
            interval: 5M
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^R:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true
                      without_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true

    trackers:
        HHan:
            domains:
                - tracker.hhanclub.net
            tags:
                - HHan
            upload_speed_limit: 5000KiB/s
            download_speed_limit: 0KiB/s
            hr:
                required_seeding_time: 3D
                extra_seeding_time: 12H
                condition: 70%
                add_category: "??HR${required_seeding_time}??"
            rules:
                - "@add_drive_letter_tag_rules"
                - "@skip_checking_rules.r_rule" # HHan不跳检
        hdfans_org:
            domains:
                - hdfans.org
            tags:
                - HDFans
            upload_speed_limit: 0KiB/s
            download_speed_limit: 0KiB/s
            hr:
