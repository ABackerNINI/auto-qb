---
config:
    main_tick: 2S # 主循环时间间隔
    max_tasks_per_tick: 20 # 每个循环最大执行任务数

    interval: 60S # 内置任务检查间隔, 支持时间单位: S秒, M分, H时, D天
                  # 注意: 间隔从"上一轮处理结束"开始计时, 单轮耗时超过间隔时不叠加

    log:
        file: "logs/auto-qb.log" # 日志文件路径, 留空仅输出控制台; 24/7运行建议落盘
        level: INFO         # 日志等级
        max_bytes: 10MiB    # 日志轮转大小
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" # 日志格式

    remove_similar_tags: true

    # 全局 HR 默认输出设置(站点 hr: 段未设置时兜底)
    hr:
        add_tag: "" # 满足HR触发条件的种子添加标签, 支持变量
        add_category: "!!HR${required_seeding_time}!!" # 分类格式, 支持变量
        overwrite_category: false
        add_tag_for_satisfied: "" # 做种时间已满足HR要求时间+额外时间的种子添加标签
        add_category_for_satisfied: "--HR${required_seeding_time}--"
        overwrite_category_for_satisfied: false

    # skip_checking_for_cross_seeding: true
    # skip_checking_auto_start: true
    # add_skip_checking_tags: true
    # skip_checking_tag_format: "SKIP_CHECKING"

    add_episode_tags: true

    # 种子分组管理(辅种管理)
    grouping:
        enabled: true # 启用种子分组管理
        missing_tag: MISSING # 文件丢失时整组添加的标签

    # 全局标签清理(作为两个独立任务周期执行, 支持正则 regex: 前缀):
    delete_tags: # 彻底删除的标签格式(从所有种子移除并删除标签定义)
        - "M-Team - TP:ignore_case"
        - "regex:^BTSCHOOL"
    delete_tags_if_has_no_torrents: # 彻底删除无种子的标签格式(仅当没有任何种子使用时删除)
        - "@tracker_tags:ignore_case" # 引用全部 tracker 配置的标签
        - "regex:^zE.*"
        - "regex:^ORPHAN"

    qbittorrent:
        host: 127.0.0.1
        port: 16585
        username: abacker
        password: "132435."

    add_drive_letter_tag_rules:
        add_r_tag: # 为R盘的两个目录添加"R"标签
            enabled: true
            interval: 5S
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^R:/Download/PTing/"
                      - "regex:^R:/Download/ing/"
            actions:
                - add_tags:
                      - "R" # 添加"R"标签
            stop_following_rules_if: never

    trackers:
        HHan:
            domains:
                - tracker.hhanclub.net
            tags:
                - HHan
            upload_speed_limit: 5000KiB/s
            download_speed_limit: 0KiB/s
            hr:
                required_seeding_time: 3D
                extra_seeding_time: 12H
                condition: 70%
                add_category: "??HR${required_seeding_time}??"
            rules:
                - "@add_drive_letter_tag_rules"
        hdfans_org:
            domains:
                - hdfans.org
            tags:
                - HDFans
            upload_speed_limit: 0KiB/s
            download_speed_limit: 0KiB/s
            hr:
                required_seeding_time: 3D
                required_share_ratio: 1.1
                extra_seeding_time: 12H
                condition: 80%
            rules:
                - "@add_drive_letter_tag_rules"
        kufirc_com:
            domains:
