---
config:
    qbittorrent:
        host: 127.0.0.1
        port: 16585
        username: abacker
        password: "132435."

    # 运行时数据主目录: 状态/单实例锁/日志/跳检备份默认均存其下; 默认 auto-qb-data, 多实例请用不同路径
    data_dir: "auto-qb-data"

    # 主循环时间间隔
    main_tick: 2S
    # 每个循环最大执行任务数
    max_tasks_per_tick: 20

    # 内置任务检查间隔(从上一轮处理结束开始计时，不叠加)
    interval: 60S

    # 日志设置
    log:
        file: ""                 # 日志文件路径，默认 <data_dir>/logs/auto-qb.log
        level: INFO              # 日志等级
        max_bytes: 10MiB         # 日志轮转大小
        format: "%(asctime)s - %(levelname)s - %(message)s" # 日志格式

    # Web UI
    web:
        enabled: true        # 默认关闭(保守默认)
        host: "127.0.0.1"
        port: 38080

    # 主动通知: WARNING 及以上日志推送平台原生通知(默认关闭)
    notify:
        enabled: true              # 启用主动通知
        min_level: WARNING         # 通知最低日志级别: INFO / WARNING / ERROR
        quiet_hours: "" # 免打扰时段(支持跨午夜)，时段内跳过发送；留空不启用
        max_per_hour: 20           # 每小时通知上限，超出丢弃(防风暴)
        dedup_window: 10M          # 相同通知的去重窗口，0 表示不去重

    # 删除种子类似(单词相同大小写不同)的标签
    remove_similar_tags: true

    # 自动添加集数标签，仅种子添加时触发; 模板含 ${episode_first}/${episode_last} 占位,
    # 单集/多集分别配置，多集仅在集数连续时生成，不连续视为不可靠放弃添加
    add_episode_tags:
        enabled: true
        add_tag_single: "zE${episode_first}"                # 单集标签格式
        add_tag_multi: "zE${episode_first}-${episode_last}" # 多集标签格式

    # 种子分组管理(辅种管理)
    grouping:
        enabled: true             # 启用种子分组
        check_missing_files: true # 启用缺文件检查
        missing_tag: MISSING      # 文件丢失时整组添加的标签

    # 全局自动彻底删除标签
    delete_tags:                        # 彻底删除的标签格式，支持正则
        - "M-Team - TP:ignore_case"
        - "regex:^BTSCHOOL$"
    delete_tags_if_has_no_torrents:     # 无种子使用时才删除
        - "@tracker_tags:ignore_case"   # 引用全部 tracker 配置的标签， 并忽略大小写
        - "regex:^zE.*$"                # 删除所有集数标签

    # 全局 HR 设置(站点 hr: 段未设置时兜底)
    hr:
        add_tag: ''                                                     # 满足 HR 触发条件时添加的标签格式，支持变量
        add_category: '!!HR${required_seeding_time}!!'                  # 满足 HR 触发条件时添加的分类格式，支持变量
        overwrite_category: false                                       # HR 触发条件时是否覆盖分类 (qb中一个种子只能有一个分类)
        add_tag_for_satisfied: ''                                       # 做种时长满足要求时添加的标签格式
        add_category_for_satisfied: '--HR${required_seeding_time}--'    # 做种时长满足要求时添加的分类格式
        overwrite_category_for_satisfied: false                         # 做种时长满足要求时是否覆盖分类

    # 全局限速曲线
    global_speed_limit_curve:
        interval: 10M
        traffic_source:
            - traffic_monitor: # Traffic Monitor: 流量监控软件, 可记录每天使用流量
                  dat_path: "D:/Programs/TrafficMonitor/history_traffic.dat"
            # 后续可能支持接入其它软件来源
        curves:
            - curve:
                  period: DAY
                  upload_curve: # 上传量达到指定值后, 限制上传速度
                      - 10GiB:
                            upload_speed_limit: 6MiB/s
                      - 20GiB:
                            upload_speed_limit: 5.5MiB/s
                      - 30GiB:
                            upload_speed_limit: 5MiB/s
                      - 40GiB:
                            upload_speed_limit: 4MiB/s
                      - 50GiB:
                            upload_speed_limit: 3MiB/s
                      - 70GiB:
                            upload_speed_limit: 2MiB/s
                      - 100GiB:
                            upload_speed_limit: 1MiB/s
                      - 1000GiB:
                            upload_speed_limit: 0.5MiB/s
                  download_curve: # 下载量达到指定值后, 限制下载速度
                      - 30GiB:
                            download_speed_limit: 11MiB/s
                      - 50GiB:
                            download_speed_limit: 10MiB/s
                      - 100GiB:
                            download_speed_limit: 5MiB/s
                      - 200GiB:
                            download_speed_limit: 2MiB/s
                      - 1000GiB:
                            download_speed_limit: 1MiB/s
            - curve:
                  period: MONTH
                  upload_curve: # 上传量达到指定值后, 限制上传速度
                      - 100GiB:
                            upload_speed_limit: 6MiB/s
                      - 200GiB:
                            upload_speed_limit: 5MiB/s
                      - 300GiB:
                            upload_speed_limit: 4MiB/s
                      - 500GiB:
                            upload_speed_limit: 2MiB/s
                      - 1000GiB:
                            upload_speed_limit: 1MiB/s
                      - 10000GiB:
                            upload_speed_limit: 0.5MiB/s
                  download_curve: # 下载量达到指定值后, 限制下载速度
                      - 600GiB:
                            download_speed_limit: 11MiB/s
                      - 1000GiB:
                            download_speed_limit: 10MiB/s
                      - 2000GiB:
                            download_speed_limit: 5MiB/s
                      - 3000GiB:
                            download_speed_limit: 2MiB/s
                      - 10000GiB:
                            download_speed_limit: 1MiB/s

    add_drive_letter_tag_rules:
        add_r_tag: # 为R盘的两个目录添加"R"标签
            enabled: true
            trigger: on_torrent_added
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^R:/Download/PTing/"
                      - "regex:^R:/Download/ing/"
            actions:
                - add_tags:
                      - "R" # 添加"R"标签

    skip_checking_rules:
        i_rule: # I盘: 有参考文件的种子跳检, 无参考文件的种子不校验, 校验成功后自动开始
            enabled: true
            interval: 30M
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^I:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: skip-checking
                          auto_start: true
                      without_reference:
                          enabled: false # 禁用
                          mode: full-checking
                          auto_start: true
        r_rule_lt_10G: # R盘: 小于10GiB的种子全部全量校验, 校验成功后自动开始
            enabled: true
            interval: 5M
            cooldown: 5M
            conditions:
                - size: "<=10GiB"
                - path:
                      - "regex:^R:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true
                      without_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true
        r_rule_gt_10G: # R盘: 大于10GiB的有参考的种子跳检, 无参考的种子全量校验, 校验成功后自动开始
            enabled: true
            interval: 5M
            cooldown: 5M
            conditions:
                - size: ">10GiB"
                - path:
                      - "regex:^R:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: skip-checking
                          auto_start: true
                      without_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true

    hhan_checking_rules:
        i_rule: # I盘: 有参考文件的种子全量校验, 无参考文件的种子不校验, 校验成功后自动开始
            enabled: true
            interval: 30M
            cooldown: 5M
            conditions:
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true
                      without_reference:
                          enabled: false # 禁用
                          mode: full-checking
                          auto_start: true
        r_rule: # R盘: 全部全量校验, 校验成功后自动开始
            enabled: true
            interval: 5M
            cooldown: 5M
            conditions:
                - path:
                      - "regex:^R:/"
            actions:
                - checking:
                      basic_check: filelist
                      with_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true
                      without_reference:
                          enabled: true
                          mode: full-checking
                          auto_start: true

