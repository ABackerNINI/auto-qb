            tags:
                - Kufirc
            upload_speed_limit: 0KiB/s
            download_speed_limit: 0KiB/s
            rules:
                - "@add_drive_letter_tag_rules"
        pt_btschool_club:
            domains:
                - pt.btschool.club
            tags:
                - BTSchool
            upload_speed_limit: 0KiB/s
            download_speed_limit: 0KiB/s
            hr:
                required_seeding_time: 20H
